<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sendero: aprende inglés desde el español. Versión de prueba con la Sección 1, 108 lecciones.">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sendero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: documento de producto con cinco pestañas; la maqueta es un teléfono interactivo con índice de pantallas a la izquierda y notas de diseño a la derecha */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#14213D; --muted:#56627C; --line:#D9DEEA;
  --brand:#2747D8; --brand-ink:#FFFFFF; --brand-soft:#E3E8FC;
  --accent:#F2A516; --accent-ink:#14213D; --accent-soft:#FDF0D5;
  --ok:#17875B; --ok-soft:#DCF3E8; --bad:#C8392F; --bad-soft:#FBE2DF;
  --locked:#C6CCDA; --frame:#14213D; --flame:#E8641B;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1324; --surface:#161F37; --sunk:#1D2843; --ink:#E7EBF6; --muted:#9BA6C2; --line:#2A3556;
  --brand:#7089FF; --brand-ink:#0D1324; --brand-soft:#22305E;
  --accent:#F5B941; --accent-ink:#14213D; --accent-soft:#3A3018;
  --ok:#3FCB8E; --ok-soft:#123A2A; --bad:#FF7066; --bad-soft:#3E1C1B;
  --locked:#38425F; --frame:#05080F; --flame:#FF8A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1324; --surface:#161F37; --sunk:#1D2843; --ink:#E7EBF6; --muted:#9BA6C2; --line:#2A3556;
  --brand:#7089FF; --brand-ink:#0D1324; --brand-soft:#22305E;
  --accent:#F5B941; --accent-ink:#14213D; --accent-soft:#3A3018;
  --ok:#3FCB8E; --ok-soft:#123A2A; --bad:#FF7066; --bad-soft:#3E1C1B;
  --locked:#38425F; --frame:#05080F; --flame:#FF8A47; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--brand)}

.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:22px}
.mark{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.mark h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.mark small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note-strip{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:22px;font-size:14px}

/* maqueta */
.mock{display:grid;grid-template-columns:200px minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
.screens{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}
.screens h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 8px;font-family:var(--font-body)}
.screens button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer}
.screens button span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;width:18px;flex:none}
.screens button[aria-current="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.notes{display:flex;flex-direction:column;gap:18px;min-width:0}
.notes h2{font-size:24px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.notes dl{margin:0;display:grid;gap:14px}
.notes dt{font-weight:700;font-size:13px;color:var(--muted)}
.notes dd{margin:2px 0 0}
.open{border-left:3px solid var(--accent);padding-left:12px}

.phone{width:100%;max-width:380px;height:760px;border:10px solid var(--frame);border-radius:46px;background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;margin-inline:auto;box-shadow:0 18px 40px rgba(20,33,61,.18)}
.ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;flex:none}
.ph-body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.ph-nav{display:flex;border-top:1px solid var(--line);flex:none}
.ph-nav button{flex:1;border:0;background:transparent;padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.ph-nav button svg{width:22px;height:22px}
.ph-nav button[aria-current="true"]{color:var(--brand)}

.ico{width:18px;height:18px;flex:none}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.hud .chip{display:flex;gap:5px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.lvl{background:var(--brand-soft);color:var(--brand);padding:3px 9px;border-radius:999px;font-size:13px}
.c-flame{color:var(--flame)}.c-bolt{color:var(--accent)}

/* ruta */
.sec{margin:14px 14px 4px;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.sec .eyebrow{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.04em}
.sec h3{font-size:20px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.unit{margin:18px 14px 0}
.unit-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.unit-head.current{background:var(--accent-soft)}
.unit-head h4{font-size:15px}
.unit-head p{font-size:12px;color:var(--muted)}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mini.jump{border-color:var(--brand);color:var(--brand)}
.guide{margin-top:8px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0 6px}
.node{width:64px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;position:relative;background:var(--locked);color:var(--surface);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.node svg{width:26px;height:26px;position:relative}
.node.done{background:var(--brand);color:var(--brand-ink)}
.node.cur{background:var(--accent);color:var(--accent-ink)}
.node.skip{background:var(--brand-soft);color:var(--brand)}
.ring{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--accent) var(--p), var(--line) 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px))}
.tip{position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:4px 10px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
.tip.l{left:auto;right:calc(100% + 16px)}
.next-lvl{margin:22px 14px 22px;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.next-lvl h3{font-size:18px}
.next-lvl p{font-size:13px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* lección */
.lz{display:flex;flex-direction:column;flex:1;min-height:100%}
.lz-top{display:flex;gap:12px;align-items:center;padding:12px 16px}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;display:grid}
.prog{flex:1;height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s,background .3s}
.prog i.hot{background:var(--accent)}
.prog i.hot2{background:var(--flame)}
.qgl{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:2px dotted var(--muted)}
.glossline{font-size:14px;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;align-self:flex-start}
.wr{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical}
.fbx{display:flex;flex-wrap:wrap;gap:4px 14px}
.fbx button{border:0;background:transparent;padding:0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.again{color:var(--flame)}
.log{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;text-align:left}
.log div{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
.log div b{display:block;font-size:11px}
.log .y b{color:var(--ok)} .log .n b{color:var(--bad)}
.lz-main{flex:1;padding:6px 18px 18px;display:flex;flex-direction:column;gap:16px}
.lz-main h3{font-size:20px}
.tag{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
.combo{font-size:12px;font-weight:700;color:var(--accent);min-width:42px;text-align:right}
.budget{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.budget.warn{color:var(--bad)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.speaker{display:flex;gap:12px;align-items:center}
.play{width:56px;height:56px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.play svg{width:26px;height:26px}
.play.slow{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.answer-line{min-height:52px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:15px}
.word.used{visibility:hidden}
.word.bad{border-color:var(--bad);background:var(--bad-soft)}
.word.on{border-color:var(--brand);background:var(--brand-soft)}
.notecard{border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:16px;font-size:16px;line-height:1.55}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;font-size:15px}
.pair.sel{border-color:var(--brand);background:var(--brand-soft)}
.pair.gone{opacity:.25;cursor:default}
.pair.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pair.oir{color:var(--brand);display:flex;justify-content:center;align-items:center}
.pair.oir svg{width:24px;height:24px}
.sentence{font-size:20px;font-family:var(--font-display);font-weight:700}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.bubble{background:var(--sunk);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:85%}
.bubble b{display:block;font-size:12px;color:var(--muted)}
.learncard{border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;justify-items:start}
.learncard .big{font-family:var(--font-display);font-size:26px;font-weight:700}
.learncard .es{font-size:17px;color:var(--muted)}
.learncard .tipnote{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;justify-self:stretch}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:8px auto;cursor:pointer}
.mic svg{width:40px;height:40px}
.mic.on{background:var(--bad);animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.oido{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.oido b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.oido .w-ok{color:var(--ok);font-weight:700}.oido .w-no{color:var(--bad);text-decoration:underline}
.hint{font-size:13px;color:var(--muted)}
.transcript{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.lz-foot{padding:14px 16px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.lz-foot.ok{background:var(--ok-soft);border-top-color:transparent}
.lz-foot.bad{background:var(--bad-soft);border-top-color:transparent}
.lz-foot.retry{background:var(--accent-soft);border-top-color:transparent}
.fb{display:grid;gap:4px}
.fb h4{font-size:18px}
.lz-foot.ok .fb h4{color:var(--ok)}
.lz-foot.bad .fb h4{color:var(--bad)}
.fb p{font-size:14px}
.why{justify-self:start;border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.cta{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 rgba(0,0,0,.2);width:100%}
.cta:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.cta.ok{background:var(--ok);color:var(--surface)}
.cta.bad{background:var(--bad);color:var(--surface)}
.cta.warm{background:var(--accent);color:var(--accent-ink)}
.cta.ghost{background:transparent;color:var(--brand);box-shadow:none;border:2px solid var(--line)}

/* pantallas simples */
.pad{padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.hero-ph{display:grid;gap:10px;padding-top:18px}
.hero-ph h2{font-size:26px}
.choice{text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;display:grid;gap:2px}
.choice b{font-size:16px}
.choice span{font-size:13px;color:var(--muted)}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{background:var(--brand-soft);border-radius:16px;padding:14px;display:grid;gap:8px}
.scene .en{font-family:var(--font-display);font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big-ok{width:96px;height:96px;border-radius:28px;background:var(--accent);display:grid;place-items:center;margin:14px auto 0;color:var(--accent-ink)}
.big-ok svg{width:52px;height:52px}
.center{text-align:center}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rules li svg{margin-top:2px;color:var(--brand)}
.mistakes{display:grid;gap:6px;text-align:left}
.mistakes div{border-left:3px solid var(--bad);padding:4px 10px;font-size:14px;background:var(--surface)}
.mistakes div span{display:block;font-size:12px;color:var(--muted)}
.card{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.card .ic svg{width:22px;height:22px}
.card b{display:block}
.card span{font-size:13px;color:var(--muted)}
.card .count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.card.locked{opacity:.55;cursor:default}
.strength{display:grid;gap:8px}
.strength div{display:grid;grid-template-columns:minmax(0,1fr) 70px 72px;gap:8px;align-items:center;font-size:14px}
.strength em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:8px;border-radius:3px;background:var(--sunk)}
.meter i.on{background:var(--ok)}
.meter.weak i.on{background:var(--bad)}
.forecast{background:var(--ok-soft);border-radius:14px;padding:10px 12px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--sunk)}
.week i.on{background:var(--flame)}
.week i.free{background:transparent;border:2px dashed var(--flame)}
.skills{display:grid;gap:8px}
.skills div{display:grid;grid-template-columns:80px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.skills .track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.skills .track i{display:block;height:100%;background:var(--brand);border-radius:99px}
.skills em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cando{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.cando li{display:flex;gap:8px;font-size:14px}
.cando li svg{color:var(--ok);margin-top:2px}
.ring-row{display:flex;gap:14px;align-items:center}
.sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.later{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--muted)}
.reader{font-size:17px;line-height:1.8}
.gl{border:0;background:transparent;padding:0;font:inherit;cursor:pointer;border-bottom:2px dotted var(--brand);color:inherit}
.glossbar{position:sticky;bottom:0;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;font-size:14px}
.glossbar b{font-family:var(--font-display)}

/* documento */
.doc{max-width:980px;display:grid;gap:38px}
.doc section{display:grid;gap:14px}
.doc h2{font-size:26px}
.doc h3{font-size:18px}
.doc .lead{color:var(--muted);max-width:70ch}
.doc p,.doc li{max-width:74ch}
.doc ul,.doc ol{margin:0;padding-left:20px;display:grid;gap:6px}
.callout{background:var(--bad-soft);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.callout.warm{background:var(--accent-soft)}
.callout.cool{background:var(--brand-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td b{font-family:var(--font-display)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.conf{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;vertical-align:1px}
.conf.c{background:var(--ok-soft);color:var(--ok)}
.conf.p{background:var(--brand-soft);color:var(--brand)}
.conf.s{background:var(--accent-soft);color:var(--ink)}
.tree{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tree div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start}
.tree b{font-family:var(--font-display);font-size:17px}
.tree span{font-size:13px;color:var(--muted)}
.tree em{font-style:normal;font-weight:700;color:var(--brand);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.panel ul{font-size:14px}
.principles{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:pr}
.principles li{counter-increment:pr;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:none}
.principles li::before{content:counter(pr);font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--brand);line-height:1.1}
.principles b{display:block}
.principles small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.anatomy{display:flex;border-radius:12px;overflow:hidden;font-size:12px;font-weight:700;min-width:600px}
.anatomy div{padding:10px 8px;display:grid;gap:2px}
.anatomy div span{font-weight:400;opacity:.85}
.a1{background:var(--accent);color:var(--accent-ink)}
.a2{background:var(--brand);color:var(--brand-ink)}
.a3{background:var(--ok);color:var(--surface)}
.a4{background:var(--ink);color:var(--surface)}
.scroll{overflow-x:auto}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start;font-size:14px}
.steps b{font-family:var(--font-display);font-size:16px}
.src{font-size:13px;display:grid;gap:5px;padding-left:18px;margin:0}
.src li{max-width:none}

@media (max-width:1020px){
  .mock{grid-template-columns:minmax(0,1fr)}
  .screens{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .screens h3{display:none}
  .screens button{white-space:nowrap}
  .tree{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .grid2,.steps{grid-template-columns:1fr}
  .tree{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phone{height:720px;border-width:6px;border-radius:34px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const dialogosDe = b => (b.dialogos||[]).flatMap(d=>d.turnos.map(t=>({type:'dialog', tag:'Diálogo · '+d.titulo, q:'¿Qué contestas?', lines:[[t.quien,t.en]], opts:t.opts, a:t.a, why:t.por_que||null})));
const escuchaDe = b => (b.escucha||[]).flatMap(t=>t.preguntas.map(p=>({type:'story', tag:'Escucha sin leer', q:p.q, say:t.texto, opts:p.opts, a:p.a})));
function ejerciciosCurso(kind, opts){
  const un = opts.unit || S.unit, ni = opts.node ?? S.node, b = bloque(un);
  if(kind==='lesson'){ const ls = NODO_LECCIONES[ni] || [1,2,3]; const num = opts.replay ? ls[Math.floor(Math.random()*ls.length)] : ls[Math.min(S.session, ls.length-1)]; return b.lecciones[num-1].map(adaptar).filter(Boolean); }
  if(kind==='dialog') return dialogosDe(b);
  if(kind==='listen') return escuchaDe(b);
  if(kind==='review') return b.repaso.map(adaptar).filter(Boolean);
  if(kind==='sounds'){ const vistos=new Set(); const out=[];
    for(const bl of CURSO.bloques.filter(x=>x.bloque<=un)) for(const l of bl.lecciones) for(const x of l) if(x.tipo==='oido' && !vistos.has(x.opts.join('|'))){ vistos.add(x.opts.join('|')); out.push(adaptar(x)); }
    return shuffle(out).slice(0,10); }
  if(kind==='jump'||kind==='placement'){
    const desde = kind==='placement' ? 1 : S.unit, hasta = kind==='placement' ? 9 : Math.min(Math.min(S.jumpTo,10)-1, 9);
    const nums = []; for(let n=desde;n<=hasta;n++) nums.push(n);
    const por = kind==='placement' ? 2 : Math.max(2, Math.ceil(18/nums.length));
    return nums.flatMap(n=>shuffle(bloque(n).prueba).slice(0,por).map(x=>({...adaptar(x), tag:'Bloque '+n})));
  }
  return [];
}

/* ---------- motor de lección ---------- */
let L = null;
function startLesson(kind, opts){
  opts = opts||{};
  let items;
  if(CURSO){ items = ejerciciosCurso(kind, opts); if(!items.length) return; }
  else if(kind==='dialog') items = DIALOG;
  else if(kind==='listen') items = LISTEN;
  else if(kind==='review') items = shuffle(LESSON.filter(e=>!['learn','speak'].includes(e.type))).slice(0,6);
  else if(kind==='jump'||kind==='placement'){
    const from = S.unit, to = Math.min(S.jumpTo,10), span = Math.max(1,to-from);
    items = TEST_POOL.map((e,i)=>({...e, tag: kind==='placement' ? 'Prueba de nivel' : 'Bloque '+(from + Math.floor(i*span/TEST_POOL.length))}));
  }
  else if(!CURSO) items = LESSON;
  const test = kind==='jump'||kind==='placement';
  L = {kind, replay:!!opts.replay, blockTest:!!opts.blockTest, queue: items.map(e=>({...e})), total: items.filter(e=>e.type!=='speak').length,
       done:0, hits:0, tries:0, firstTry:true, combo:0, test, allowed: kind==='jump'?Math.floor(items.length*0.2):Infinity, errors:0,
       t0:Date.now(), ans:null, phase:'answer', weak:{}, mistakes:[], newItems:items.filter(e=>e.type==='learn'||e.tag==='Nuevo').length, showWhy:false, wrongIdx:[], log:[], note:null, fbk:null, qgloss:null};
  S.screen = test ? 'test' : 'lesson';
  render();
}

function vozTexto(e){
  const v = L.voz;
  if(!v) return '<p class="hint center">Toca el micrófono y lee la frase en voz alta.</p>';
  if(v.estado==='escuchando') return '<p class="hint center">Te escucho…</p>';
  if(v.estado==='oido'){
    const pal = v.p.palabras.map((w,k)=>`<span class="${v.p.marcas[k]?'w-ok':'w-no'}">${esc(w)}</span>`).join(' ');
    return `<div class="oido"><b>Te entendí</b>«${esc(v.texto)}»<br>${pal}</div>${v.ok?'':'<p class="hint">Las palabras subrayadas no se entendieron. Vuelve a intentarlo: más despacio y marcando el final de cada palabra.</p>'}`;
  }
  if(v.estado==='silencio') return '<p class="hint center">No te oí. Toca el micrófono e inténtalo otra vez.</p>';
  if(v.estado==='denegado') return '<p class="hint center">El micrófono no tiene permiso en este navegador. Puedes darlo desde el candado de la barra de direcciones o marcar tú si la dijiste.</p>';
  if(v.estado==='sin') return '<p class="hint center">Este navegador no reconoce voz (prueba en Chrome o en Safari con Siri activado). Marca tú si la dijiste.</p>';
  return `<p class="hint center">No se pudo usar el micrófono (${esc(v.detalle||'error')}). Marca tú si la dijiste.</p>`;
}
function infoAudio(e){
  const oyo = e.type==='tapwords' && e.lista===false ? e.say : e.type==='story' ? e.say : e.oyo || null;
  const sig = ['listen','tapwords','speak'].includes(e.type) && e.es ? e.es : null;
  return (oyo ? `<p class="hint">El audio decía: «${esc(oyo)}»</p>` : '') + (sig ? `<p class="hint">${e.type==='tapwords'&&e.lista!==false?'':'Significado: '}${esc(sig)}</p>` : '');
}
function vLesson(){
  const e = L.queue[0];
  const pct = Math.min(100, L.done/Math.max(1,L.total)*100);
  let right;
  if(L.kind==='jump'){ right = `<span class="budget ${L.errors>=L.allowed?'warn':''}">Errores ${L.errors}/${L.allowed}</span>`; }
  else if(L.test){ right = `<span class="budget">Nivel</span>`; }
  else right = `<span class="combo">${L.combo>=3?L.combo+' seguidas':''}</span>`;
  const qhtml = e.gl ? e.q.split(' ').map(w=>{ const k=w.replace(/[¿?¡!.,]/g,''); return e.gl[k]?`<button class="qgl" data-qgloss="${esc(k)}">${esc(w)}</button>`:esc(w); }).join(' ') : esc(e.q);
  let body = `<div class="tag ${e._again?'again':''}">${e._again?'↻ Error anterior':esc(e.tag||'')}</div>${e.type==='learn'?'':`<h3>${qhtml}</h3>`}${L.qgloss&&e.gl&&e.gl[L.qgloss]?`<p class="glossline">${esc(L.qgloss)} → ${esc(e.gl[L.qgloss])}</p>`:''}`;
  const optList = ()=>`<div class="opts">${e.opts.map((o,i)=>`<button class="opt" data-opt="${i}" aria-pressed="${L.ans===i}">${esc(o)}</button>`).join('')}</div>`;
  if(e.type==='learn'){
    body += `<div class="learncard"><button class="play" data-say="${esc(e.en)}" aria-label="Escuchar">${I.speaker}</button>
      <p class="big">${esc(e.en)}</p><p class="es">${esc(e.es)}</p><p class="tipnote">${esc(e.note)}</p></div>`;
  } else if(e.type==='note'){
    body += `<div class="notecard">${esc(e.text)}</div>`;
  } else if(e.type==='tapwords'){
    const sel = L.ans || [];
    const audioTW = e.say || e.words.join(', ');
    body += `<div class="speaker"><button class="play" data-say="${esc(audioTW)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(audioTW)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>
      <div class="bank">${e.opciones.map((w,k)=>`<button class="word ${sel.includes(k)?'on':''}" data-tw="${k}" aria-pressed="${sel.includes(k)}">${esc(w)}</button>`).join('')}</div><p class="hint">${e.lista===false ? 'Toca solo las palabras que aparecen en la frase.' : 'Alguna de las palabras no suena.'}</p>`;
  } else if(e.type==='choose'){
    if(e.say) body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>`;
    body += optList();
  } else if(e.type==='dialog'){
    body += e.lines.map(([w,t])=>`<div class="speaker"><button class="play slow" data-say="${esc(t)}" aria-label="Escuchar">${I.speaker}</button><div class="bubble"><b>${esc(w)}</b>${esc(t)}</div></div>`).join('') + optList();
  } else if(e.type==='story'){
    body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button>
      <button class="mini" data-transcript="1">${L.showText?'Ocultar texto':'Ver texto'}</button></div>
      ${L.showText?`<p class="transcript">${esc(e.say)}</p>`:'<p class="hint">Primero escucha sin leer. Si no lo entiendes, escúchalo despacio o mira el texto.</p>'}` + optList();
  } else if(e.type==='pair'){
    if(e._a===undefined) e._a = Math.random()<.5?0:1;
    body += `<div class="speaker"><button class="play" data-say="${esc(e.opts[e._a])}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.opts[e._a])}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>` + optList();
  } else if(e.type==='fill'){
    const opts = e._o || (e._o = shuffle(e.opts));
    const bad = L.phase==='retry'||L.phase==='bad';
    body += `<p class="sentence">${esc(e.pre)} <span class="blank ${bad?'bad':''}">${L.ans?esc(L.ans):'&nbsp;'}</span> ${esc(e.post)}</p>
      <div class="bank">${opts.map(o=>`<button class="word" data-fill="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if(e.type==='listen' || e.type==='build'){
    const bank = e._b || (e._b = shuffle(e.bank).map(w=>({w})));
    const picked = L.ans || [];
    if(e.type==='listen') body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>`;
    body += `<div class="answer-line">${picked.map((k,pos)=>`<button class="word ${L.wrongIdx.includes(pos)?'bad':''}" data-unpick="${k}">${esc(bank[k].w)}</button>`).join('')}</div>
      <div class="bank">${bank.map((b,k)=>`<button class="word ${picked.includes(k)?'used':''}" data-pick="${k}">${esc(b.w)}</button>`).join('')}</div>`;
  } else if(e.type==='match'){
    const st = e._m || (e._m = {left:shuffle(e.pairs.map(p=>p[0])), right:shuffle(e.pairs.map(p=>p[1])), gone:[], sel:null, wrong:null});
    const cell = (side,w)=>{ const id=side+':'+w; const gone=st.gone.includes(id);
      const altavoz = e.oido && side==='L' && !gone;
      return `<button class="pair ${gone?'gone':''} ${st.sel===id?'sel':''} ${st.wrong&&st.wrong.includes(id)?'wrong':''} ${altavoz?'oir':''}" data-pair="${esc(id)}" ${gone?'disabled':''} ${altavoz?'aria-label="Escuchar palabra"':''}>${altavoz?I.speaker:esc(w)}</button>`; };
    body += `<div class="pairs">${st.left.map((w,i)=>cell('L',w)+cell('R',st.right[i])).join('')}</div>`;
  } else if(e.type==='write'){
    body += `<textarea class="wr" id="wr" placeholder="Escribe en inglés" aria-label="Tu respuesta en inglés" ${L.phase==='answer'?'':'readonly'}>${esc(L.ans||'')}</textarea><p class="hint">Enter para comprobar.</p>`;
  } else if(e.type==='speak'){
    body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><p class="sentence">${esc(e.say)}</p></div>
      ${e.es?`<p class="hint">${esc(e.es)}</p>`:''}<button class="mic ${L.voz?.estado==='escuchando'?'on':''}" data-mic="1" aria-label="Hablar">${I.mic}</button>
      ${vozTexto(e)}`;
  }
  let foot;
  if(L.phase==='answer'){
    if(e.type==='learn'||e.type==='note') foot = `<div class="lz-foot"><button class="cta" data-learned="1">Continuar</button></div>`;
    else if(e.type==='speak'){ const v=L.voz, manual = v && ['denegado','sin','error'].includes(v.estado);
      foot = v && v.estado==='oido' && v.ok ? `<div class="lz-foot ok"><div class="fb"><h4>¡Se te entiende!</h4>${infoAudio(e)}</div><button class="cta ok" data-said="1">Continuar</button></div>`
        : v && v.estado==='oido' && v.intentos>=2 ? `<div class="lz-foot retry"><div class="fb"><h4>Sigue practicándola</h4><p>No cuenta como error: la frase volverá en tu repaso.</p></div><button class="cta warm" data-skipspeak="1">Continuar</button></div>`
        : manual ? `<div class="lz-foot"><button class="cta" data-said="1">Lo dije</button><button class="cta ghost" data-skipspeak="1">No puedo hablar ahora</button></div>`
        : `<div class="lz-foot"><button class="cta ghost" data-skipspeak="1">No puedo hablar ahora</button></div>`; }
    else if(e.type==='match') foot = `<div class="lz-foot"><p class="hint center">Une todos los pares para seguir.</p></div>`;
    else { const ready = e.type==='write' ? !!(L.ans&&L.ans.trim()) : Array.isArray(L.ans) ? L.ans.length>0 : L.ans!==null;
      foot = `<div class="lz-foot"><button class="cta" data-check="1" ${ready?'':'disabled'}>Comprobar</button></div>`; }
  } else if(L.phase==='retry'){
    foot = `<div class="lz-foot retry"><div class="fb"><h4>Casi</h4><p>${esc(e.hint||'Revisa la parte marcada.')}</p></div>
      <button class="cta warm" data-retry="1">Intentar otra vez</button></div>`;
  } else {
    const ok = L.phase==='ok';
    const whyBtn = e.why && !L.test ? (L.showWhy ? `<p class="hint">${esc(e.why)}</p>` : `<button class="why" data-why="1">¿Por qué?</button>`) : '';
    const fbx = L.test ? '' : (L.fbk ? `<p class="hint">${esc(L.fbk)}</p>` : `<div class="fbx"><button data-fbk="easy">Demasiado fácil</button><button data-fbk="hard">Demasiado difícil</button><button data-fbk="report">Reportar</button></div>`);
    foot = `<div class="lz-foot ${ok?'ok':'bad'}"><div class="fb"><h4>${ok?(L.note?L.note[0]:pickPraise()):'Respuesta correcta:'}</h4>
      ${ok?(L.note?`<p>${esc(L.note[1])}</p>`:''):`<p>${esc(solution(e))}</p>`}${infoAudio(e)}${whyBtn}${!ok&&!L.test?'<p class="hint">Volverá dentro de 3 ejercicios y otra vez al final de la lección.</p>':''}${fbx}</div>
      <button class="cta ${ok?'ok':'bad'}" data-next="1">Continuar</button></div>`;
  }
  return `<div class="lz"><div class="lz-top"><button class="x" data-quit="1" aria-label="Salir">${I.close}</button>
    <div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i class="${L.combo>=8?'hot2':L.combo>=5?'hot':''}" style="width:${pct}%"></i></div>${right}</div>
    <div class="lz-main">${body}</div>${foot}</div>`;
}
const PRAISE=['¡Bien!','¡Correcto!','¡Eso es!'];
function pickPraise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}
function solution(e){
  if(e.type==='pair') return e.opts[e._a];
  if(['choose','dialog','story'].includes(e.type)) return e.opts[e.a];
  if(e.type==='fill') return (e.a==='(nada)' ? `${e.pre} ${e.post}` : `${e.pre} ${e.a} ${e.post}`).trim();
  if(e.type==='tapwords') return e.words.join(', ');
  if(e.type==='write') return e.answers[0];
  if(e.traducir) return e.frase || e.a;
  return e.a;
}
function evaluate(){
  const e=L.queue[0];
  if(e.type==='pair') return record(L.ans===e._a, e);
  if(['choose','dialog','story'].includes(e.type)) return record(L.ans===e.a, e);
  if(e.type==='tapwords'){ const got=new Set(L.ans.map(k=>e.opciones[k])); return record(got.size===e.words.length && e.words.every(w=>got.has(w)), e); }
  if(e.type==='fill'){
    if(L.ans===e.a) return record(true,e);
    if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  if(e.type==='write'){
    const res = gradeWrite(L.ans||'', e.answers);
    if(res.ok){ if(res.typo) L.note=['Tienes un pequeño error:', res.target]; else if(res.alt) L.note=['Otra solución correcta:', e.answers[0]]; return record(true,e); }
    if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  // listen / build (en "Escucha y traduce" las fichas son español: se comparan tal cual, con tildes)
  const got = L.ans.map(k=>e._b[k].w), want = e.a.split(' ');
  const nn = e.traducir ? (t=>t.toLowerCase().replace(/\s+/g,' ').trim()) : norm;
  if(nn(got.join(' '))===nn(e.a)) return record(true,e);
  if((e.alts||[]).some(a=>nn(got.join(' '))===nn(a))){ L.note=['Otra solución correcta:', e.a]; return record(true,e); }
  L.wrongIdx = got.map((w,i)=>nn(w)===nn(want[i]||'')?-1:i).filter(i=>i>=0);
  if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
  record(false,e);
}
/* ---------- sonidos de respuesta ---------- */
let sonidoMem = true, actx = null;
const sonidoOn = () => { try{ const v = localStorage.getItem('sendero-sonido'); return v===null ? sonidoMem : v!=='0'; }catch(x){ return sonidoMem; } };
const SONIDOS = {
  ok:  [[880,0,.16,'sine',.2],[1760,0,.12,'sine',.05],[1318.5,.08,.4,'sine',.2],[2637,.08,.25,'sine',.04]],
  mal: [[220,0,.18,'triangle',.22],[164.8,.13,.32,'triangle',.2]],
  fin: [[523.3,0,.14,'sine',.18],[659.3,.12,.14,'sine',.18],[784,.24,.14,'sine',.18],[1046.5,.36,.5,'sine',.2]],
};
function tono(nombre){
  if(!sonidoOn()) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t0 = actx.currentTime + 0.01;
    for(const [fr, ini, dur, tipo, vol] of SONIDOS[nombre]){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = tipo; o.frequency.value = fr;
      g.gain.setValueAtTime(0.0001, t0+ini); g.gain.exponentialRampToValueAtTime(vol, t0+ini+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0+ini+dur);
      o.connect(g); g.connect(actx.destination); o.start(t0+ini); o.stop(t0+ini+dur+0.05);
    }
  }catch(x){}
}

/* ---------- voz: reconocimiento del navegador (Chrome, Safari con Siri) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const DEC = {20:'twenty',30:'thirty',40:'forty',50:'fifty',60:'sixty',70:'seventy',80:'eighty',90:'ninety',100:'one hundred'};
function enLetras(n){ n=+n; if(n<20) return NUM[n]; if(DEC[n]) return DEC[n]; if(n<100) return DEC[n-n%10]+' '+NUM[n%10]; return String(n); }
function paraVoz(t){ return t.replace(/(\d+):00/g,"$1 o'clock").replace(/(\d+):30/g,'half past $1').replace(/\$(\d+)/g,'$1 dollars').replace(/\b\d{1,3}\b/g, d=>enLetras(d)).replace(/-/g,' '); }
function puntuarVoz(oido, objetivo){
  const a = canon(paraVoz(objetivo)), b = canon(paraVoz(oido)), usado = new Set();
  const marcas = a.map(w=>{ const k=b.findIndex((x,i)=>!usado.has(i) && (x===w || (w.length>3 && lev(x,w)<=1))); if(k>=0){ usado.add(k); return true; } return false; });
  return { nota: marcas.filter(Boolean).length / Math.max(1,a.length), marcas, palabras: objetivo.replace(/[.?!,]/g,'').split(/\s+/) };
}
let reco = null;
function escuchar(e){
  if(!SR){ L.voz = {estado:'sin'}; render(); return; }
  try{ if(reco) reco.abort(); }catch(x){}
  reco = new SR(); reco.lang = 'en-US'; reco.interimResults = false; reco.maxAlternatives = 5;
  L.voz = {estado:'escuchando', intentos:(L.voz?.intentos||0)}; render();
  reco.onresult = ev => {
    const alts = [...ev.results[0]].map(x=>x.transcript);
    let mejor = null; for(const t of alts){ const p = puntuarVoz(t, e.say); if(!mejor || p.nota > mejor.p.nota) mejor = {t, p}; }
    const intentos = (L.voz?.intentos||0) + 1;
    L.voz = {estado:'oido', texto:mejor.t, p:mejor.p, ok:mejor.p.nota>=0.8, intentos}; tono(mejor.p.nota>=0.8 ? 'ok' : 'mal'); render();
  };
  reco.onerror = ev => { L.voz = {estado: ev.error==='not-allowed'||ev.error==='service-not-allowed' ? 'denegado' : ev.error==='no-speech' ? 'silencio' : 'error', detalle:ev.error, intentos:L.voz?.intentos||0}; render(); };
  reco.onend = () => { if(L && L.voz && L.voz.estado==='escuchando'){ L.voz = {estado:'silencio', intentos:L.voz.intentos||0}; render(); } };
  try{ reco.start(); }catch(x){ L.voz = {estado:'error', detalle:String(x)}; render(); }
}

/* Corrección de respuestas escritas: normalizar, aceptar variantes y erratas pequeñas */
const CONTR = {"i'm":"i am","im":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","don't":"do not","doesn't":"does not","isn't":"is not","aren't":"are not","can't":"cannot"};
function canon(s){ return s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[.,!?¿¡]/g,' ').split(/\s+/).filter(Boolean).map(w=>CONTR[w]||w).join(' ').split(' ').filter(Boolean); }
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); } return d[a.length][b.length]; }
/* palabras reales que no se aceptan como errata de otra (en la app real: el léxico completo) */
const LEXICON = new Set(['than','then','is','its','it','in','on','am','an','a','are','from','form','for','of','off']);
function gradeWrite(input, answers){
  const got = canon(input);
  for(let i=0;i<answers.length;i++){ if(canon(answers[i]).join(' ')===got.join(' ')) return {ok:true, alt:i>0}; }
  for(const ans of answers){ const want=canon(ans); if(want.length!==got.length) continue;
    let typo=false, okAll=true;
    for(let k=0;k<want.length;k++){ if(want[k]===got[k]) continue;
      const tol = want[k].length<=3?0:want[k].length<=7?1:2;
      if(LEXICON.has(got[k]) || lev(want[k],got[k])>tol){ okAll=false; break; } typo=true; }
    if(okAll) return {ok:true, typo, target:ans}; }
  return {ok:false};
}
function record(ok, e){
  L.tries++;
  L.log.push({q:e.q, ok, a:solution(e)});
  if(ok){ L.hits++; L.combo++; L.phase='ok'; tono('ok'); }
  else {
    L.combo=0; L.phase='bad'; L.firstTry=false; L.errors++; tono('mal');
    L.weak[e.tag]=(L.weak[e.tag]||0)+1;
    if(!L.mistakes.some(m=>m.q===e.q)) L.mistakes.push({q:e.q, correct:solution(e)});
  }
  render();
}
function next(){
  const e=L.queue.shift();
  const wasOk = L.phase==='ok';
  if(wasOk || L.test) L.done++;
  if(!wasOk && !L.test){ const c={...e}; delete c._b; delete c._o; delete c._m; delete c._tried; delete c._a;
    const first = !e._again; c._again=true; L.queue.splice(Math.min(3,L.queue.length),0,c); if(first) L.queue.push({...c}); }
  L.ans=null; L.phase='answer'; L.micTried=false; L.showWhy=false; L.showText=false; L.wrongIdx=[]; L.note=null; L.fbk=null; L.qgloss=null;
  if(L.kind==='jump' && L.errors>L.allowed){ finish(false); return; }
  if(!L.queue.length){ finish(true); return; }
  render();
}
function advance(){
  const t = NODE_TYPES[S.node];
  S.session++;
  if(S.session>=SESSIONS[t]){ S.node++; S.session=0; if(S.node>=NODE_TYPES.length){ S.unit=Math.min(9,S.unit+1); S.node=0; } }
}
function finish(passed){
  const secs = Math.round((Date.now()-L.t0)/1000);
  const time = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  const acc = Math.round(L.hits/Math.max(1,L.tries)*100);
  if(L.kind==='placement'){
    let to = CURSO ? 9 : Math.max(1, Math.min(9, 1 + Math.round(acc/100*4)));
    if(CURSO) for(let n=1;n<=9;n++) if(L.weak['Bloque '+n]){ to=n; break; }
    for(let n=1;n<to;n++) if(!S.skipped.includes(n)) S.skipped.push(n);
    S.unit=Math.max(S.unit,to); S.node=0; S.session=0;
    S.lastResult={kind:'placement',to:S.unit};
  } else if(L.kind==='jump'){
    if(!passed || acc<80){
      const weak = Object.entries(L.weak).sort((a,b)=>b[1]-a[1])[0];
      S.lastResult={kind:'jumpfail',weak:(weak?weak[0]:'Bloque '+S.unit).replace('Bloque','bloque')};
    } else {
      const to = Math.min(S.jumpTo,9);
      if(L.blockTest && S.jumpTo>9){ S.node=NODE_TYPES.length; S.session=0; S.xp+=15; S.today+=15; S.lastResult={kind:'section',xp:15,acc,time,to:10}; }
      else if(L.blockTest){ S.unit=to; S.node=0; S.session=0; S.xp+=15; S.today+=15; S.lastResult={kind:'block',xp:15,acc,time,to}; }
      else { for(let n=S.unit;n<to;n++) if(!S.skipped.includes(n)) S.skipped.push(n);
        S.unit=to; S.node=0; S.session=0; S.xp+=20; S.today+=20; S.lastResult={kind:'jump',xp:20,acc,time,to}; }
    }
  } else {
    const perfect = L.firstTry && L.kind==='lesson' && !L.replay;
    const xp = L.replay ? 5 : L.kind==='review' ? 8 : 10 + (perfect?5:0);
    S.xp+=xp; S.today+=xp;
    if(!L.replay && L.kind!=='review') advance();
    if(L.kind==='review' && !L.replay && NODE_TYPES[S.node]==='review' && L.fromNode) advance();
    S.lastResult={kind:L.replay?'replay':L.kind,xp,acc,time,perfect,newItems:L.replay?0:L.newItems,mistakes:L.mistakes,log:L.log}; S.showLog=false;
  }
  tono(S.lastResult && S.lastResult.kind==='jumpfail' ? 'mal' : 'fin');
  S.screen='result'; L=null; render();
}

/* ---------- render ---------- */
function render(){
  const views = {welcome:vWelcome, path:vPath, result:vResult, jump:vJump, review:vReview, library:vLibrary, progress:vProgress, lesson:vLesson, test:vLesson};
  const keep = (S.screen==='lesson'||S.screen==='test'||S.screen==='library') ? ph.scrollTop : 0;
  ph.innerHTML = views[S.screen]();
  guardar();
  ph.scrollTop = keep;
  renderNav(); renderIndex();
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.tab){
    document.querySelectorAll('.tabs button').forEach(t=>t.setAttribute('aria-selected', t===b));
    ['mock','method','struct','study','refs'].forEach(p=>document.getElementById('panel-'+p).hidden = p!==d.tab);
    try{ localStorage.setItem('sendero-tab', d.tab); }catch(e){}
    return;
  }
  if(d.say){ speak(d.say, !!d.slow); if(!L) return; }
  if(d.go){ go(d.go); return; }
  if(d.motive){ S.motive=d.motive; S.welcome=1; render(); return; }
  if(d.sonido){ sonidoMem = !sonidoOn(); try{ localStorage.setItem('sendero-sonido', sonidoMem?'1':'0'); }catch(x){} if(sonidoMem) tono('ok'); render(); return; }
  if(d.reset){ Object.assign(S,{unit:1,node:0,session:0,skipped:[],xp:0,today:0,streak:0,screen:'path'}); render(); return; }
  if(d.placement){ S.jumpMode='placement'; S.screen='jump'; render(); return; }
  if(d.jump){ S.jumpTo=+d.jump; S.jumpMode='skip'; S.screen='jump'; render(); return; }
  if(d.start){ startLesson(d.start); return; }
  if(d.read){ S.reading=true; S.gloss=null; render(); return; }
  if(d.closeread){ S.reading=false; render(); return; }
  if(d.gloss){ S.gloss=d.gloss.split('|'); speak(S.gloss[0]); render(); return; }
  if(d.guide){
    const u = UNITS[+d.guide-1], head = b.closest('.unit-head');
    if(head.nextElementSibling && head.nextElementSibling.classList.contains('guide')){ head.nextElementSibling.remove(); return; }
    const g = document.createElement('div'); g.className='guide';
    g.innerHTML = `<b>${esc(u.goal)}.</b> ${u.guide}`; head.after(g); return;
  }
  if(d.node){
    const [un,ni] = d.node.split(':').map(Number);
    const st = unitState(un);
    const done = st==='done'||st==='skipped'||(st==='current'&&ni<S.node);
    const cur = st==='current'&&ni===S.node;
    if(!done && !cur){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    const t = NODE_TYPES[ni];
    if(t==='test' && cur){ S.jumpTo=Math.min(un+1,10); startLesson('jump',{blockTest:true}); return; }
    if(t==='test') { startLesson('review',{replay:true, unit:un}); return; }
    startLesson(t, {replay:done, unit:un, node:ni});
    if(t==='review' && cur) L.fromNode = true;
    return;
  }
  if(d.showlog){ S.showLog=true; render(); return; }
  if(!L) return;
  const e = L.queue[0];
  if(d.qgloss){ L.qgloss=d.qgloss; render(); return; }
  if(d.fbk){ L.fbk = d.fbk==='report' ? 'Gracias. Revisaremos este ejercicio; si tu respuesta debería valer, la añadiremos.' : 'Gracias. Lo usamos para ajustar la dificultad de tus próximas lecciones.'; render(); return; }
  if(d.quit){ try{ reco && reco.abort(); }catch(x){} L=null; S.screen='path'; render(); return; }
  if(d.say) return;
  if(d.transcript){ L.showText=!L.showText; render(); return; }
  if(d.why){ L.showWhy=true; render(); return; }
  if(d.next){ next(); return; }
  if(d.retry){ L.phase='answer'; render(); return; }
  if(L.phase!=='answer') return;
  if(d.learned){ L.queue.shift(); L.done++; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.opt!==undefined){ L.ans=+d.opt; render(); return; }
  if(d.fill){ L.ans=d.fill; render(); return; }
  if(d.tw!==undefined){ const k=+d.tw, sel=L.ans||[]; L.ans = sel.includes(k) ? sel.filter(x=>x!==k) : sel.concat(k); speak(e.opciones[k]); render(); return; }
  if(d.pick!==undefined){ L.ans=(L.ans||[]).concat(+d.pick); L.wrongIdx=[]; speak(e._b[+d.pick].w); render(); return; }
  if(d.unpick!==undefined){ L.ans=L.ans.filter(k=>k!==+d.unpick); L.wrongIdx=[]; render(); return; }
  if(d.check){ evaluate(); return; }
  if(d.mic){ L.micTried=true; escuchar(e); return; }
  if(d.said){ L.queue.shift(); L.done++; L.tries++; L.hits++; L.voz=null; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.skipspeak){ try{ reco && reco.abort(); }catch(x){} L.queue.shift(); L.voz=null; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.pair){
    const st=e._m, id=d.pair;
    if(!st.sel || st.sel[0]===id[0]){ st.sel=id; st.wrong=null; if(id[0]==='L') speak(id.slice(2)); render(); return; }
    const Lk = st.sel[0]==='L'?st.sel:id, Rk = st.sel[0]==='R'?st.sel:id;
    if(e.pairs.some(p=>'L:'+p[0]===Lk && 'R:'+p[1]===Rk)){ st.gone.push(Lk,Rk); st.sel=null; st.wrong=null; }
    else { st.wrong=[Lk,Rk]; st.sel=null; L.combo=0; L.firstTry=false; }
    if(st.gone.length===e.pairs.length*2){ L.tries++; L.hits++; L.combo++; L.phase='ok'; tono('ok'); }
    render(); return;
  }
});

document.addEventListener('input', ev=>{
  if(ev.target.id==='wr' && L){ L.ans=ev.target.value; const b=document.querySelector('[data-check]'); if(b) b.disabled=!L.ans.trim(); }
});
/* Atajos: 1–9 eligen opción, Enter comprueba o continúa */
document.addEventListener('keydown', ev=>{
  if(!L || document.getElementById('panel-mock').hidden) return;
  const inText = ev.target.id==='wr';
  if(ev.key==='Enter' && !ev.shiftKey){
    const b = document.querySelector('[data-check]:not([disabled]), [data-next], [data-retry], [data-learned]');
    if(b){ ev.preventDefault(); b.click(); const w=document.getElementById('wr'); if(w && !w.readOnly) w.focus(); }
    return;
  }
  if(!inText && /^[1-9]$/.test(ev.key)){ const o=document.querySelector('[data-opt="'+(+ev.key-1)+'"]'); if(o){ ev.preventDefault(); o.click(); } }
});
try{ const t=localStorage.getItem('sendero-tab'); if(t){ const btn=document.querySelector(`.tabs [data-tab="${t}"]`); if(btn) btn.click(); } }catch(e){}
render();
})();
