la calle"],"a":0},"respuesta":{"modo":"completar","en":"So, go straight on and turn left?","huecos":["straight","left"],"distractores":["right","street"]}},{"quien":"Woman","en":"Yes, that's right. The post office is on the right, next to a café.","es":"Sí, exacto. La oficina de correos está a la derecha, al lado de un café.","comprension":{"q":"¿Dónde está la oficina de correos?","opts":["A la derecha, al lado de un café","A la izquierda, al lado de un banco","Enfrente del parque"],"a":0},"respuesta":{"modo":"elegir","opts":["Thank you for your help!","Thank you for help me!","Thank you of your help!"],"a":0,"por_que":"«Gracias por tu ayuda» es Thank you for your help. Thank you for help me es un calco del español."}},{"quien":"Woman","en":"No problem. Have a nice day!","es":"De nada. ¡Que tengas un buen día!","respuesta":{"modo":"hablar","en":"Thanks! You too.","es":"¡Gracias! Igualmente."}}],"notas_uso":["Con un desconocido, empieza con Excuse me. Where is the post office? a secas suena brusco.","Repetir lo que entendiste (So, go straight on and turn left?) es la estrategia más útil: mejor eso que decir que sí sin haber entendido.","Block es «cuadra» y es muy de Estados Unidos: two blocks, «dos cuadras». En el Reino Unido se cuentan calles: take the second left.","A Have a nice day! se responde Thanks, you too. Me too sería «yo también» y aquí no tiene sentido."]}],"lecturas":[{"id":"lec-s1b05-1","tipo":"oido","titulo":"La vecina les explica el barrio","texto":"Hello, Martín and Mónica! Welcome to Oak Street. There's a supermarket on the corner, and the pharmacy is next to it. The bus stop is opposite the park. There isn't a bank on this street, but there's one near the station. It's five minutes from here. Oh, and the library is between the school and the post office.","es":"¡Hola, Martín y Mónica! Bienvenidos a Oak Street. Hay un supermercado en la esquina, y la farmacia está al lado. La parada de autobús está enfrente del parque. En esta calle no hay banco, pero hay uno cerca de la estación. Está a cinco minutos de aquí. Ah, y la biblioteca está entre la escuela y la oficina de correos.","preguntas":[{"q":"¿Qué hay al lado del supermercado?","opts":["La farmacia","El banco","La parada de autobús"],"a":0},{"q":"¿Dónde está el banco?","opts":["Cerca de la estación","En Oak Street","Enfrente del parque"],"a":0},{"q":"¿Dónde está la biblioteca?","opts":["Entre la escuela y la oficina de correos","Al lado de la farmacia","En la esquina"],"a":0}]},{"id":"lec-s1b05-2","tipo":"mensaje","titulo":"El departamento nuevo de Jake","texto":"Hi Martín! I have a new apartment on Lake Street. It's small, but I like it. There's a kitchen, a living room and two bedrooms. There isn't a yard, but there's a park opposite the building. Would you like to come on Saturday? Take the subway to Clark Street and walk two blocks. My building is on the corner, next to a bookstore.","es":"¡Hola, Martín! Tengo un departamento nuevo en Lake Street. Es pequeño, pero me gusta. Hay una cocina, una sala y dos dormitorios. No hay patio, pero hay un parque enfrente del edificio. ¿Quieres venir el sábado? Toma el metro hasta Clark Street y camina dos cuadras. Mi edificio está en la esquina, al lado de una librería.","glosas":{"small":"pequeño","come":"venir"},"preguntas":[{"q":"¿Cuántos dormitorios tiene el departamento de Jake?","opts":["Dos","Uno","Tres"],"a":0},{"q":"¿Qué no tiene?","opts":["Patio","Cocina","Sala"],"a":0},{"q":"¿Qué hay al lado de su edificio?","opts":["Una librería","Una biblioteca","Una parada de autobús"],"a":0}],"responder":{"consigna":"Contesta a Jake: di que sí y pregúntale algo para llegar bien.","elementos":[{"txt":"Dices que sí","claves":["yes","sure","ok","great"]},{"txt":"Preguntas algo del camino","claves":["how do i get","where is","where's","is it far","is there"]}],"modelo":"Yes, thanks! Is it far from the station?"}}],"escritura":{"consigna":"Jake viene a tu casa por primera vez. Escríbele cómo llegar desde la estación: una indicación, dónde está tu casa y qué hay cerca.","elementos":[{"txt":"Das una indicación","claves":["turn","go straight","take the","walk","cross"]},{"txt":"Dices dónde está tu casa","claves":["near","next to","opposite","between","on the corner","on the left","on the right"]},{"txt":"Dices qué hay cerca","claves":["there's","there is","there are"]}],"modelo":"From the station, go straight on and turn left at the bank. My house is on the right, next to the park. There's a pharmacy on the corner."},"biblioteca":[{"id":"bib-s1b05-1","titulo":"El museo perdido","tipo":"texto","texto":"On Saturday, Martín goes to the museum. He doesn't have a map, and his phone is at home. After twenty minutes, he is lost. \"Excuse me,\" he says to a woman, \"is the museum near here?\" \"Sorry, I'm not from here,\" she says. She has a map too! Then Martín sees a man at the bus stop. \"Excuse me, how do I get to the museum?\" The man smiles. \"Turn around.\" Martín turns. The museum is opposite the bus stop, on the corner. It's a big building, and it's right there!","es":"El sábado, Martín va al museo. No tiene mapa y su teléfono está en casa. Después de veinte minutos, está perdido. «Disculpe», le dice a una mujer, «¿el museo está cerca de aquí?». «Lo siento, no soy de aquí», dice ella. ¡Ella también tiene un mapa! Luego Martín ve a un hombre en la parada de autobús. «Disculpe, ¿cómo llego al museo?». El hombre sonríe. «Dese la vuelta». Martín se gira. El museo está enfrente de la parada, en la esquina. Es un edificio grande, ¡y está justo ahí!","glosas":{"says":"dice","then":"luego","around":"(dar) la vuelta","big":"grande"},"preguntas":[{"q":"¿Por qué Martín está perdido?","opts":["No tiene mapa ni teléfono","El museo está cerrado","Toma el autobús equivocado"],"a":0},{"q":"¿Qué pasa con la mujer?","opts":["Tampoco es de ahí","Le da su mapa","Lo lleva al museo"],"a":0},{"q":"¿Dónde está el museo?","opts":["Enfrente de la parada de autobús","Al lado del hospital","Lejos, a veinte minutos"],"a":0}]},{"id":"bib-s1b05-2","titulo":"¿Dónde está la biblioteca?","tipo":"texto","texto":"Mónica has a lot of books, but she would like a library near home. There isn't a library on Oak Street. Mrs. Kowalski says, \"Take the bus to the square. The library is between the bank and the post office.\" On Monday, Mónica goes to the square. She sees the bank and the post office, but between them there is a new restaurant! A waiter says, \"Sorry, the library isn't here now. It's next to the station.\" Mónica laughs. She has lunch at the restaurant, and then she walks to the station.","es":"Mónica tiene muchos libros, pero le gustaría tener una biblioteca cerca de casa. En Oak Street no hay biblioteca. Mrs. Kowalski le dice: «Toma el autobús hasta la plaza. La biblioteca está entre el banco y la oficina de correos». El lunes, Mónica va a la plaza. Ve el banco y la oficina de correos, ¡pero entre los dos hay un restaurante nuevo! Un mesero le dice: «Lo siento, la biblioteca ya no está aquí. Está al lado de la estación». Mónica se ríe. Almuerza en el restaurante y luego camina hasta la estación.","glosas":{"says":"dice","now":"ahora","laughs":"se ríe","then":"luego"},"preguntas":[{"q":"¿Qué le dice Mrs. Kowalski a Mónica?","opts":["Que la biblioteca está en la plaza","Que no hay biblioteca en la ciudad","Que la biblioteca está en Oak Street"],"a":0},{"q":"¿Qué encuentra Mónica entre el banco y la oficina de correos?","opts":["Un restaurante nuevo","La biblioteca","Una farmacia"],"a":0},{"q":"¿Dónde está la biblioteca ahora?","opts":["Al lado de la estación","Enfrente del banco","En Oak Street"],"a":0}]},{"id":"bib-s1b05-3","titulo":"Cómo llegar a la fiesta","tipo":"audio","texto":"Hi Martín, it's Jake. The party is at my friend's house on Friday at eight. It's not far from your apartment. Walk to the corner and turn left. Go straight on for five minutes. Turn right at the pharmacy. Then take the second street on the left. The house is opposite a park, next to a small supermarket. Oh, and can you bring some bread and cheese? Mónica can come too, of course. See you on Friday!","es":"Hola, Martín, soy Jake. La fiesta es en la casa de un amigo, el viernes a las ocho. No está lejos de tu departamento. Camina hasta la esquina y gira a la izquierda. Sigue derecho cinco minutos. Gira a la derecha en la farmacia. Luego toma la segunda calle a la izquierda. La casa está enfrente de un parque, al lado de un supermercado pequeño. Ah, ¿y puedes traer pan y queso? Mónica también puede venir, claro. ¡Nos vemos el viernes!","glosas":{"party":"fiesta","then":"luego","small":"pequeño","bring":"traer","come":"venir","of course":"claro"},"preguntas":[{"q":"¿Cuándo es la fiesta?","opts":["El viernes a las ocho","El sábado a las ocho","El viernes a las cinco"],"a":0},{"q":"¿Dónde gira Martín a la derecha?","opts":["En la farmacia","En el parque","En el supermercado"],"a":0},{"q":"¿Qué tiene que llevar Martín?","opts":["Pan y queso","Nada","Un mapa"],"a":0}]},{"id":"bib-s1b05-4","titulo":"Dos hoteles","tipo":"texto","texto":"A man with a map stops Mrs. Kowalski on the street. \"Excuse me, is there a hotel near here?\" \"Yes, there are two,\" she says. \"The Grand Hotel is opposite the park. It's very expensive. The Lake Hotel is next to the station, and it's not expensive.\" The man looks at his map. \"How do I get to the Lake Hotel?\" \"Go straight on and take the second street on the right. It's five minutes from here.\" The man smiles. \"Thank you for your help!\" \"No problem. Welcome to Chicago!\"","es":"Un hombre con un mapa para a Mrs. Kowalski en la calle. «Disculpe, ¿hay un hotel cerca de aquí?». «Sí, hay dos», dice ella. «El Grand Hotel está enfrente del parque. Es muy caro. El Lake Hotel está al lado de la estación y no es caro». El hombre mira su mapa. «¿Cómo llego al Lake Hotel?». «Siga derecho y tome la segunda calle a la derecha. Está a cinco minutos de aquí». El hombre sonríe. «¡Gracias por su ayuda!». «No hay problema. ¡Bienvenido a Chicago!».","glosas":{"stops":"detiene","says":"dice","very":"muy","expensive":"caro"},"preguntas":[{"q":"¿Qué busca el hombre?","opts":["Un hotel","La estación","Un parque"],"a":0},{"q":"¿Cómo es el Grand Hotel?","opts":["Muy caro","Barato","Pequeño"],"a":0},{"q":"¿A qué hotel quiere ir el hombre?","opts":["Al Lake Hotel, al lado de la estación","Al Grand Hotel","A un hotel en la plaza"],"a":0}]},{"id":"bib-s1b05-5","titulo":"Un desayuno con sorpresa","tipo":"texto","texto":"It's Monday morning. Martín and his wife are at work, and his mother and father would like breakfast: coffee with milk, orange juice, bread, cheese and eggs. But there's no food at home! His father goes out and gets lost. \"Good morning! Excuse me,\" he says to a man. \"Sorry, my English is not good. Is there a supermarket near here?\" \"Good morning! Do you speak Spanish? I'm from Colombia.\" \"Yes! I'm from Lima. My son, Martín, and his wife live here.\" \"Martín? From Lima? He's my coworker! I don't work on Monday,\" says the man. \"The supermarket is next to my home.\" At ten o'clock, the family has breakfast, and the man from Colombia has breakfast with them too!","es":"Es lunes por la mañana. Martín y su esposa están en el trabajo, y la madre y el padre de él quieren desayunar: café con leche, jugo de naranja, pan, queso y huevos. ¡Pero no hay comida en la casa! El padre sale y se pierde. «¡Buenos días! Disculpe», le dice a un hombre. «Perdón, mi inglés no es bueno. ¿Hay un supermercado cerca de aquí?». «¡Buenos días! ¿Habla español? Soy de Colombia». «¡Sí! Soy de Lima. Mi hijo, Martín, y su esposa viven aquí». «¿Martín? ¿De Lima? ¡Es mi compañero de trabajo! Yo no trabajo los lunes», dice el hombre. «El supermercado está al lado de mi casa». A las diez, la familia desayuna, ¡y el hombre de Colombia desayuna con ellos también!","glosas":{"goes out":"sale","gets lost":"se pierde"},"preguntas":[{"q":"¿Qué busca el padre de Martín?","opts":["Un banco","Un supermercado","Una farmacia"],"a":1},{"q":"¿Quién es el hombre de Colombia?","opts":["Un compañero de trabajo de Martín","Un profesor de inglés","Un mesero"],"a":0},{"q":"¿Dónde está el supermercado?","opts":["Enfrente del parque","Al lado del banco","Al lado de la casa del hombre"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"bank","opts":["banco","tu","pollo"],"a":"banco","items":["bank"]},{"tipo":"significado","nuevo":true,"en":"park","opts":["agua","parque","pescado"],"a":"parque","items":["park"]},{"tipo":"significado","nuevo":true,"en":"hotel","opts":["hotel","profesor","Argentina"],"a":"hotel","items":["hotel"]},{"tipo":"tarjeta","en":"There's a bank here.","es":"Aquí hay un banco.","nota":"«Hay» es there is; en la conversación, there's.","items":["theres-a-bank-here"]},{"tipo":"tarjeta","en":"There's a park.","es":"Hay un parque.","nota":null,"items":["theres-a-park"]},{"tipo":"emparejar","pares":[["bank","banco"],["park","parque"],["hotel","hotel"]],"items":["bank","park","hotel"]},{"tipo":"nota","nota":"«Hay» es there is para una cosa y there are para varias. No uses have: There's a bank here, no Have a bank here.","items":[]},{"tipo":"emparejar","pares":[["There's a bank here.","Aquí hay un banco."],["There's a park.","Hay un parque."],["engineer","ingeniero"]],"items":["theres-a-bank-here","theres-a-park"]},{"tipo":"elegir","es":"parque","opts":["park","work","wife"],"a":"park","items":["park"]},{"tipo":"elegir","es":"hotel","opts":["milk","my","hotel"],"a":"hotel","items":["hotel"]},{"tipo":"traducir_oido","audio":"There's a bank here.","fichas":["normalmente","aquí","tú","banco","son","un","hay"],"a":"aquí hay un banco","es":"Aquí hay un banco.","items":["theres-a-bank-here","bank"]},{"tipo":"escuchar","audio":"There's a park.","es":"Hay un parque.","fichas":["park","There's","a","coffee","children"],"a":"There's a park.","alts":["There is a park."],"items":["theres-a-park"]},{"tipo":"completar","pre":"","post":"a bank here.","opts":["There's","Have","It's"],"a":"There's"  rock band from Chicago, and I think they're great! Do you like rock music? Mónica can come too, of course. It's at eight o'clock, next to the lake. Would you like to come? Call me!","es":"Hola, Martín, soy Jake. Hay un concierto gratis en el parque el viernes por la noche. Es una banda de rock de Chicago, ¡y me parece genial! ¿Te gusta el rock? Mónica también puede venir, claro. Es a las ocho, al lado del lago. ¿Quieres venir? ¡Llámame!","glosas":{"free":"gratis","rock":"rock","of course":"claro","call":"llamar"},"preguntas":[{"q":"¿Qué hay el viernes por la noche?","opts":["Un concierto gratis en el parque","Un partido de fútbol","Una película en el parque"],"a":0},{"q":"¿Qué piensa Jake de la banda?","opts":["Que es genial","Que no le gusta","Que no la conoce"],"a":0},{"q":"¿Dónde es el concierto?","opts":["Al lado del lago","Enfrente de la estación","En casa de Jake"],"a":0}]},{"id":"lec-s1b06-2","tipo":"cartel","titulo":"Actividades en el centro del barrio","texto":"Welcome to the Lincoln Park Community Center! Free time activities for everyone. Monday: yoga at 7:00. Wednesday: guitar class at 6:00. Saturday: soccer for adults at 9:00. Can't swim? Swimming classes on Tuesday and Thursday at 5:00. It's fun, and it's free! Come and meet your neighbors.","es":"¡Bienvenidos al Centro Comunitario de Lincoln Park! Actividades de tiempo libre para todos. Lunes: yoga a las 7:00. Miércoles: clase de guitarra a las 6:00. Sábado: fútbol para adultos a las 9:00. ¿No sabes nadar? Clases de natación los martes y jueves a las 5:00. ¡Es divertido y es gratis! Ven a conocer a tus vecinos.","glosas":{"yoga":"yoga","class":"clase","adult":"adulto","free":"gratis"},"preguntas":[{"q":"¿Qué día es la clase de guitarra?","opts":["El miércoles","El lunes","El sábado"],"a":0},{"q":"¿Qué puedes hacer si no sabes nadar?","opts":["Ir a clases de natación los martes y jueves","Jugar fútbol el sábado","Hacer yoga el lunes"],"a":0},{"q":"¿Cuánto cuestan las actividades?","opts":["Nada, son gratis","5 dólares","7 dólares"],"a":0}],"responder":{"consigna":"Escribe un mensaje a Mónica: dile qué actividad del cartel te gusta, qué día es y pregúntale si quiere ir contigo.","elementos":[{"txt":"Dices qué te gusta","claves":["i like","i love","i'd like","i think"]},{"txt":"Dices el día","claves":["monday","tuesday","wednesday","thursday","saturday"]},{"txt":"La invitas","claves":["would you like","do you want","come"]}],"modelo":"Hi Mónica! I'd like the guitar class. It's on Wednesday at six. Would you like to come?"}}],"escritura":{"consigna":"Escribe un mensaje para el grupo de vecinos de tu edificio: preséntate y di qué te gusta hacer, qué sabes hacer y qué no.","elementos":[{"txt":"Te presentas","claves":["i'm","i am","my name"]},{"txt":"Dices qué te gusta hacer","claves":["i like","i love"]},{"txt":"Dices qué sabes hacer","claves":["i can "]},{"txt":"Dices qué no sabes hacer o qué no te gusta","claves":["can't","cannot","don't like","hate"]}],"modelo":"Hi everyone! I'm Martín, your new neighbor. I love playing soccer and I can cook a little. I can't sing, but I like listening to music."},"biblioteca":[{"id":"bib-s1b06-1","titulo":"La noche de karaoke","tipo":"texto","texto":"On Friday, Martín and his coworkers go to a karaoke bar. \"Can you sing?\" Jake asks. \"No, I can't,\" says Martín. \"I hate singing!\" But Jake and Mónica love it. Mónica sings a song from Colombia, and she sings very well. Then the coworkers say, \"Martín! Martín!\" Martín can't say no. He sings \"Happy Birthday\" because he knows it. He can't sing, but everyone dances. After the song, Martín smiles. \"Okay, I don't sing well, but it's fun!\"","es":"El viernes, Martín y sus compañeros de trabajo van a un bar de karaoke. «¿Sabes cantar?», pregunta Jake. «No, no sé», dice Martín. «¡Odio cantar!». Pero a Jake y a Mónica les encanta. Mónica canta una canción de Colombia, y canta muy bien. Luego los compañeros dicen: «¡Martín! ¡Martín!». Martín no puede decir que no. Canta «Cumpleaños feliz» porque se la sabe. No sabe cantar, pero todos bailan. Después de la canción, Martín sonríe. «Bueno, no canto bien, ¡pero es divertido!».","glosas":{"karaoke":"karaoke","bar":"bar","asks":"pregunta","says":"dice","say":"decir","then":"luego"},"preguntas":[{"q":"¿Qué piensa Martín de cantar?","opts":["Lo odia","Le encanta","Le gusta un poco"],"a":0},{"q":"¿Quién canta muy bien?","opts":["Mónica","Martín","Jake"],"a":0},{"q":"¿Qué pasa cuando canta Martín?","opts":["Canta mal, pero todos bailan","Todos se van","Canta muy bien"],"a":0}]},{"id":"bib-s1b06-2","titulo":"Una guitarra a los setenta y cinco","tipo":"texto","texto":"Mrs. Kowalski is seventy-five years old, and she has a new hobby: the guitar. Every Wednesday, she goes to a guitar class near her home. Her teacher is a young man, Leo. At first, she can't play very well. But she plays every day, in the morning and in the evening. In March, she can play three songs. On Sunday, she plays for Martín and Mónica in the park. A lot of people listen. \"You play very well!\" says a little girl. Mrs. Kowalski smiles. \"I'm seventy-five, but I'm not old!\"","es":"Mrs. Kowalski tiene setenta y cinco años y un pasatiempo nuevo: la guitarra. Todos los miércoles va a una clase de guitarra cerca de su casa. Su profesor es un hombre joven, Leo. Al principio no sabe tocar muy bien. Pero toca todos los días, por la mañana y por la tarde. En marzo ya sabe tocar tres canciones. El domingo toca para Martín y Mónica en el parque. Mucha gente la escucha. «¡Toca muy bien!», dice una niña. Mrs. Kowalski sonríe. «Tengo setenta y cinco, ¡pero no soy vieja!».","glosas":{"says":"dice"},"preguntas":[{"q":"¿Cuál es el pasatiempo nuevo de Mrs. Kowalski?","opts":["La guitarra","Cantar","Nadar"],"a":0},{"q":"¿Cuándo practica?","opts":["Todos los días, por la mañana y por la tarde","Solo los miércoles","Solo los domingos"],"a":0},{"q":"¿Qué dice ella al final?","opts":["Que tiene setenta y cinco, pero no es vieja","Que no sabe tocar","Que quiere otro profesor"],"a":0}]},{"id":"bib-s1b06-3","titulo":"El secreto de Jake","tipo":"audio","texto":"Jake loves sports. He plays soccer every Saturday, he runs in the park, and he can play tennis very well. But Jake has a secret: he can't swim! In the summer, his friends go to the lake every weekend. Jake always says, \"Sorry, I'm busy.\" This year, he has swimming classes at the gym. The other students are seven years old! Jake thinks it's funny. In August, he goes to the lake with his friends and swims. \"Jake, you can swim!\" they say. \"Yes, I can,\" he says. \"A little.\"","es":"A Jake le encantan los deportes. Juega fútbol todos los sábados, corre en el parque y juega muy bien al tenis. Pero Jake tiene un secreto: ¡no sabe nadar! En verano, sus amigos van al lago todos los fines de semana. Jake siempre dice: «Lo siento, estoy ocupado». Este año va a clases de natación en el gimnasio. ¡Los otros alumnos tienen siete años! A Jake le parece gracioso. En agosto va al lago con sus amigos y nada. «¡Jake, sabes nadar!», le dicen. «Sí», dice él. «Un poco».","glosas":{"secret":"secreto","summer":"verano","says":"dice","say":"decir","funny":"gracioso"},"preguntas":[{"q":"¿Cuál es el secreto de Jake?","opts":["No sabe nadar","No sabe jugar fútbol","Odia el lago"],"a":0},{"q":"¿Qué tienen de especial sus compañeros de clase?","opts":["Tienen siete años","Son sus amigos","Son profesores"],"a":0},{"q":"¿Qué pasa en agosto?","opts":["Nada en el lago con sus amigos","Deja las clases","Juega tenis en el lago"],"a":0}]},{"id":"bib-s1b06-4","titulo":"El club de lectura","tipo":"texto","texto":"Mónica loves reading, so she has a new idea: a book club in her building. On Monday, six neighbors come to her apartment. \"Do you like the book?\" Mónica asks. Nobody answers. Mrs. Kowalski says, \"I think it's great, but I don't read a lot.\" Jake says, \"I can't read in English very well.\" Mónica laughs, and they talk about movies, music and food for two hours. Mrs. Kowalski has a cake, and Jake plays the guitar. Nobody reads the book, but everyone has fun. Next Monday, the club is at Jake's apartment.","es":"A Mónica le encanta leer, así que tiene una idea nueva: un club de lectura en su edificio. El lunes, seis vecinos van a su departamento. «¿Les gusta el libro?», pregunta Mónica. Nadie contesta. Mrs. Kowalski dice: «Me parece genial, pero no leo mucho». Jake dice: «No sé leer muy bien en inglés». Mónica se ríe, y hablan de películas, música y comida durante dos horas. Mrs. Kowalski lleva un pastel y Jake toca la guitarra. Nadie lee el libro, pero todos se divierten. El lunes que viene, el club es en el departamento de Jake.","glosas":{"idea":"idea","asks":"pregunta","nobody":"nadie","says":"dice","laughs":"se ríe","talk":"hablar"},"preguntas":[{"q":"¿Qué organiza Mónica?","opts":["Un club de lectura","Una clase de guitarra","Una cena"],"a":0},{"q":"¿Por qué nadie contesta?","opts":["Nadie lee el libro","No les gusta Mónica","Hablan otro idioma"],"a":0},{"q":"¿Dónde es el club el lunes que viene?","opts":["En el departamento de Jake","En casa de Mrs. Kowalski","En la biblioteca"],"a":0}]},{"id":"bib-s1b06-5","titulo":"Jake dice que sí","tipo":"texto","texto":"On Saturday, Jake has dinner at his sister Ashley's house. Ashley's friend Rachel is there too. She's a doctor, she's thirty-two, and she's single. \"What do you like doing in your free time?\" Jake asks. \"I love swimming,\" says Rachel. \"I swim every morning before work, and on Sundays I swim in the lake.\" \"Me too!\" says Jake. \"I love swimming!\" Rachel smiles. \"Great! Would you like to swim with me on Sunday at seven?\" \"Yes, of course,\" says Jake. But there's a problem: Jake can't swim! At home, he calls the gym. \"Hello. Do you have swimming classes for adults? Can I start tomorrow?\"","es":"El sábado, Jake cena en la casa de su hermana Ashley. Rachel, una amiga de Ashley, también está ahí. Es médica, tiene treinta y dos años y es soltera. «¿Qué te gusta hacer en tu tiempo libre?», pregunta Jake. «Me encanta nadar», dice Rachel. «Nado todas las mañanas antes del trabajo, y los domingos nado en el lago». «¡Yo también!», dice Jake. «¡Me encanta nadar!». Rachel sonríe. «¡Genial! ¿Te gustaría nadar conmigo el domingo a las siete?». «Sí, claro», dice Jake. Pero hay un problema: ¡Jake no sabe nadar! En casa, llama al gimnasio. «Hola. ¿Tienen clases de natación para adultos? ¿Puedo empezar mañana?».","glosas":{"asks":"pregunta","calls":"llama a","adults":"adultos","start":"empezar","tomorrow":"mañana"},"preguntas":[{"q":"¿Qué le encanta hacer a Rachel?","opts":["Cocinar","Nadar","Bailar"],"a":1},{"q":"¿Cuál es el problema de Jake?","opts":["No sabe nadar","Trabaja el domingo","No le gusta Rachel"],"a":0},{"q":"¿A quién llama Jake al final?","opts":["A Rachel","A su hermana","Al gimnasio"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"read","opts":["leer","arroz","casado"],"a":"leer","items":["read"]},{"tipo":"significado","nuevo":true,"en":"swim","opts":["hospital","huevo","nadar"],"a":"nadar","items":["swim"]},{"tipo":"tarjeta","en":"I like reading.","es":"Me gusta leer.","nota":"Después de like, el verbo va con -ing (o con to). En español va el infinitivo.","items":["i-like-reading"]},{"tipo":"tarjeta","en":"I like swimming.","es":"Me gusta nadar.","nota":"swim dobla la m: swimming.","items":["i-like-swimming"]},{"tipo":"tarjeta","en":"Do you like reading?","es":"¿Te gusta leer?","nota":"La pregunta empieza con do, como en el presente simple.","items":["do-you-like-reading"]},{"tipo":"significado","nuevo":true,"en":"I think it's great!","opts":["al lado de","Hay tres hoteles.","¡Me parece genial!"],"a":"¡Me parece genial!","items":["i-think-its-great"]},{"tipo":"emparejar","pares":[["read","leer"],["swim","nadar"],["I like reading.","Me gusta leer."]],"items":["read","swim","i-like-reading"]},{"tipo":"nota","nota":"Después de like, love y hate el verbo va con -ing: I like reading. En español va el infinitivo («me gusta oes-she-like-cooking"]}]},{"id":"s1-b07","bloque":7,"titulo":"Ahora mismo","objetivo":"Describir lo que pasa ahora: qué haces, qué ropa llevas y qué tiempo hace","puedes":"Contar qué estás haciendo, describir tu ropa con colores y decir qué tiempo hace","gramatica":["am / is / are + -ing","Are you…? / I'm not…","it para el tiempo: It's raining","presente simple o continuo","like, want, know y need sin -ing"],"guia":"Para lo que pasa ahora se usa \u003cb>am / is / are + -ing\u003c/b>: \u003ci>I'm working\u003c/i> es «estoy trabajando». El tiempo siempre lleva \u003cb>it\u003c/b>: \u003ci>It's raining\u003c/i>, \u003ci>It's cold\u003c/i>, nunca \u003ci>It makes cold\u003c/i>. Y el color va antes de la prenda: \u003ci>a red dress\u003c/i>.","items":[{"id":"now","en":"now","es":"ahora","l":1},{"id":"today","en":"today","es":"hoy","l":1},{"id":"what-are-you-doing","en":"What are you doing?","es":"¿Qué estás haciendo?","l":1,"uso":"Entre amigos o familia, al llamar o al escribir un mensaje. Para saber a qué se dedica alguien no sirve: eso es What do you do?"},{"id":"im-reading-now","en":"I'm reading now.","es":"Estoy leyendo ahora.","l":1},{"id":"shes-cooking","en":"She's cooking.","es":"Ella está cocinando.","l":1},{"id":"shirt","en":"shirt","es":"camisa","l":2},{"id":"t-shirt","en":"T-shirt","es":"camiseta","l":2},{"id":"im-wearing-a-t-shirt","en":"I'm wearing a T-shirt.","es":"Llevo una camiseta.","l":2},{"id":"right-now","en":"right now","es":"ahora mismo","l":2},{"id":"hes-watching-tv","en":"He's watching TV.","es":"Él está viendo la tele.","l":2},{"id":"jeans","en":"jeans","es":"jeans","l":3},{"id":"dress","en":"dress","es":"vestido","l":3},{"id":"are-you-working","en":"Are you working?","es":"¿Estás trabajando?","l":3},{"id":"im-not-working-today","en":"I'm not working today.","es":"Hoy no estoy trabajando.","l":3},{"id":"theyre-playing-football","en":"They're playing soccer.","es":"Ellos están jugando al fútbol.","l":3},{"id":"medium","en":"medium","es":"mediano","l":3},{"id":"jacket","en":"jacket","es":"chaqueta","l":4},{"id":"coat","en":"coat","es":"abrigo","l":4},{"id":"its-raining","en":"It's raining.","es":"Está lloviendo.","l":4,"uso":"Para el tiempo de este momento. Para decir que en un lugar llueve mucho en general se usa el presente simple: It rains a lot in London."},{"id":"its-cold","en":"It's cold.","es":"Hace frío.","l":4,"uso":"Para hablar del tiempo o de un lugar (la casa, la oficina). Si eres tú quien tiene frío, se dice I'm cold."},{"id":"its-sunny","en":"It's sunny.","es":"Hace sol.","l":4},{"id":"im-just-looking","en":"I'm just looking, thanks.","es":"Solo estoy mirando, gracias.","l":4,"uso":"La respuesta amable cuando en una tienda te dicen Can I help you? y no buscas nada concreto. Contestar solo No suena cortante."},{"id":"its-hot","en":"It's hot.","es":"Hace calor.","l":5},{"id":"is-it-raining","en":"Is it raining?","es":"¿Está lloviendo?","l":5},{"id":"hat","en":"hat","es":"sombrero","l":5},{"id":"its-windy","en":"It's windy.","es":"Hace viento.","l":5},{"id":"whats-the-weather-like","en":"What's the weather like?","es":"¿Qué tiempo hace?","l":5,"uso":"Para preguntar por el tiempo a alguien que está en otro lugar, por teléfono o por mensaje. How is the weather? también se oye, pero es menos común."},{"id":"im-wearing-a-blue-hat","en":"I'm wearing a blue hat.","es":"Llevo un sombrero azul.","l":6},{"id":"red","en":"red","es":"rojo","l":6},{"id":"blue","en":"blue","es":"azul","l":6},{"id":"green","en":"green","es":"verde","l":6},{"id":"shes-wearing-a-red-dress","en":"She's wearing a red dress.","es":"Ella lleva un vestido rojo.","l":6},{"id":"im-looking-for-a-jacket","en":"I'm looking for a jacket.","es":"Estoy buscando una chaqueta.","l":6,"uso":"Para decirle al vendedor qué buscas, justo después de Can I help you? Con Yes, please delante queda aún más amable."},{"id":"my-shirt-is-white","en":"My shirt is white.","es":"Mi camisa es blanca.","l":7},{"id":"black","en":"black","es":"negro","l":7},{"id":"white","en":"white","es":"blanco","l":7},{"id":"shoes","en":"shoes","es":"zapatos","l":7},{"id":"hes-wearing-black-shoes","en":"He's wearing black shoes.","es":"Él lleva zapatos negros.","l":7},{"id":"can-i-try-it-on","en":"Can I try it on?","es":"¿Me lo puedo probar?","l":7,"uso":"En una tienda, para probarte una prenda. Can I try it?, sin on, se usa para probar comida, no ropa."},{"id":"yellow","en":"yellow","es":"amarillo","l":8},{"id":"grey","en":"grey","es":"gris","l":8},{"id":"brown","en":"brown","es":"marrón","l":8},{"id":"what-colour-is-your-coat","en":"What color is your coat?","es":"¿De qué color es tu abrigo?","l":8},{"id":"my-coat-is-grey","en":"My coat is grey.","es":"Mi abrigo es gris.","l":8},{"id":"ill-take-it","en":"I'll take it.","es":"Me lo llevo.","l":8,"uso":"Para decir que compras algo, al vendedor o en la caja. I buy it suena robótico."},{"id":"is-it-cold-today","en":"Is it cold today?","es":"¿Hace frío hoy?","l":9},{"id":"i-usually-wear-jeans","en":"I usually wear jeans.","es":"Normalmente uso jeans.","l":9},{"id":"today-im-wearing-a-dress","en":"Today I'm wearing a dress.","es":"Hoy llevo un vestido.","l":9},{"id":"she-isnt-wearing-a-coat","en":"She isn't wearing a coat.","es":"Ella no lleva abrigo.","l":9},{"id":"are-you-wearing-a-coat","en":"Are you wearing a coat?","es":"¿Llevas abrigo?","l":9},{"id":"it-isnt-raining","en":"It isn't raining.","es":"No está lloviendo.","l":10},{"id":"where-are-you-going","en":"Where are you going?","es":"¿Adónde vas?","l":10,"uso":"Pregunta normal entre amigos o compañeros al verte salir. A un desconocido puede sonarle entrometida."},{"id":"im-going-home","en":"I'm going home.","es":"Voy a casa.","l":10,"uso":"Para despedirte al salir del trabajo o de una reunión. I'm going to home está mal: con home no va to."},{"id":"what-are-they-doing","en":"What are they doing?","es":"¿Qué están haciendo ellos?","l":10},{"id":"hes-sleeping","en":"He's sleeping.","es":"Él está durmiendo.","l":10},{"id":"its-very-cold-today","en":"It's very cold today.","es":"Hoy hace mucho frío.","l":11},{"id":"im-cold","en":"I'm cold.","es":"Tengo frío.","l":11,"uso":"Para decir cómo te sientes tú. I have cold no se entiende, y I have a cold significa «estoy resfriado»."},{"id":"are-you-cold","en":"Are you cold?","es":"¿Tienes frío?","l":11,"uso":"Para ofrecer ayuda: cerrar la ventana, prestar una chaqueta. Do you have cold? es un calco del español."},{"id":"were-listening-to-music","en":"We're listening to music.","es":"Estamos escuchando música.","l":11},{"id":"what-is-she-doing","en":"What is she doing?","es":"¿Qué está haciendo ella?","l":11},{"id":"i-like-your-hat","en":"I like your hat.","es":"Me gusta tu sombrero.","l":12,"uso":"Un cumplido muy común, incluso con desconocidos en EE. UU. Se responde Thanks! I'm liking your hat suena raro."},{"id":"do-you-want-my-jacket","en":"Do you want my jacket?","es":"¿Quieres mi chaqueta?","l":12,"uso":"Para ofrecer algo a alguien de confianza. Con desconocidos suena más amable Would you like…?"},{"id":"i-know","en":"I know.","es":"Lo sé.","l":12,"uso":"Para decir que ya sabías lo que te cuentan. Dicho seco puede sonar a «ya lo sé, no me lo repitas»."},{"id":"i-dont-know","en":"I don't know.","es":"No sé.","l":12,"uso":"La forma neutra de decir que no sabes algo. Para sonar más amable con un desconocido: Sorry, I don't know."},{"id":"i-need-a-coat","en":"I need a coat.","es":"Necesito un abrigo.","l":12,"uso":"Para decir lo que te hace falta, en una tienda o en casa. I'm needing a coat suena raro: need no va en -ing."}],"receptivo":[{"en":"really","es":"realmente","para":"esc-s1b07"},{"en":"size","es":"talla","para":"esc-s1b07"},{"en":"popular","es":"popular","para":"esc-s1b07"},{"en":"on sale","es":"en oferta","para":"esc-s1b07"},{"en":"winter","es":"invierno","para":"lec-s1b07-2"},{"en":"clothes","es":"ropa","para":"lec-s1b07-2"},{"en":"sweater","es":"suéter","para":"lec-s1b07-2"},{"en":"headache","es":"dolor de cabeza","para":"lec-s1b07-1"},{"en":"I have a headache","es":"me duele la cabeza","para":"lec-s1b07-1"},{"en":"back","es":"espalda","para":"lec-s1b07-1"},{"en":"hurt","es":"doler","para":"lec-s1b07-1"},{"en":"medicine","es":"medicina","para":"lec-s1b07-1"},{"en":"sick","es":"enfermo"},{"en":"head","es":"cabeza"},{"en":"face","es":"cara"},{"en":"nose","es":"nariz"},{"en":"mouth","es":"boca"},{"en":"ear","es":"oreja"},{"en":"tooth","es":"diente"},{"en":"stomach","es":"estómago"},{"en":"hand","es":"mano"},{"en":"arm","es":"brazo"},{"en":"leg","es":"pierna"},{"en":"foot","es":"pie"},{"en":"pants","es":"pantalones"},{"en":"skirt","es":"falda"},{"en":"sneakers","es":"tenis"},{"en":"boots","es":"botas"},{"en":"cap","es":"gorra"},{"en":"scarf","es":"bufanda"},{"en":"gloves","es":"guantes"},{"en":"pocket","es":"bolsillo"},{"en":"large","es":"talla grande"},{"en":"fitting room","es":"probador"},{"en":"pink","es":"rosado"},{"en":"purple","es":"morado"},{"en":"cloudy","es":"nublado"},{"en":"snow","es":"nieve"},{"en":"warm","es":"templado"},{"en":"degrees","es":"grados"}],"dialogos":[{"id":"llamada","titulo":"Una llamada de tu hermana","turnos":[{"quien":"Laura","en":"Hi! What are you doing?","opts":["I'm watching TV.","I watching TV.","I am watch TV."],"a":0,"por_que":"Para lo de ahora: am + verbo con -ing."},{"quien":"Laura","en":"Is it raining there?","opts":["No, it isn't. It's sunny.","No, is not. Is sunny.","No, it doesn't. It makes sun."],"a":0,"por_que":"El tiempo lleva it: It's sunny. «Hace sol» no se dice con make."},{"quien":"Laura","en":"Great! What are you wearing?","opts":["A white T-shirt and jeans.","A T-shirt white and jeans.","A T-shirt of white and jeans."],"a":0,"por_que":"En inglés el color va antes de la prenda: a white T-shirt."}]},{"id":"tienda","titulo":"En una tienda de ropa","turnos":[{"quien":"Dependienta","en":"Hello! Can I help you?","opts":["Yes, please. I need a black coat.","Yes, please. I'm needing a black coat.","Yes, please. I need a coat black."],"a":0,"por_que":"need no va en -ing, y el color va antes de la prenda."},{"quien":"Dependienta","en":"What about this coat? Do you like it?","opts":["Yes, I like it!","Yes, I'm liking it!","Yes, it likes me!"],"a":0,"por_que":"like no va en -ing aunque hables de ahora."},{"quien":"Dependienta","en":"It's cold today. Are you wearing a jacket?","opts":["No, I'm not.","No, I don't.","No, I not wearing."],"a":0,"por_que":"A Are you…? se responde con be: No, I'm not."}]}],"escucha":[{"id":"domingo","texto":"It's Sunday and it's sunny today. I'm in the park with my family. My sister is reading and my brother is playing soccer. I'm wearing a yellow T-shirt and jeans.","preguntas":[{"q":"¿Qué tiempo hace?","opts":["Hace sol","Llueve","Hace frío"],"a":0},{"q":"¿Qué está haciendo el hermano?","opts":["Juega al fútbol","Lee","Cocina"],"a":0}]},{"id":"tom","texto":"Hi, I'm Tom. I usually wear a shirt and a jacket to work. But today is Saturday. It's raining and it's cold. I'm at home and I'm watching a movie.","preguntas":[{"q":"¿Qué lleva Tom normalmente al trabajo?","opts":["Camisa y chaqueta","Camiseta y jeans","Abrigo y sombrero"],"a":0},{"q":"¿Qué está haciendo Tom ahora?","opts":["Ve una película","Trabaja","Juega al fútbol"],"a":0}]}],"escenas":[{"id":"esc-s1b07","ambito":"tronco","titulo":"Una chaqueta para el frío","contexto":"Hace mucho frío en Chicago y Martín necesita una chaqueta. Entra en una tienda de ropa y una vendedora se le acerca. Tú eres Martín.","turnos":[{"quien":"Clerk","en":"Hi there! Can I help you?","es":"¡Hola! ¿Te puedo ayudar?","comprension":{"q":"¿Qué te dice la vendedora?","opts":["Te ofrece ayuda","Te pregunta tu nombre","Te dice que la tienda va a cerrar"],"a":0},"respuesta":{"modo":"elegir","opts":["Yes, please. I'm looking for a jacket.","Yes, please. I'm looking a jacket.","Yes. I want jacket."],"a":0,"por_que":"Buscar es look for: sin for no se entiende. I want jacket suena brusco y además le falta a."}},{"quien":"Clerk","en":"Sure! It's really cold today. What size are you?","es":"¡Claro! Hoy hace mucho frío. ¿Qué talla usas?","comprension":{"q":"¿Qué te pregunta la vendedora?","opts":["Qué talla usas","Qué color quieres","Cuánto quieres gastar"],"a":0},"respuesta":{"modo":"elegir","opts":["Medium, please.","My number is medium.","I have medium."],"a":0,"por_que":"La talla se dice sola: Medium. Number es solo para los zapatos, y «tengo talla M» no se dice con have."}},{"quien":"Clerk","en":"OK. What about this one? It's new.","es":"Bien. ¿Qué te parece esta? Es nueva.","respuesta":{"modo":"completar","en":"I like it. Do you have it in blue?","huecos":["have","in"],"distractores":["has","of"]}},{"quien":"Clerk","en":"Yes, here you go. Blue is very popular this winter.","es":"Sí, aquí tienes. El azul está muy de moda este invierno.","respuesta":{"modo":"elegir","opts":["Thanks! Can I try it on?","Thanks! Can I prove it?","Thanks! Can I try it?"],"a":0,"por_que":"Probarse ropa es try it on. Prove es «demostrar», y Can I try it?, sin on, se dice de la comida."}},{"quien":"Clerk","en":"So, how is the jacket? Is it OK?","es":"¿Y qué tal la chaqueta? ¿Te queda bien?","respuesta":{"modo":"elegir","opts":["It's very nice. I like it! How much is it?","It's very nice. I'm liking it! How much is it?","Is very nice. I like it! How much cost?"],"a":0,"por_que":"like no va en -ing aunque hables de ahora. La frase necesita it (It's very nice) y el precio se pregunta con How much is it?"}},{"quien":"Clerk","en":"It's eighty-nine dollars, but it's on sale today. It's sixty dollars.","es":"Cuesta ochenta y nueve dólares, pero hoy está en oferta: cuesta sesenta.","comprension":{"q":"¿Cuánto cuesta hoy la chaqueta?","opts":["60 dólares","89 dólares","16 dólares"],"a":0},"respuesta":{"modo":"hablar","en":"OK, I'll take it.","es":"Bien, me la llevo."}}],"notas_uso":["I'm just looking, thanks es la respuesta amable si no buscas nada. Contestar solo No a Can I help you? suena cortante.","La talla de la ropa se pregunta con size (What size are you?); number se usa solo para los zapatos.","Can I try it on? es para la ropa; Can I try it?, sin on, es para la comida.","I'll take it es la fórmula para decir que lo compras. I buy it suena a robot."]}],"lecturas":[{"id":"lec-s1b07-1","tipo":"oido","titulo":"Un audio de Mónica","texto":"Hi Martín, it's Mónica. I'm not at work today. I'm at home and I'm in bed. I have a headache and my back hurts. It's raining and it's very cold here. Can you get some medicine at the pharmacy, please? And I need bread and milk. Thanks!","es":"Hola, Martín, soy Mónica. Hoy no estoy en el trabajo. Estoy en casa, en la cama. Me duele la cabeza y me duele la espalda. Está lloviendo y aquí hace mucho frío. ¿Puedes comprar medicina en la farmacia, por favor? Y necesito pan y leche. ¡Gracias!","preguntas":[{"q":"¿Dónde está Mónica?","opts":["En casa, en la cama","En el trabajo","En la farmacia"],"a":0},{"q":"¿Qué le duele?","opts":["La cabeza y la espalda","La cabeza y los pies","Las manos y la espalda"],"a":0},{"q":"¿Qué tiene que comprar Martín?","opts":["Medicina, pan y leche","Pan, leche y café","Medicina y un abrigo"],"a":0}]},{"id":"lec-s1b07-2","tipo":"mensaje","titulo":"Un mensaje de Jake","texto":"Hi Martín! What are you doing? I'm at a clothes shop near the park. There's a winter sale today! Sweaters are twenty dollars and hats are ten. Are you working? Do you need a hat? It's very cold today. I can get one for you. What color do you like?","es":"¡Hola, Martín! ¿Qué estás haciendo? Estoy en una tienda de ropa cerca del parque. ¡Hoy hay rebajas de invierno! Los suéteres cuestan veinte dólares y los gorros, diez. ¿Estás trabajando? ¿Necesitas un gorro? Hoy hace mucho frío. Puedo comprarte uno. ¿Qué color te gusta?","preguntas":[{"q":"¿Dónde está Jake?","opts":["En una tienda de ropa","En el parque","En el trabajo"],"a":0},{"q":"¿Cuánto cuestan los gorros?","opts":["10 dólares","20 dólares","30 dólares"],"a":0}],"responder":{"consigna":"Contesta a Jake: di qué estás haciendo, si quieres un gorro y de qué color.","elementos":[{"txt":"Dices qué estás haciendo","claves":["i'm","i am"]},{"txt":"Dices si quieres el gorro","claves":["yes","no","please","thanks"]},{"txt":"Dices un color","claves":["black","blue","red","green","grey","gray","brown","white","yellow"]}],"modelo":"Hi Jake! I'm working right now. Yes, please! I like black."}}],"escritura":{"consigna":"Escribe un mensaje a un amigo que vive en otro país: dile qué tiempo hace, qué estás haciendo y qué ropa llevas.","elementos":[{"txt":"Dices qué tiempo hace","claves":["raining","sunny","cold","hot","windy"]},{"txt":"Dices qué estás haciendo","claves":["reading","working","watching","cooking","listening","playing","sleeping","studying","doing"]},{"txt":"Dices qué ropa llevas","claves":["wearing"]}],"modelo":"Hi Ana! It's very cold here, and it's raining. I'm at home and I'm watching TV. I'm wearing jeans, a black T-shirt and a hat."},"biblioteca":[{"id":"bib-s1b07-1","titulo":"El mismo abrigo","tipo":"texto","texto":"It's Monday morning and it's very cold in Chicago. Martín is at the bus stop. He's wearing his new grey coat and a black hat. A woman is next to him. She's wearing a grey coat too. It's the same coat! The woman looks at Martín and laughs. \"I like your coat,\" she says. \"I like your coat too,\" says Martín. On the bus, they talk. Her name is Sara, and she works at Martín's company. She's his new coworker! Now Martín and Sara are friends, and they have the same coat.","es":"Es lunes por la mañana y hace mucho frío en Chicago. Martín está en la parada del autobús. Lleva su abrigo gris nuevo y un sombrero negro. Hay una mujer a su lado. ¡Ella también lleva un abrigo gris! Es el mismo abrigo. La mujer mira a Martín y se ríe. «Me gusta tu abrigo», dice ella. «A mí también me gusta tu abrigo», dice Martín. En el autobús, hablan. Se llama Sara y trabaja en la empresa de Martín. ¡Es su nueva compañera de trabajo! Ahora Martín y Sara son amigos, y tienen el mismo abrigo.","glosas":{"laughs":"se ríe","says":"dice","talk":"hablan","company":"empresa"},"preguntas":[{"q":"¿Qué tiene de especial el abrigo de la mujer?","opts":["Es igual al de Martín","Es nuevo y rojo","Es muy caro"],"a":0},{"q":"¿Quién es Sara?","opts":["La hermana de Martín","Una nueva compañera de trabajo de Martín","Una vendedora de la tienda"],"a":1},{"q":"¿Qué tiempo hace?","opts":["Hace calor","Está lloviendo","Hace mucho frío"],"a":2}]},{"id":"bib-s1b07-2","titulo":"Un sábado de lluvia","tipo":"audio","texto":"Hi Lucía, it's Mónica! How are you? It's Saturday and it's raining here in Chicago, so we're at home today. Martín is cooking chicken and rice, and I'm reading. Our friend Jake is here too. He's playing the guitar and singing, but he can't sing very well! Martín is laughing. Oh, look! Now it isn't raining. It's sunny! We're going to the park with Jake and the guitar. Call me tomorrow, OK? Bye!","es":"¡Hola, Lucía, soy Mónica! ¿Cómo estás? Es sábado y aquí en Chicago está lloviendo, así que hoy estamos en casa. Martín está cocinando pollo con arroz y yo estoy leyendo. Nuestro amigo Jake también está aquí. Está tocando la guitarra y cantando, ¡pero no canta muy bien! Martín se está riendo. ¡Ay, mira! Ya no está lloviendo. ¡Hace sol! Vamos al parque con Jake y la guitarra. Llámame mañana, ¿sí? ¡Chao!","glosas":{"laughing":"riéndose","call":"llamar","tomorrow":"mañana"},"preguntas":[{"q":"¿Por qué están en casa?","opts":["Porque Mónica está enferma","Porque está lloviendo","Porque hace mucho calor"],"a":1},{"q":"¿Qué está haciendo Jake?","opts":["Toca la guitarra y canta","Cocina pollo con arroz","Ve la tele"],"a":0},{"q":"¿Qué pasa al final?","opts":["Empieza a nevar","Jake se va a casa","Sale el sol y se van al parque"],"a":2}]},{"id":"bib-s1b07-3","titulo":"El sombrero de Mrs. Kowalski","tipo":"texto","texto":"It's a sunny day, but it's very windy. Mrs. Kowalski is walking in the park. She's wearing a yellow dress and her favorite hat. It's red and very old. Then the wind takes her hat! It's flying over the park. A boy is playing soccer near the trees. He runs and gets the hat. \"Here you are!\" he says. \"Thank you! What's your name?\" \"I'm Leo. I live on your street.\" Now Mrs. Kowalski and Leo are friends. On Sundays, she cooks for his family, and Leo plays soccer in her garden.","es":"Es un día de sol, pero hace mucho viento. Mrs. Kowalski camina por el parque. Lleva un vestido amarillo y su sombrero favorito. Es rojo y muy viejo. ¡Entonces el viento se lleva su sombrero! Va volando por encima del parque. Un niño está jugando fútbol cerca de los árboles. Corre y agarra el sombrero. «¡Aquí tiene!», dice. «¡Gracias! ¿Cómo te llamas?» «Soy Leo. Vivo en su calle.» Ahora Mrs. Kowalski y Leo son amigos. Los domingos, ella cocina para la familia de él, y Leo juega fútbol en su jardín.","glosas":{"wind":"viento","then":"entonces","takes":"se lleva","flying":"volando","trees":"árboles","says":"dice","garden":"jardín","boy":"niño"},"preguntas":[{"q":"¿Qué le pasa al sombrero?","opts":["Se le moja con la lluvia","El viento se lo lleva","Lo deja en el parque"],"a":1},{"q":"¿Quién es Leo?","opts":["Un niño que vive en su calle","El nieto de Mrs. Kowalski","Un vendedor de sombreros"],"a":0},{"q":"¿Qué hacen ahora los domingos?","opts":["Van juntos al parque","Ven la tele en casa de Leo","Ella cocina para la familia de Leo"],"a":2}]},{"id":"bib-s1b07-4","titulo":"Una videollamada a Lima","tipo":"texto","texto":"It's January. In Chicago it's winter, and it's snowing. Martín is at home. He's wearing a coat, a hat and gloves, and he's calling his mother in Lima. In Lima it's summer and it's very hot. His mother is wearing a white T-shirt. \"Are you cold?\" she asks. \"Yes, I'm very cold!\" says Martín. His mother laughs. \"I have something for you,\" she says. She has a green sweater in her hands. \"It's for you, for the winter. I can send it tomorrow.\" Martín loves it.","es":"Es enero. En Chicago es invierno y está nevando. Martín está en casa. Lleva abrigo, sombrero y guantes, y está llamando a su mamá en Lima. En Lima es verano y hace mucho calor. Su mamá lleva una camiseta blanca. «¿Tienes frío?», pregunta. «¡Sí, tengo mucho frío!», dice Martín. Su mamá se ríe. «Tengo algo para ti», dice. Tiene un suéter verde en las manos. «Es para ti, para el invierno. Te lo puedo enviar mañana.» A Martín le encanta.","glosas":{"january":"enero","calling":"llamando","summer":"verano","asks":"pregunta","says":"dice","laughs":"se ríe","send":"enviar","tomorrow":"mañana"},"preguntas":[{"q":"¿Qué tiempo hace en Lima?","opts":["Está nevando","Hace mucho calor","Hace viento"],"a":1},{"q":"¿Qué le quiere enviar su mamá?","opts":["Un suéter verde","Unos guantes","Un sombrero"],"a":0}]},{"id":"bib-s1b07-5","titulo":"¿Dónde estás, Kaori?","tipo":"texto","texto":"It's seven in the evening, and it's raining. Martín and Mónica are cooking fish and rice for Kaori, Martín's friend from English class, but Kaori is late. Martín is calling her. \"Hi, Kaori! Where are you?\" \"I'm walking to your apartment, but I think I'm lost. It's very cold, and I'm not wearing a coat!\" \"What can you see?\" \"I'm next to a museum. There's a hotel opposite it, and a bank on the corner.\" Martín laughs. \"Kaori, that's not my street! Take the bus to the square and turn left. We're waiting for you!\" At half past eight, Kaori is at the door. She's very cold, but she's smiling. \"Hi! I'm very hungry. Is that fish?\"","es":"Son las siete de la noche y está lloviendo. Martín y Mónica están cocinando pescado con arroz para Kaori, la amiga de Martín de la clase de inglés, pero Kaori llega tarde. Martín la está llamando. «¡Hola, Kaori! ¿Dónde estás?». «Estoy caminando a tu departamento, pero creo que estoy perdida. ¡Hace mucho frío y no llevo abrigo!». «¿Qué ves?». «Estoy al lado de un museo. Hay un hotel enfrente y un banco en la esquina». Martín se ríe. «¡Kaori, esa no es mi calle! Toma el autobús hasta la plaza y dobla a la izquierda. ¡Te estamos esperando!». A las ocho y media, Kaori está en la puerta. Tiene mucho frío, pero está sonriendo. «¡Hola! Tengo mucha hambre. ¿Eso es pescado?».","glosas":{"calling":"llamando","laughs":"se ríe","waiting for":"esperando a"},"preguntas":[{"q":"¿Qué tiempo hace?","opts":["Hace sol","Está lloviendo","Hace calor"],"a":1},{"q":"¿Qué ve Kaori?","opts":["Un museo, un hotel y un banco","El edificio de Martín","Una parada de autobús y un parque"],"a":0},{"q":"¿A qué hora llega Kaori?","opts":["A las siete","A las ocho","A las ocho y media"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"now","opts":["ahora","estudiar","comida"],"a":"ahora","items":["now"]},{"tipo":"significado","nuevo":true,"en":"today","opts":["hoy","arroz","joven"],"a":"hoy","items":["today"]},{"tipo":"tarjeta","en":"What are you doing?","es":"¿Qué estás haciendo?","nota":"Pregunta por lo que haces en este momento. What do you do? pregunta por tu trabajo o tus costumbres.","items":["what-are-you-doing"]},{"tipo":"tarjeta","en":"I'm reading now.","es":"Estoy leyendo ahora.","nota":"am / is / are + -ing equivale a «estar + -ando / -iendo».","items":["im-reading-now"]},{"tipo":"tarjeta","en":"She's cooking.","es":"Ella está cocinando.","nota":null,"items":["shes-cooking"]},{"tipo":"emparejar","pares":[["now","ahora"],["today","hoy"],["What are you doing?","¿Qué estás haciendo?"]],"items":["now","today","what-are-you-doing"]},{"tipo":"nota","nota":"Para lo que pasa ahora: am / is / are + verbo con -ing. I'm reading es «estoy leyendo». No se puede quitar el be ni dejar el verbo sin -ing.","items":[]},{"tipo":"emparejar","pares":[["I'm reading now.","Estoy leyendo ahora."],["She's cooking.","Ella está cocinando."],["five","cinco"]],"items":["im-reading-now","shes-cooking"]},{"tipo":"escuchar","audio":"What are you doing?","es":"¿Qué estás haciendo?","fichas":["Two","doing","What","are","you","My"],"a":"What are you doing?","alts":[],"items":["what-are-you-doing"]},{"tipo":"elegir","es":"hoy","opts":["today","oppo uso":"Para preguntar dónde estuvo alguien, por ejemplo si no contestó el teléfono. Con tono serio suena a reproche; con una sonrisa, es curiosidad."},{"id":"we-were-at-a-party","en":"We were at a party.","es":"Estábamos en una fiesta.","l":2},{"id":"party","en":"party","es":"fiesta","l":2},{"id":"it-wasnt-bad","en":"It wasn't bad.","es":"No estuvo mal.","l":2,"uso":"Respuesta tranquila a How was…? cuando algo estuvo bien sin más. It was normal suena raro en inglés."},{"id":"worked","en":"worked","es":"trabajé","l":3},{"id":"played","en":"played","es":"jugué","l":3},{"id":"i-worked-all-day","en":"I worked all day.","es":"Trabajé todo el día.","l":3},{"id":"we-played-football","en":"We played soccer.","es":"Jugamos fútbol.","l":3},{"id":"she-worked-at-a-hotel","en":"She worked at a hotel.","es":"Ella trabajó en un hotel.","l":3},{"id":"visited","en":"visited","es":"visité","l":4},{"id":"studied","en":"studied","es":"estudié","l":4},{"id":"i-visited-my-parents","en":"I visited my parents.","es":"Visité a mis padres.","l":4},{"id":"she-studied-english","en":"She studied English.","es":"Ella estudió inglés.","l":4},{"id":"i-was-busy","en":"I was busy.","es":"Estaba ocupado.","l":4,"uso":"Para explicar por qué no hiciste algo o no contestaste. I was occupied casi no se dice de personas."},{"id":"went","en":"went","es":"fui","l":5},{"id":"had","en":"had","es":"tuve","l":5},{"id":"early","en":"early","es":"temprano","l":5},{"id":"i-went-to-bed-early","en":"I went to bed early.","es":"Me acosté temprano.","l":5},{"id":"we-had-lunch-at-home","en":"We had lunch at home.","es":"Almorzamos en casa.","l":5},{"id":"we-had-a-great-time","en":"We had a great time.","es":"La pasamos muy bien.","l":5,"uso":"Para decir que algo estuvo bien (una fiesta, un viaje, una cena) y para agradecer al anfitrión. We passed it very well es un calco que no se entiende."},{"id":"saw","en":"saw","es":"vi","l":6},{"id":"ate","en":"ate","es":"comí","l":6},{"id":"i-watched-tv-last-night","en":"I watched TV last night.","es":"Anoche vi la tele.","l":6},{"id":"we-listened-to-music","en":"We listened to music.","es":"Escuchamos música.","l":6},{"id":"i-saw-a-good-film","en":"I saw a good movie.","es":"Vi una buena película.","l":6},{"id":"did-you-work-yesterday","en":"Did you work yesterday?","es":"¿Trabajaste ayer?","l":7},{"id":"did-you-have-a-good-weekend","en":"Did you have a good weekend?","es":"¿Tuviste un buen fin de semana?","l":7,"uso":"Otra forma de preguntar por el fin de semana, entre compañeros o amigos. Se responde Yes, thanks! o Yes, it was great."},{"id":"did-she-come-to-the-party","en":"Did she come to the party?","es":"¿Ella vino a la fiesta?","l":7},{"id":"did-you-sleep-well","en":"Did you sleep well?","es":"¿Dormiste bien?","l":7,"uso":"Se pregunta en casa por la mañana o a un invitado. A un compañero de trabajo le suena demasiado personal."},{"id":"came","en":"came","es":"vine","l":7},{"id":"we-walked-to-the-park","en":"We walked to the park.","es":"Caminamos al parque.","l":8},{"id":"i-didnt-go-to-work","en":"I didn't go to work.","es":"No fui al trabajo.","l":8},{"id":"she-didnt-call-me","en":"She didn't call me.","es":"Ella no me llamó.","l":8},{"id":"i-didnt-have-breakfast","en":"I didn't have breakfast.","es":"No desayuné.","l":8},{"id":"called","en":"called","es":"llamé","l":8},{"id":"what-did-you-do","en":"What did you do?","es":"¿Qué hiciste?","l":9,"uso":"Para seguir la conversación después de How was your weekend? What did you make? está mal: «hacer» en general es do."},{"id":"i-made-dinner","en":"I made dinner.","es":"Hice la cena.","l":9},{"id":"we-stayed-at-home","en":"We stayed at home.","es":"Nos quedamos en casa.","l":9},{"id":"bought","en":"bought","es":"compré","l":9},{"id":"i-bought-a-jacket","en":"I bought a jacket.","es":"Compré una chaqueta.","l":9},{"id":"met","en":"met","es":"conocí","l":10},{"id":"last-week","en":"last week","es":"la semana pasada","l":10},{"id":"last-year","en":"last year","es":"el año pasado","l":10},{"id":"two-days-ago","en":"two days ago","es":"hace dos días","l":10},{"id":"i-lived-in-mexico","en":"I lived in Mexico two years ago.","es":"Viví en México hace dos años.","l":10},{"id":"it-rained-all-day","en":"It rained all day.","es":"Llovió todo el día.","l":11},{"id":"i-got-up-at-seven","en":"I got up at seven.","es":"Me levanté a las siete.","l":11},{"id":"i-got-home-late","en":"I got home late.","es":"Llegué tarde a casa.","l":11,"uso":"Para contar a qué hora volviste. I arrived to home late es un calco: llegar a casa es get home."},{"id":"then","en":"then","es":"luego","l":11},{"id":"i-met-my-wife","en":"I met my wife ten years ago.","es":"Conocí a mi esposa hace diez años.","l":11},{"id":"i-wanted-a-coffee","en":"I wanted a coffee.","es":"Quería un café.","l":12},{"id":"how-was-your-day","en":"How was your day?","es":"¿Qué tal tu día?","l":12,"uso":"Para preguntar por el día al volver a casa, a la pareja o a la familia. Se contesta corto: Good, thanks. Busy!"},{"id":"did-you-like-it","en":"Did you like it?","es":"¿Te gustó?","l":12,"uso":"Para preguntar la opinión sobre algo que la otra persona vio, comió o visitó. Do you liked it? es un error común: did ya marca el pasado."},{"id":"i-was-born-in-colombia","en":"I was born in Colombia.","es":"Nací en Colombia.","l":12},{"id":"where-were-you-born","en":"Where were you born?","es":"¿Dónde naciste?","l":12}],"receptivo":[{"en":"pretty","es":"bastante","para":"esc-s1b08"},{"en":"sound","es":"sonar","para":"esc-s1b08"},{"en":"together","es":"juntos","para":"lec-s1b08-1"},{"en":"wonderful","es":"maravilloso","para":"lec-s1b08-1"},{"en":"amazing","es":"increíble"},{"en":"boring","es":"aburrido"},{"en":"interesting","es":"interesante"},{"en":"terrible","es":"terrible"},{"en":"relaxed","es":"relajado"},{"en":"guest","es":"invitado"},{"en":"won","es":"gané"},{"en":"drove","es":"manejé"},{"en":"cleaned","es":"limpié"},{"en":"washed","es":"lavé"},{"en":"took","es":"tomé"},{"en":"gave","es":"di"},{"en":"said","es":"dije"},{"en":"told","es":"conté"},{"en":"wrote","es":"escribí"},{"en":"sent","es":"envié"},{"en":"brought","es":"traje"},{"en":"forgot","es":"olvidé"},{"en":"found","es":"encontré"},{"en":"spoke","es":"hablé"},{"en":"felt","es":"me sentí"},{"en":"started","es":"empecé"},{"en":"finished","es":"terminé"},{"en":"enjoyed","es":"disfruté"},{"en":"waited","es":"esperé"},{"en":"opened","es":"abrí"},{"en":"happened","es":"pasó"},{"en":"learned","es":"aprendí"},{"en":"moved","es":"me mudé"},{"en":"laughed","es":"me reí"}],"dialogos":[{"id":"lunes","titulo":"El lunes en el trabajo","turnos":[{"quien":"Ana","en":"Hi! How was your weekend?","opts":["It was great, thanks!","It is great, thanks!","Yes, it was."],"a":0,"por_que":"El fin de semana ya pasó: was, no is."},{"quien":"Ana","en":"Nice! What did you do?","opts":["I visited my parents.","I visited to my parents.","I visit my parents yesterday."],"a":0,"por_que":"En inglés no hay «a» delante de personas: visit my parents."},{"quien":"Ana","en":"Did you watch the movie on TV?","opts":["No, I didn't.","No, I didn't watched.","No, I don't."],"a":0,"por_que":"La respuesta corta es No, I didn't, sin repetir el verbo."}]},{"id":"anoche","titulo":"¿Dónde estabas anoche?","turnos":[{"quien":"Tom","en":"Where were you last night? I called you!","opts":["I was at home. I went to bed early.","I were at home. I go to bed early.","I am at home last night."],"a":0,"por_que":"Con I va was, y lo que ya pasó va en pasado: went."},{"quien":"Tom","en":"Oh! Did you have dinner with Ana?","opts":["Yes, I did. We ate fish.","Yes, I had. We ate fish.","Yes, we eated fish."],"a":0,"por_que":"La respuesta corta lleva did, y eat es irregular: ate."},{"quien":"Tom","en":"What time did you go to bed?","opts":["At ten o'clock.","At ten o'clock yesterday night.","In ten o'clock."],"a":0,"por_que":"«Anoche» es last night, no yesterday night; con la hora va at."}]}],"escucha":[{"id":"sabado","texto":"Last Saturday I got up at nine. I had breakfast with my sister, and then we went to the park. In the evening I watched a movie at home. It was a great day!","preguntas":[{"q":"¿Con quién desayunó?","opts":["Con su hermana","Con su madre","Con una amiga"],"a":0},{"q":"¿Qué hizo por la noche?","opts":["Vio una película en casa","Fue al parque","Fue a una fiesta"],"a":0}]},{"id":"tom-mexico","texto":"My name is Tom. I was born in London. Two years ago I lived in Mexico, and I worked at a school there. I studied Spanish too. It was great!","preguntas":[{"q":"¿Dónde nació Tom?","opts":["En Londres","En México","En Lima"],"a":0},{"q":"¿Qué hizo en México?","opts":["Trabajó en una escuela","Estudió en una escuela","Trabajó en un hotel"],"a":0}]}],"escenas":[{"id":"esc-s1b08","ambito":"tronco","titulo":"¿Qué tal tu fin de semana?","contexto":"Es lunes por la mañana. Martín se encuentra con su amigo Jake en la puerta de su edificio, en Chicago. Tú eres Martín.","turnos":[{"quien":"Jake","en":"Hi, Martín! How was your weekend?","es":"¡Hola, Martín! ¿Qué tal tu fin de semana?","comprension":{"q":"¿Qué te pregunta Jake?","opts":["Qué tal tu fin de semana","Qué vas a hacer el fin de semana","Dónde estuviste anoche"],"a":0},"respuesta":{"modo":"elegir","opts":["It was great, thanks. And you?","It is great, thanks. And you?","Yes, it was. And you?"],"a":0,"por_que":"El fin de semana ya pasó: was, no is. Yes, it was no contesta a How…?, que pide una opinión."}},{"quien":"Jake","en":"Pretty good, thanks. What did you do?","es":"Bastante bien, gracias. ¿Qué hiciste?","respuesta":{"modo":"completar","en":"We visited Mónica's parents on Saturday.","huecos":["visited","on"],"distractores":["visit","in"]}},{"quien":"Jake","en":"Nice! Did you go to the lake on Sunday?","es":"¡Qué bien! ¿Y fueron al lago el domingo?","comprension":{"q":"¿Qué te pregunta Jake?","opts":["Si fueron al lago el domingo","Si fueron al parque el sábado","Si les gusta ir al lago"],"a":0},"respuesta":{"modo":"elegir","opts":["No, we didn't. It rained all day.","No, we didn't went. It rained all day.","No, we don't. It rained all day."],"a":0,"por_que":"La respuesta corta en pasado es No, we didn't, sin repetir el verbo. Con don't hablarías del presente."}},{"quien":"Jake","en":"Oh, right. So what did you do on Sunday?","es":"Ah, claro. ¿Y qué hicieron el domingo?","respuesta":{"modo":"elegir","opts":["We stayed at home. I made dinner and we watched a movie.","We stayed at home. I did dinner and we watched a movie.","We stay at home. I make dinner and we watch a movie."],"a":0,"por_que":"Preparar la cena es make dinner, no do. Y como ya pasó, todo va en pasado: stayed, made, watched."}},{"quien":"Jake","en":"Sounds nice! I had a party at my apartment on Saturday.","es":"¡Suena bien! El sábado hice una fiesta en mi departamento.","comprension":{"q":"¿Qué hizo Jake el sábado?","opts":["Hizo una fiesta en su departamento","Fue a una fiesta en el lago","Trabajó todo el día"],"a":0},"respuesta":{"modo":"elegir","opts":["Oh! How was it?","Oh! How is it?","Oh! How was?"],"a":0,"por_que":"La fiesta ya pasó: was. Y en inglés la pregunta necesita it: How was it?"}},{"quien":"Jake","en":"It was great, but I went to bed at three. I'm very tired today!","es":"Estuvo genial, pero me acosté a las tres. ¡Hoy estoy muy cansado!","respuesta":{"modo":"hablar","en":"Me too. I went to bed late last night.","es":"Yo también. Anoche me acosté tarde."}}],"notas_uso":["How was your weekend? es la pregunta típica del lunes. Se contesta corto, en pasado, y se devuelve: And you?","Pretty good es «bastante bien»: aquí pretty no significa «bonito».","Sounds nice! (o Sounds great!) es la reacción normal cuando alguien te cuenta algo que hizo o que va a hacer.","Preparar la cena es make dinner; do es «hacer» en general: What did you do?"]}],"lecturas":[{"id":"lec-s1b08-1","tipo":"oido","titulo":"El sábado de Mrs. Kowalski","texto":"On Saturday my son and his family came to my apartment. We had lunch together. I made chicken and rice, and the children ate a lot! Then we all walked to the park. It was sunny and warm. In the evening I was very tired, so I went to bed early. It was a wonderful day!","es":"El sábado mi hijo y su familia vinieron a mi departamento. Almorzamos juntos. Hice pollo con arroz, ¡y los niños comieron mucho! Luego caminamos todos al parque. Hacía sol y no hacía frío. Por la noche estaba muy cansada, así que me acosté temprano. ¡Fue un día maravilloso!","preguntas":[{"q":"¿Quién visitó a Mrs. Kowalski?","opts":["Su hijo y su familia","Su hija y su esposo","Martín y Mónica"],"a":0},{"q":"¿Qué hicieron después de almorzar?","opts":["Caminaron al parque","Vieron una película","Fueron al lago"],"a":0},{"q":"¿Qué hizo ella por la noche?","opts":["Se acostó temprano","Cocinó la cena","Llamó a su hijo"],"a":0}]},{"id":"lec-s1b08-2","tipo":"mensaje","titulo":"Un mensaje de la madre de Mónica","texto":"Hi Mónica and Martín! Thank you for coming on Saturday. We had a great time! Your father loved the cake. Did you get home OK? It rained all day here on Sunday, so we stayed at home and watched TV. How was your Sunday? Come again soon!","es":"¡Hola, Mónica y Martín! Gracias por venir el sábado. ¡La pasamos muy bien! A tu papá le encantó el pastel. ¿Llegaron bien a casa? Aquí llovió todo el domingo, así que nos quedamos en casa y vimos la tele. ¿Qué tal su domingo? ¡Vuelvan pronto!","glosas":{"cake":"pastel","again":"otra vez","soon":"pronto"},"preguntas":[{"q":"¿Por qué escribe la madre de Mónica?","opts":["Para darles las gracias por la visita","Para invitarlos a una fiesta","Para preguntar por Jake"],"a":0},{"q":"¿Qué hicieron los padres el domingo?","opts":["Se quedaron en casa y vieron la tele","Fueron al lago","Visitaron a Martín y Mónica"],"a":0}],"responder":{"consigna":"Contesta: da las gracias, di que llegaron bien a casa y cuenta qué hicieron el domingo.","elementos":[{"txt":"Das las gracias","claves":["thank"]},{"txt":"Dices que llegaron bien a casa","claves":["got home","get home"]},{"txt":"Cuentas qué hicieron el domingo","claves":["stayed","watched","made","went","had","visited","played"]}],"modelo":"Thank you! We had a great time too. Yes, we got home at nine. On Sunday we stayed at home. I made dinner and we watched a movie."}}],"escritura":{"consigna":"Escribe un mensaje a un amigo: cuéntale dónde estuviste el fin de semana, qué hiciste y qué tal estuvo.","elementos":[{"txt":"Dices dónde estuviste","claves":["i was","we were","went to"]},{"txt":"Cuentas qué hiciste, en pasado","claves":["visited","watched","played","made","had","saw","ate","bought","met","stayed","walked","studied","worked"]},{"txt":"Dices qué tal estuvo","claves":["it was","great","good","bad","nice"]}],"modelo":"Hi Tom! On Saturday I went to the park with my sister. We played soccer and then we had lunch at a restaurant. On Sunday I stayed at home and watched a movie. It was a great weekend!"},"biblioteca":[{"id":"bib-s1b08-1","titulo":"Un día terrible","tipo":"texto","texto":"Yesterday was a terrible day for Jake. He got up late, so he didn't have breakfast. It rained all day, and he forgot his coat at home. He waited for the bus for twenty minutes. At work, his boss said, \"Jake, the meeting was at nine!\" He ate a sandwich at his desk and worked all afternoon. In the evening he got home late and very tired. Then he opened the door and saw all his friends. \"Happy birthday, Jake!\" It was his birthday, and he forgot! In the end, it was a great day.","es":"Ayer fue un día terrible para Jake. Se levantó tarde, así que no desayunó. Llovió todo el día y olvidó el abrigo en casa. Esperó el autobús veinte minutos. En el trabajo, su jefe le dijo: «Jake, ¡la reunión era a las nueve!». Comió un sándwich en su escritorio y trabajó toda la tarde. Por la noche llegó a casa tarde y muy cansado. Entonces abrió la puerta y vio a todos sus amigos. «¡Feliz cumpleaños, Jake!» Era su cumpleaños, ¡y se le olvidó! Al final, fue un gran día.","glosas":{"boss":"jefe","meeting":"reunión","desk":"escritorio","door":"puerta","happy birthday":"feliz cumpleaños","birthday":"cumpleaños","end":"final"},"preguntas":[{"q":"¿Por qué no desayunó Jake?","opts":["Porque no tenía comida","Porque se levantó tarde","Porque estaba enfermo"],"a":1},{"q":"¿Qué olvidó en casa?","opts":["El abrigo","El teléfono","Las llaves"],"a":0},{"q":"¿Qué encontró al llegar a casa?","opts":["Su casa sin luz","A su jefe","A sus amigos, que le daban una sorpresa de cumpleaños"],"a":2}]},{"id":"bib-s1b08-2","titulo":"Martín no sabe bailar","tipo":"texto","texto":"Martín and Mónica met eight years ago at a party in Lima. Martín can't dance, but Mónica loves dancing. \"Do you want to dance?\" she asked. \"Sorry, I can't dance!\" Martín said. \"No problem. I can teach you.\" They danced all night. Martín danced very badly, and Mónica laughed a lot. The next day he called her, and they had coffee together. Then they had dinner, and then they went to the cinema. Two years later, they got married. Now they live in Chicago, and Martín can dance a little.","es":"Martín y Mónica se conocieron hace ocho años en una fiesta en Lima. Martín no sabe bailar, pero a Mónica le encanta bailar. «¿Quieres bailar?», preguntó ella. «¡Lo siento, no sé bailar!», dijo Martín. «No hay problema. Yo te puedo enseñar.» Bailaron toda la noche. Martín bailó muy mal y Mónica se rio mucho. Al día siguiente él la llamó y tomaron un café juntos. Después cenaron, y luego fueron al cine. Dos años después se casaron. Ahora viven en Chicago, y Martín sabe bailar un poco.","glosas":{"asked":"preguntó","teach":"enseñar","badly":"mal","next":"siguiente","cinema":"cine","later":"después","got married":"se casaron"},"preguntas":[{"q":"¿Dónde se conocieron Martín y Mónica?","opts":["En una fiesta en Lima","En el trabajo, en Chicago","En un café"],"a":0},{"q":"¿Qué pasó en la fiesta?","opts":["Martín cantó toda la noche","Mónica le enseñó a bailar y se rio mucho","Martín no habló con nadie"],"a":1},{"q":"¿Qué hicieron al día siguiente?","opts":["Fueron a otra fiesta","Fueron a la playa","Tomaron un café juntos"],"a":2}]},{"id":"bib-s1b08-3","titulo":"El bolso de Mrs. Kowalski","tipo":"audio","texto":"Hi Peter, it's Mom. You can't believe what happened yesterday! I went to the supermarket in the morning. I bought bread, milk and some apples. Then I walked home, and I didn't have my bag! My money, my card and my phone were in it. I felt terrible. I called the supermarket, but they didn't have it. Then, at five o'clock, a young man came to my door. It was Leo's brother! He found my bag at the bus stop and brought it to me. I made him a cake. Call me, OK?","es":"Hola, Peter, soy mamá. ¡No vas a creer lo que pasó ayer! Fui al supermercado por la mañana. Compré pan, leche y unas manzanas. Luego volví caminando a casa, ¡y no tenía el bolso! Mi dinero, mi tarjeta y mi teléfono estaban adentro. Me sentí fatal. Llamé al supermercado, pero no lo tenían. Entonces, a las cinco, un joven vino a mi puerta. ¡Era el hermano de Leo! Encontró mi bolso en la parada del autobús y me lo trajo. Le hice un pastel. Llámame, ¿sí?","glosas":{"mom":"mamá","believe":"creer","bag":"bolso","money":"dinero","phone":"teléfono","door":"puerta","cake":"pastel"},"preguntas":[{"q":"¿Qué le pasó a Mrs. Kowalski?","opts":["Perdió el autobús","Volvió a casa sin su bolso","Se olvidó de comprar pan"],"a":1},{"q":"¿Quién le devolvió el bolso?","opts":["El hermano de Leo","Un empleado del supermercado","Su hijo Peter"],"a":0},{"q":"¿Dónde estaba el bolso?","opts":["En el supermercado","En la parada del autobús","En el parque"],"a":1}]},{"id":"bib-s1b08-4","titulo":"La primera cena de Lucía","tipo":"texto","texto":"Last Saturday Lucía made dinner for her friends. It was her first time. She bought chicken, rice and some vegetables, and she cooked all afternoon. At seven o'clock her friends came. They sat at the table, and Lucía opened the kitchen door. Oh no! The chicken was black! Lucía felt terrible. Then her friend Andrés said, \"No problem! I know a very good pizza place near here.\" They walked to the restaurant and ate pizza. They laughed all night. It wasn't the dinner Lucía wanted, but it was a great night.","es":"El sábado pasado Lucía hizo la cena para sus amigos. Era la primera vez. Compró pollo, arroz y unas verduras, y cocinó toda la tarde. A las siete llegaron sus amigos. Se sentaron a la mesa y Lucía abrió la puerta de la cocina. ¡Ay, no! ¡El pollo estaba negro! Lucía se sintió fatal. Entonces su amigo Andrés dijo: «¡No pasa nada! Conozco una pizzería muy buena cerca de aquí». Fueron caminando al restaurante y comieron pizza. Se rieron toda la noche. No fue la cena que Lucía quería, pero fue una gran noche.","glosas":{"vegetables":"verduras","sat":"se sentaron","kitchen":"cocina","door":"puerta","pizza":"pizza","place":"lugar"},"preguntas":[{"q":"¿Qué pasó con el pollo?","opts":["Se quemó","Estaba crudo","Se cayó al suelo"],"a":0},{"q":"¿Qué propuso Andrés?","opts":["Hacer otra cena","Comprar más pollo","Ir a comer pizza"],"a":2}]},{"id":"bib-s1b08-5","titulo":"El primer día en Chicago","tipo":"texto","texto":"Martín and Mónica came to Chicago in August. Their first day was very long. They got up at four in the morning in Lima and went to the airport. They got to Chicago at seven in the evening, very tired and very hungry. Martín went to a café. \"Two coffees with milk, please,\" he said. The waiter didn't understand, and Martín got two teas! Then they walked to their new apartment, but they were lost. A woman stopped. \"Are you looking for Oak Street? I live there!\" It was Mrs. Kowalski. That night, she made chicken soup and rice for them, and they ate in her kitchen. It was a long day, but it was a good day.","es":"Martín y Mónica llegaron a Chicago en agosto. Su primer día fue muy largo. Se levantaron a las cuatro de la mañana en Lima y fueron al aeropuerto. Llegaron a Chicago a las siete de la noche, muy cansados y con mucha hambre. Martín fue a un café. «Dos cafés con leche, por favor», dijo. El mesero no entendió, ¡y Martín recibió dos tés! Después caminaron a su departamento nuevo, pero estaban perdidos. Una mujer se detuvo. «¿Buscan Oak Street? ¡Yo vivo ahí!». Era Mrs. Kowalski. Esa noche, ella les hizo sopa de pollo con arroz, y comieron en su cocina. Fue un día largo, pero fue un buen día.","glosas":{"long":"largo","stopped":"se detuvo","airport":"aeropuerto"},"preguntas":[{"q":"¿A qué hora se levantaron en Lima?","opts":["A las cuatro","A las siete","A las ocho"],"a":0},{"q":"¿Qué recibió Martín en el café?","opts":["Dos cafés con leche","Sopa de pollo","Dos tés"],"a":2},{"q":"¿Quién era la mujer que se detuvo?","opts":["Linda, la profesora","Mrs. Kowalski","Una mesera"],"a":1}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"yesterday","opts":["dibujar","ayer","menú"],"a":"ayer","items":["yesterday"]},{"tipo":"significado","nuevo":true,"en":"tired","opts":["tarjeta","caminar","cansado"],"a":"cansado","items":["tired"]},{"tipo":"tarjeta","en":"I was at home.","es":"Estaba en casa.","nota":"was es el pasado de am: «estaba» o «estuve».","items":["i-was-at-home"]},{"tipo":"tarjeta","en":"It was great.","es":"Fue genial.","nota":"Para decir qué tal estuvo algo: una película, una fiesta, el fin de semana.","items":["it-was-great"]},{"tipo":"tarjeta","en":"She was at work.","es":"Ella estaba en el trabajo.","nota":null,"items":["she-was-at-work"]},{"tipo":"significado","nuevo":true,"en":"How was your weekend?","opts":["¿Me traes la cuenta, por favor?","¿Qué tal tu fin de semana?","El hermano de Ana es médico."],"a":"¿Qué tal tu fin de semana?","items":["how-was-your-weekend"]},{"tipo":"emparejar","pares":[["yesterday","ayer"],["tired","cansado"],["I was at home.","Estaba en casa."]],"items":["yesterday","tired","i-was-at-home"]},{"tipo":"situacion","q":"Un amigo te pregunta «How was the movie?». Te gustó mucho. Respondes…","audio":null,"opts":["It was great!","It is great!","Yes, it was."],"a":0,"por_que":"La película ya pasó: se habla en pasado, con was."
