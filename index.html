it's.","Yes, is my first time."],"a":0,"por_que":"La respuesta corta no se contrae al final: Yes, it is (nunca Yes, it's). Y la frase necesita sujeto: it's my first time."}},{"quien":"Officer","en":"OK. Put your right hand here, please. Thank you. Welcome to Miami!","es":"Bien. Pon la mano derecha aquí, por favor. Gracias. ¡Bienvenida a Miami!","comprension":{"q":"¿Qué te pide el oficial?","opts":["Que pongas la mano derecha","Que mires a la cámara","Que abras la maleta"],"a":0},"respuesta":{"modo":"hablar","en":"Thank you. Have a good day!","es":"Gracias. ¡Que tengas un buen día!"}}],"notas_uso":["Ante un oficial de migración, respuestas cortas y verdaderas: I'm here on vacation, two weeks, at a hotel. No hace falta contar más.","How long are you staying? pregunta cuánto tiempo te quedas aunque vaya con -ing. Se contesta con going to o solo con el tiempo: Two weeks.","Contestar Yes a How long…? o a Where…? por no entender es un error frecuente: fíjate en la primera palabra de la pregunta.","Thank you. Have a good day! es una despedida amable y neutra al terminar."]}],"lecturas":[{"id":"lec-s1b09-1","tipo":"oido","titulo":"Un audio de Lucía","texto":"Hi Andrés, it's me. I'm at the airport in Lima. My flight was delayed, and now it leaves at eleven at night. I'm going to arrive in Miami at seven in the morning. I'm very tired! Can you call the hotel and tell them, please? Breakfast is included, so I can eat there.","es":"Hola, Andrés, soy yo. Estoy en el aeropuerto de Lima. Mi vuelo se retrasó y ahora sale a las once de la noche. Voy a llegar a Miami a las siete de la mañana. ¡Estoy muy cansada! ¿Puedes llamar al hotel y avisarles, por favor? El desayuno está incluido, así que puedo comer allí.","preguntas":[{"q":"¿Dónde está Lucía?","opts":["En el aeropuerto de Lima","En un hotel de Miami","En el aeropuerto de Miami"],"a":0},{"q":"¿A qué hora va a llegar a Miami?","opts":["A las siete de la mañana","A las once de la noche","A las siete de la tarde"],"a":0},{"q":"¿Qué le pide a Andrés?","opts":["Que llame al hotel","Que la recoja en el aeropuerto","Que le compre un boleto"],"a":0}]},{"id":"lec-s1b09-2","tipo":"correo","titulo":"Un correo del hotel","texto":"Dear Lucía López, Thank you for your reservation at the Ocean Hotel. Your room: a double room for three nights, from May 12 to May 15. Breakfast is included. It's from seven to ten in the restaurant. You can check in after three in the afternoon. The hotel is ten minutes from the beach. Please tell us your arrival time. See you soon!","es":"Estimada Lucía López: Gracias por tu reserva en el Ocean Hotel. Tu habitación: una habitación doble para tres noches, del 12 al 15 de mayo. El desayuno está incluido. Es de siete a diez, en el restaurante. Puedes registrarte después de las tres de la tarde. El hotel está a diez minutos de la playa. Por favor, dinos a qué hora llegas. ¡Hasta pronto!","preguntas":[{"q":"¿Qué habitación reservó Lucía?","opts":["Una habitación doble","Una habitación individual","Dos habitaciones"],"a":0},{"q":"¿A qué hora es el desayuno?","opts":["De siete a diez","De tres a diez","De siete a doce"],"a":0},{"q":"¿Qué le pide el hotel a Lucía?","opts":["Que diga a qué hora llega","Que pague el desayuno","Que llame por teléfono"],"a":0}],"responder":{"consigna":"Contesta al hotel: da las gracias, di que tu vuelo se retrasó y a qué hora vas a llegar.","elementos":[{"txt":"Das las gracias","claves":["thank"]},{"txt":"Dices que tu vuelo se retrasó","claves":["delayed","late"]},{"txt":"Dices a qué hora llegas","claves":["o'clock","in the morning","in the evening","at night","in the afternoon"]}],"modelo":"Hello! Thank you very much. My flight was delayed, so I'm going to be at the hotel at eight o'clock in the morning."}}],"escritura":{"consigna":"Escribe una postal a un amigo desde tu viaje: di dónde estás, qué tiempo hace, qué hiciste ayer y qué vas a hacer mañana.","elementos":[{"txt":"Dices dónde estás","claves":["i'm in","i am in","we're in","we are in"]},{"txt":"Dices qué tiempo hace","claves":["sunny","hot","cold","raining","windy"]},{"txt":"Cuentas qué hiciste ayer","claves":["yesterday"]},{"txt":"Dices qué vas a hacer","claves":["going to"]}],"modelo":"Hi Ana! I'm in Miami with my brother. It's sunny and very hot. Yesterday we went to the beach. Tomorrow we're going to visit the city. See you soon! Lucía"},"biblioteca":[{"id":"bib-s1b09-1","titulo":"La maleta equivocada","tipo":"texto","texto":"Lucía arrived in Miami at seven in the morning. She was very tired. At the airport she took a black suitcase and went to her hotel in a taxi. In her room, she opened the suitcase. Oh no! There were big shirts, a man's hat and a camera. It wasn't her suitcase! She called the airport. \"Don't worry,\" the woman said. \"A man called us. He has your suitcase.\" One hour later, the man came to the hotel. His name was Daniel, and he was from Lima too. Now they're going to have dinner together.","es":"Lucía llegó a Miami a las siete de la mañana. Estaba muy cansada. En el aeropuerto tomó una maleta negra y fue a su hotel en taxi. En su habitación, abrió la maleta. ¡Ay, no! Había camisas grandes, un sombrero de hombre y una cámara. ¡No era su maleta! Llamó al aeropuerto. «No te preocupes», dijo la mujer. «Un señor nos llamó. Él tiene tu maleta.» Una hora después, el señor llegó al hotel. Se llamaba Daniel y también era de Lima. Ahora van a cenar juntos.","glosas":{"room":"habitación","camera":"cámara","don't worry":"no te preocupes","worry":"preocuparse","hour":"hora","later":"después"},"preguntas":[{"q":"¿Qué encontró Lucía en la maleta?","opts":["Su ropa y su pasaporte","Ropa de hombre y una cámara","Nada, estaba vacía"],"a":1},{"q":"¿Quién tenía la maleta de Lucía?","opts":["Un señor de Lima llamado Daniel","La recepcionista del hotel","El taxista"],"a":0},{"q":"¿Qué van a hacer Lucía y Daniel?","opts":["Volver al aeropuerto","Ir a la playa","Cenar juntos"],"a":2}]},{"id":"bib-s1b09-2","titulo":"¿Hotel u hostal?","tipo":"texto","texto":"Andrés and his sister Carla are going to visit Cusco next month. They're looking for a place to stay. The Inca Hostel is the cheapest. It's twenty dollars a night, but the rooms are very small and breakfast isn't included. The Plaza Hotel is more expensive. It's ninety dollars a night, but it's in the main square and it has a beautiful view of the city. \"The hostel is cheaper,\" says Andrés. \"Yes, but the hotel is better,\" says Carla. In the end, they choose the hostel. With the money, they're going to buy train tickets to Machu Picchu.","es":"Andrés y su hermana Carla van a visitar Cusco el mes que viene. Están buscando un lugar donde quedarse. El Inca Hostel es el más barato. Cuesta veinte dólares la noche, pero las habitaciones son muy pequeñas y el desayuno no está incluido. El Plaza Hotel es más caro. Cuesta noventa dólares la noche, pero está en la plaza principal y tiene una vista preciosa de la ciudad. «El hostal es más barato», dice Andrés. «Sí, pero el hotel es mejor», dice Carla. Al final, eligen el hostal. Con el dinero, van a comprar boletos de tren a Machu Picchu.","glosas":{"month":"mes","place":"lugar","rooms":"habitaciones","main":"principal","says":"dice","end":"final","choose":"eligen","money":"dinero"},"preguntas":[{"q":"¿Qué tiene de bueno el Plaza Hotel?","opts":["Es el más barato","Está en la plaza principal y tiene buena vista","Tiene habitaciones grandes y baratas"],"a":1},{"q":"¿Qué eligen al final?","opts":["El hostal","El hotel","Una casa"],"a":0},{"q":"¿Para qué van a usar el dinero que ahorran?","opts":["Para cenar en un restaurante caro","Para comprar recuerdos","Para los boletos de tren a Machu Picchu"],"a":2}]},{"id":"bib-s1b09-3","titulo":"Una postal de Jake","tipo":"texto","texto":"Hi Martín and Mónica! I'm in Cusco. It's the most beautiful city in Peru, and the mountains are amazing. Yesterday I went by train to Machu Picchu. It was the best day of my trip! But Cusco is very high, and on the first day I felt terrible. I had a headache and I slept all afternoon. Now I'm fine. Tomorrow I'm going to go to Lima by plane. It's faster than the bus! Then I'm going to stay at the beach for three days. See you in two weeks! Jake","es":"¡Hola, Martín y Mónica! Estoy en Cusco. Es la ciudad más bonita de Perú, y las montañas son increíbles. Ayer fui en tren a Machu Picchu. ¡Fue el mejor día del viaje! Pero Cusco está muy alto, y el primer día me sentí fatal. Me dolía la cabeza y dormí toda la tarde. Ahora estoy bien. Mañana voy a ir a Lima en avión. ¡Es más rápido que el autobús! Luego me voy a quedar en la playa tres días. ¡Nos vemos en dos semanas! Jake","glosas":{"high":"alto","slept":"dormí"},"preguntas":[{"q":"¿Cuál fue el mejor día del viaje de Jake?","opts":["El día en la playa","El día que fue a Machu Picchu","El primer día en Cusco"],"a":1},{"q":"¿Por qué se sintió mal el primer día?","opts":["Porque Cusco está muy alto","Porque comió mucho","Porque hacía mucho frío"],"a":0},{"q":"¿Cómo va a ir a Lima?","opts":["En autobús","En tren","En avión"],"a":2}]},{"id":"bib-s1b09-4","titulo":"El peor viaje, el mejor viaje","tipo":"audio","texto":"Forty years ago, I went to Spain by train with my sister. It was the worst trip of my life! The train was very slow, and it was delayed for six hours. It rained every day. Then, in Madrid, I lost my passport. I was at the police station all morning. But there, a young police officer helped me. He was very kind, and he had beautiful eyes. His name was Pablo. Two years later, Pablo and I got married. So yes, it was the worst trip, but it was the best trip too.","es":"Hace cuarenta años fui a España en tren con mi hermana. ¡Fue el peor viaje de mi vida! El tren era muy lento y se retrasó seis horas. Llovió todos los días. Luego, en Madrid, perdí el pasaporte. Estuve en la comisaría toda la mañana. Pero allí un policía joven me ayudó. Era muy amable y tenía unos ojos preciosos. Se llamaba Pablo. Dos años después, Pablo y yo nos casamos. Así que sí: fue el peor viaje, pero también fue el mejor.","glosas":{"life":"vida","hours":"horas","police station":"comisaría","police":"policía","helped":"ayudó","kind":"amable","eyes":"ojos","later":"después","got married":"nos casamos"},"preguntas":[{"q":"¿Qué le pasó en Madrid?","opts":["Perdió el pasaporte","Perdió el tren","Se enfermó"],"a":0},{"q":"¿Quién era Pablo?","opts":["Su hermano","El policía que la ayudó, y después su esposo","Un turista de Lima"],"a":1},{"q":"¿Por qué fue también el mejor viaje?","opts":["Porque el hotel era muy bueno","Porque visitó muchas ciudades","Porque conoció a su esposo"],"a":2}]},{"id":"bib-s1b09-5","titulo":"El plan de Mónica es mejor","tipo":"texto","texto":"Next month, Martín and Mónica are going to take a vacation. Martín has a plan. \"We're going to go to New York by train. The train is slower than the plane, but it's cheaper. We're going to stay at a small hotel near a park and visit a lot of museums.\" Mónica smiles. \"I have a plan too, and it's better. We aren't going to go to New York. We're going to go to Lima!\" She has two plane tickets in her hand. \"Your mother is going to make fish and rice for us.\" Martín is very happy. \"Lima is smaller than New York,\" he says, \"but it's more beautiful. And the food is the best in the world!\"","es":"El próximo mes, Martín y Mónica van a tomarse unas vacaciones. Martín tiene un plan. «Vamos a ir a Nueva York en tren. El tren es más lento que el avión, pero es más barato. Vamos a quedarnos en un hotel pequeño cerca de un parque y a visitar muchos museos». Mónica sonríe. «Yo también tengo un plan, y es mejor. No vamos a ir a Nueva York. ¡Vamos a ir a Lima!». Tiene dos boletos de avión en la mano. «Tu mamá va a hacernos pescado con arroz». Martín está muy feliz. «Lima es más pequeña que Nueva York», dice, «pero es más bonita. ¡Y la comida es la mejor del mundo!».","glosas":{"plan":"plan"},"preguntas":[{"q":"¿Cómo quiere viajar Martín a Nueva York?","opts":["En avión","En tren","En autobús"], /* Palabras de la capa receptiva: grupos de "Escucha y empareja", sin traducciones repetidas */
function receptivoDe(b, para){
  const lista = (b.receptivo||[]).filter(r => para===undefined ? !r.para : r.para===para);
  const out = [];
  for(let k=0; k<lista.length; k+=4){
    const g = lista.slice(k,k+4).filter((x,i,a)=>a.findIndex(y=>y.es===x.es)===i);
    if(g.length>=2) out.push({type:'match', oido:true, tag:para?'Palabras que vas a oír':'Palabras nuevas', q:'Escucha y empareja', pairs:g.map(x=>[x.en,x.es]), items:[]});
  }
  return out;
}
function turnoDe(t, tag, conHablar){
  const base = {tag, quien:t.quien, say:t.en, oyo:t.en, oyoEs:t.es, autoSay:t.en, items:t.items||[]};
  const rr = t.respuesta;
  if(rr.modo==='elegir') return {...base, type:'choose', q:'¿Qué respondes?', opts:rr.opts, a:rr.a, why:rr.por_que||null};
  if(rr.modo==='completar') return {...base, type:'gap', q:'Completa tu respuesta', en:rr.en, huecos:rr.huecos, bank:rr.huecos.concat(rr.distractores||[])};
  if(rr.modo==='escribir') return {...base, type:'write', q:rr.es, answers:[rr.en, ...(rr.alts||[]), ...(rr.acepta||[])]};
  if(rr.modo==='hablar' && conHablar) return {...base, type:'speak', q:'Responde en voz alta', say:rr.en, es:rr.es||'', prev:{quien:t.quien, en:t.en}, autoSay:t.en};
  return null;
}
function escenaDe(b, soloRespuestas){
  const out = [];
  for(const e of b.escenas||[]){
    const tag = 'Escena · '+e.titulo;
    if(!soloRespuestas){ out.push({type:'scene', tag:'Escena', titulo:e.titulo, contexto:e.contexto, items:[]}); out.push(...receptivoDe(b, e.id)); }
    for(const t of e.turnos){
      const base = {tag, quien:t.quien, say:t.en, oyo:t.en, oyoEs:t.es, autoSay:t.en, items:[]};
      if(t.comprension && !soloRespuestas) out.push({...base, type:'choose', q:t.comprension.q, opts:t.comprension.opts, a:t.comprension.a, tag:tag+' · ¿Entendiste?'});
      const tu = turnoDe(t, tag, !soloRespuestas); if(tu) out.push(tu);
    }
  }
  return out;
}
function lecturasDe(b){
  const out = [];

    } else {
      out.push({type:'read', tag:'Lee', titulo:l.titulo||'', texto:l.texto, es:l.es, glosas:l.glosas||{}, items:[]});
      l.preguntas.forEach(p=>out.push({type:'choose', tag:'Lee', q:p.q, opts:p.opts, a:p.a, texto:l.texto, items:[]}));

/* Pozo de preguntas de un bloque para las pruebas: la prueba del bloque y ejercicios de sus lecciones */
function pozoDe(b){
  const desdeLecciones = b.lecciones.flat().filter(x=>['construir','escribir','escuchar','significado','elegir','traducir_oido','completar','detectar','situacion'].includes(x.tipo));
  return b.prueba.concat(desdeLecciones);
}
function ejerciciosCurso(kind, opts){
  const un = opts.unit || S.unit, ni = opts.node ?? S.node, b = bloque(un);
  if(kind==='lesson'){ const ls = NODO_LECCIONES[ni] || [1,2,3]; const num = opts.replay ? ls[Math.floor(Math.random()*ls.length)] : ls[Math.min(S.session, ls.length-1)]; return b.lecciones[num-1].map(adaptar).filter(Boolean); }
  if(kind==='dialog') return (b.escenas||[]).length ? escenaDe(b) : dialogosDe(b);
  if(kind==='listen') return (b.lecturas||[]).length ? lecturasDe(b) : escuchaDe(b);
  if(kind==='review') return receptivoDe(b).concat(b.repaso.map(adaptar).filter(Boolean), opts.replay ? [] : escrituraDe(b));
  if(kind==='biblioteca'){ const t = textoBiblioteca(opts.texto); return t ? bibliotecaDe(t) : []; }
  if(kind==='srs') return ejerciciosPara(pendientes().slice(0,12).map(x=>x.id), 'Repaso');
  if(kind==='errores') return (opts.lista || leerErrores()).map(x=>({...x}));
  if(kind==='sounds'){ const vistos=new Set(); const out=[];
    for(const bl of CURSO.bloques.filter(x=>x.bloque<=un)) for(const l of bl.lecciones) for(const x of l) if(x.tipo==='oido' && !vistos.has(x.opts.join('|'))){ vistos.add(x.opts.join('|')); out.push(adaptar(x)); }
    return shuffle(out).slice(0,10); }
  if(kind==='jump'||kind==='placement'){
    const desde = kind==='placement' ? 1 : S.unit, hasta = kind==='placement' ? 9 : Math.min(Math.min(S.jumpTo,10)-1, 9);
    const nums = []; for(let n=desde;n<=hasta;n++) nums.push(n);
    const por = kind==='placement' ? 2 : Math.max(2, Math.ceil(18/nums.length));
    const base = nums.flatMap(n=>{ const bl = bloque(n); const pozo = kind==='placement' ? bl.prueba : pozoDe(bl);
      return shuffle(pozo).slice(0,por).map(x=>({...adaptar(x), tag:'Bloque '+n})).filter(x=>x.type); });
    // la prueba de un bloque suma turnos de su escena (responder) y palabras en riesgo
    if(opts.blockTest && nums.length===1){ const bl = bloque(nums[0]);
      const turnos = shuffle(escenaDe(bl, true)).slice(0,2).map(x=>({...x, tag:'Bloque '+nums[0]}));
      const riesgo = ejerciciosPara(pendientes().slice(0,3).map(x=>x.id), 'Bloque '+nums[0]);
      return base.concat(turnos, riesgo); }
    return base;
  }
  return [];
}

/* ---------- memoria de cada palabra: FSRS-6 con los parámetros por defecto de ts-fsrs, retención 0,9 ----------
   La primera vez que se ve, entra en memoria. Después, cada vez que se usa bien o mal en cualquier ejercicio
   cuenta como repaso (repaso tejido). Con un intervalo de 90 días o más queda "integrada" y sale del repaso. */
const FW=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FDECAY=FW[20], FFACTOR=Math.pow(0.9,-1/FDECAY)-1;
const fR=(t,st)=>Math.pow(1+FFACTOR*t/st,-FDECAY);
const fIvl=st=>Math.max(1,Math.min(365,Math.round(st)));
const fD0=g=>Math.min(10,Math.max(1,FW[4]-Math.exp(FW[5]*(g-1))+1));
const fNextD=(d,g)=>{ const dp=d+(-FW[6]*(g-3))*(10-d)/9; return Math.min(10,Math.max(1,FW[7]*fD0(4)+(1-FW[7])*dp)); };
const fSRec=(d,st,r,g)=>st*(1+Math.exp(FW[8])*(11-d)*Math.pow(st,-FW[9])*(Math.exp((1-r)*FW[10])-1));
const fSFor=(d,st,r)=>Math.min(FW[11]*Math.pow(d,-FW[12])*(Math.pow(st+1,FW[13])-1)*Math.exp((1-r)*FW[14]), st/Math.exp(FW[17]*FW[18]));
let DIA_EXTRA = 0; // solo para pruebas
const hoy = () => Math.floor(Date.now()/86400000) + DIA_EXTRA;
let MEM = {};
try{ MEM = JSON.parse(localStorage.getItem('sendero-memoria')||'{}') || {}; }catch(x){ MEM = {}; }
const guardarMem = () => { try{ localStorage.setItem('sendero-memoria', JSON.stringify(MEM)); }catch(x){} };
function memoria(id, ok){
  if(!ITEM[id]) return;
  const t = hoy(), m = MEM[id];
  if(!m){ const g = ok?3:1; const st = FW[g-1]; MEM[id] = {s:st, d:fD0(g), last:t, due:t+fIvl(st), n:1, int:false}; return; }
  if(m.last===t){ if(!ok) m.int=false; return; } // varias veces el mismo día: cuenta la primera
  const r = fR(t-m.last, m.s);
  if(ok){ m.d=fNextD(m.d,3); m.s=fSRec(m.d,m.s,r,3); } else { m.d=fNextD(m.d,1); m.s=fSFor(m.d,m.s,r); m.int=false; }
  m.last=t; m.n++; m.due=t+fIvl(m.s); if(ok && fIvl(m.s)>=90) m.int=true;
}
/* Palabras que toca repasar hoy, de la más a la menos olvidada */
function pendientes(excluir){
  const t = hoy(), no = new Set(excluir||[]);
  return Object.entries(MEM).filter(([id,m])=>ITEM[id] && !m.int && m.due<=t && !no.has(id))
    .map(([id,m])=>({id, r:fR(t-m.last,m.s)})).sort((a,b)=>a.r-b.r);
}
const integradas = () => Object.values(MEM).filter(m=>m.int).length;
/* Ejercicios generados al momento para unas palabras: emparejar (palabras) y dictado o significado (frases) */
function ejerciciosPara(ids, tag){
  const its = ids.map(id=>ITEM[id]).filter(Boolean);
  const palabras = its.filter(i=>!esFraseIt(i)), frases = its.filter(esFraseIt);
  const out = [];
  const significado = it => { const otros = shuffle(Object.values(ITEM).filter(o=>o.es!==it.es && MEM[o.id] && esFraseIt(o)===esFraseIt(it))).slice(0,2).map(o=>o.es);
    const opts = shuffle([it.es, ...otros]); return {type:'choose', tag, q:it.en, say:it.en, opts, a:opts.indexOf(it.es), items:[it.id]}; };
  for(let k=0; k<palabras.length; k+=4){
    const g = palabras.slice(k,k+4).filter((x,i,a)=>a.findIndex(y=>y.es===x.es)===i);
    if(g.length>=2) out.push({type:'match', oido:k%8===0, tag, q:k%8===0?'Escucha y empareja':'Toca los pares', pairs:g.map(i=>[i.en,i.es]), items:g.map(i=>i.id)});
    else g.forEach(i=>out.push(significado(i)));
  }
  frases.forEach((it,k)=>out.push(k%2 ? significado(it) : {type:'write', tag, q:'Escribe lo que oyes', say:it.en, answers:[it.en], es:it.es, dictado:true, autoSay:it.en, items:[it.id]}));
  return out;
}

/* Destreza de cada ejercicio, para el reparto en Progreso */
function destrezaDe(e){
  if(e.type==='speak') return 'Hablar';

/* Cualquier actividad cuenta para la racha; un día libre por semana no la rompe */
function actividad(minutos){
  const t = hoy(), semana = Math.floor((t+3)/7);
  if(S.minDia!==t){
    if(S.ultimoDia===t-1) S.streak++;
    else if(S.ultimoDia===t-2 && S.libreSemana!==semana){ S.streak++; S.libreSemana=semana; }
    else if(S.ultimoDia!==t) S.streak = 1;
    S.minDia=t; S.min=0;
  }
  S.min += minutos; S.ultimoDia = t;
}

/* ---------- motor de lección ---------- */
let L = null;
function startLesson(kind, opts){
  opts = opts||{};
  let items;
  if(CURSO){ items = ejerciciosCurso(kind, opts); if(!items.length) return; }
  else if(kind==='dialog') items = DIALOG;
  else if(kind==='listen') items = LISTEN;
  else if(kind==='review') items = shuffle(LESSON.filter(e=>!['learn','speak'].includes(e.type))).slice(0,6);
  else if(kind==='jump'||kind==='placement'){
    const from = S.unit, to = Math.min(S.jumpTo,10), span = Math.max(1,to-from);
    items = TEST_POOL.map((e,i)=>({...e, tag: kind==='placement' ? 'Prueba de nivel' : 'Bloque '+(from + Math.floor(i*span/TEST_POOL.length))}));
  }
  else if(!CURSO) items = LESSON;
  // repaso tejido: en cada lección, hasta 4 palabras a punto de olvidarse, mezcladas con lo nuevo
  if(CURSO && kind==='lesson'){
    const propias = new Set(items.flatMap(e=>e.items||[]));
    const tej = ejerciciosPara(pendientes([...propias]).slice(0,4).map(x=>x.id), 'Tus palabras de hoy');
    tej.forEach((e,k)=>items.splice(Math.min(items.length, k===0?3:9), 0, e));
  }
  if(!items.length) return;
  const test = kind==='jump'||kind==='placement';
  L = {kind, errEx:[], lista:opts.lista||null, replay:!!opts.replay, blockTest:!!opts.blockTest, queue: items.map(e=>({...e})), total: items.filter(e=>e.type!=='speak').length,
       done:0, hits:0, tries:0, firstTry:true, combo:0, test, allowed: kind==='jump'?Math.floor(items.length*0.2):Infinity, errors:0,
       t0:Date.now(), ans:null, phase:'answer', weak:{}, mistakes:[], newItems:items.filter(e=>e.type==='learn'||e.tag==='Nuevo').length, showWhy:false, wrongIdx:[], log:[], note:null, fbk:null, qgloss:null};
  S.screen = test ? 'test' : 'lesson';
  render();
}

function vozTexto(e){
  const v = L.voz;
  if(!v) return '<p class="hint center">Toca el micrófono y lee la frase en voz alta.</p>';
  if(v.estado==='escuchando') return '<p class="hint center">Te escucho…</p>';
  if(v.estado==='oido'){
    const pal = v.p.palabras.map((w,k)=>`<span class="${v.p.marcas[k]?'w-ok':'w-no'}">${esc(w)}</span>`).join(' ');
    return `<div class="oido"><b>Te entendí</b>«${esc(v.texto)}»<br>${pal}</div>${v.ok?'':'<p class="hint">Las palabras subrayadas no se entendieron. Vuelve a intentarlo: más despacio y marcando el final de cada palabra.</p>'}`;
  }
  if(v.estado==='silencio') return '<p class="hint center">No te oí. Toca el micrófono e inténtalo otra vez.</p>';
  if(v.estado==='denegado') return '<p class="hint center">El micrófono no tiene permiso en este navegador. Puedes darlo desde el candado de la barra de direcciones o marcar tú si la dijiste.</p>';
  if(v.estado==='sin') return '<p class="hint center">Este navegador no reconoce voz (prueba en Chrome o en Safari con Siri activado). Marca tú si la dijiste.</p>';
  return `<p class="hint center">No se pudo usar el micrófono (${esc(v.detalle||'error')}). Marca tú si la dijiste.</p>`;
}
function listaElementos(e){
  const res = L.checklist || [];
  return `<ul class="checklist">${e.elementos.map((x,k)=>`<li class="${res[k]?'si':'no'}">${res[k]?'✓':'✗'} ${esc(x.txt)}</li>`).join('')}</ul><p class="hint">Una forma de escribirlo: <span class="modelo">${esc(e.modelo)}</span></p>`;
}
function infoAudio(e){
  if(e.quien && e.oyo) return `<p class="hint">${esc(e.quien)} dijo: «${esc(e.oyo)}»${e.oyoEs?' · '+esc(e.oyoEs):''}</p>`;
  if(e.trad) return `<p class="hint">El audio decía: «${esc(e.say)}»</p><p class="hint">Traducción: ${esc(e.trad)}</p>`;
  if(e.dictado && e.es) return `<p class="hint">Significado: ${esc(e.es)}</p>`;
  if(e.oculto) return `<p class="hint">Era: «${esc(e.say)}»${e.es?' · '+esc(e.es):''}</p>`;
  const oyo = e.type==='tapwords' && e.lista===false ? e.say : e.type==='story' ? e.say : e.oyo || null;
  const sig = ['listen','tapwords','speak'].includes(e.type) && e.es ? e.es : null;
  return (oyo ? `<p class="hint">El audio decía: «${esc(oyo)}»</p>` : '') + (sig ? `<p class="hint">${e.type==='tapwords'&&e.lista!==false?'':'Significado: '}${esc(sig)}</p>` : '');
}
function vLesson(){
  const e = L.queue[0];
  const pct = Math.min(100, L.done/Math.max(1,L.total)*100);
  let right;
  if(L.kind==='jump'){ right = `<span class="budget ${L.errors>=L.allowed?'warn':''}">Errores ${L.errors}/${L.allowed}</span>`; }
  else if(L.test){ right = `<span class="budget">Nivel</span>`; }
  else right = `<span class="combo">${L.combo>=3?L.combo+' seguidas':''}</span>`;
  const qhtml = e.gl ? e.q.split(' ').map(w=>{ const k=w.replace(/[¿?¡!.,]/g,''); return e.gl[k]?`<button class="qgl" data-qgloss="${esc(k)}">${esc(w)}</button>`:esc(w); }).join(' ') : esc(e.q);
  let body = `<div class="tag ${e._again?'again':''}">${e._again?'↻ Error anterior':esc(e.tag||'')}</div>${(e.type==='learn'||!e.q)?'':`<h3>${qhtml}</h3>`}${L.qgloss&&e.gl&&e.gl[L.qgloss]?`<p class="glossline">${esc(L.qgloss)} → ${esc(e.gl[L.qgloss])}</p>`:''}`;
  const optList = ()=>`<div class="opts">${e.opts.map((o,i)=>`<button class="opt" data-opt="${i}" aria-pressed="${L.ans===i}">${esc(o)}</button>`).join('')}</div>`;
  // turno de escena: el interlocutor solo se oye; el texto sale al corregir
  const burbuja = (e.quien && e.type!=='speak') ? `<div class="speaker"><button class="play" data-say="${esc(e.oyo)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.oyo)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button><div class="bubble oir"><b>${esc(e.quien)}</b>${L.phase==='answer'?'Toca para volver a oír':esc(e.oyo)}</div></div>` : '';
  if(e.autoSay && !e._played && L.phase==='answer'){ e._played = true; setTimeout(()=>speak(e.autoSay), 250); }
  if(e.type==='learn'){
    body += `<div class="learncard"><button class="play" data-say="${esc(e.en)}" aria-label="Escuchar">${I.speaker}</button>
      <p class="big">${esc(e.en)}</p><p class="es">${esc(e.es)}</p><p class="tipnote">${esc(e.note)}</p>${e.uso?`<p class="tipnote"><b>Cuándo se usa:</b> ${esc(e.uso)}</p>`:''}</div>`;
  } else if(e.type==='scene'){
    body += `<div class="scenecard"><b>${esc(e.titulo)}</b><p>${esc(e.contexto)}</p><p class="hint">Vas a oír a la otra persona sin ver el texto. Puedes volver a oírla o ponerla más lenta.</p></div>`;
  } else if(e.type==='read'){
    const gl = e.glosas||{}, claves = Object.keys(gl);
    const texto = claves.length ? esc(e.texto).replace(new RegExp('\\b('+claves.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'), m=>`<button class="gl" data-gl="${esc(m)}">${m}</button>`) : esc(e.texto);
    const sel = L.gl ? (gl[L.gl] || gl[L.gl.toLowerCase()] || Object.entries(gl).find(([k])=>k.toLowerCase()===L.gl.toLowerCase())?.[1]) : null;
    body += `${e.titulo?`<p><b>${esc(e.titulo)}</b></p>`:''}<div class="speaker"><button class="play" data-say="${esc(e.texto)}" aria-label="Escuchar el texto">${I.speaker}</button><span class="hint">Léelo; si quieres, escúchalo.</span></div>
      <div class="readtext">${texto}</div>${sel?`<p class="glossline">${esc(L.gl)} → ${esc(sel)}</p>`:'<p class="hint">Toca una palabra subrayada para ver qué significa.</p>'}`;
  } else if(e.type==='free'){
    if(e.say) body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><span class="hint">Vuelve a oír el audio si lo necesitas.</span></div>`;
    if(e.texto) body += `<div class="readtext">${esc(e.texto)}</div>`;
    body += `<textarea class="wr" id="wr" placeholder="Escribe en inglés" aria-label="Tu respuesta en inglés" ${L.phase==='answer'?'':'readonly'}>${esc(L.ans||'')}</textarea>
      <p class="hint">Tiene que incluir: ${e.elementos.map(x=>esc(x.txt.toLowerCase())).join(' · ')}.</p>`;
  } else if(e.type==='gap'){
    const bank = e._b || (e._b = shuffle(e.bank).map(w=>({w})));
    const picked = L.ans || []; let hi = 0;
    const linea = e.en.split(' ').map(t=>{ const pelado = t.replace(/[.,!?]/g,''); if(hi<e.huecos.length && pelado===e.huecos[hi]){ const k = picked[hi]; hi++; return `<span class="blank ${(L.phase==='bad'||L.phase==='retry')?'bad':''}">${k!==undefined?esc(bank[k].w):'&nbsp;'}</span>${esc(t.slice(pelado.length))}`; } return esc(t); }).join(' ');
    body += burbuja + `<p class="gapline">${linea}</p><div class="bank">${bank.map((b,k)=>`<button class="word ${picked.includes(k)?'used':''}" data-gpick="${k}">${esc(b.w)}</button>`).join('')}</div>${picked.length?'<button class="mini" data-gunpick="1">Borrar la última</button>':''}`;
  } else if(e.type==='note'){
    body += `<div class="notecard">${esc(e.text)}</div>`;
  } else if(e.type==='tapwords'){
    const sel = L.ans || [];
    const audioTW = e.say || e.words.join(', ');
    body += `<div class="speaker"><button class="play" data-say="${esc(audioTW)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(audioTW)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>
      <div class="bank">${e.opciones.map((w,k)=>`<button class="word ${sel.includes(k)?'on':''}" data-tw="${k}" aria-pressed="${sel.includes(k)}">${esc(w)}</button>`).join('')}</div><p class="hint">${e.lista===false ? 'Toca solo las palabras que aparecen en la frase.' : 'Alguna de las palabras no suena.'}</p>`;
  } else if(e.type==='choose' && e.quien){
    body += burbuja + optList();
  } else if(e.type==='choose' && e.texto){
    body += `<details class="readtext" open><summary>El texto</summary>${esc(e.texto)}</details>` + optList();
  } else if(e.type==='choose'){
    if(e.say) body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>`;
    body += optList();
  } else if(e.type==='dialog'){
    body += e.lines.map(([w,t])=>`<div class="speaker"><button class="play slow" data-say="${esc(t)}" aria-label="Escuchar">${I.speaker}</button><div class="bubble"><b>${esc(w)}</b>${esc(t)}</div></div>`).join('') + optList();
  } else if(e.type==='story'){
    body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button>
      <button class="mini" data-transcript="1">${L.showText?'Ocultar texto':'Ver texto'}</button></div>
      ${L.showText?`<p class="transcript">${esc(e.say)}</p>`:'<p class="hint">Primero escucha sin leer. Si no lo entiendes, escúchalo despacio o mira el texto.</p>'}` + optList();
  } else if(e.type==='pair'){
    if(e._a===undefined) e._a = Math.random()<.5?0:1;
    body += `<div class="speaker"><button class="play" data-say="${esc(e.opts[e._a])}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.opts[e._a])}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>` + optList();
  } else if(e.type==='fill'){
    const opts = e._o || (e._o = shuffle(e.opts));
    const bad = L.phase==='retry'||L.phase==='bad';
    body += `<p class="sentence">${esc(e.pre)} <span class="blank ${bad?'bad':''}">${L.ans?esc(L.ans):'&nbsp;'}</span> ${esc(e.post)}</p>
      <div class="bank">${opts.map(o=>`<button class="word" data-fill="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if(e.type==='listen' || e.type==='build'){
    const bank = e._b || (e._b = shuffle(e.bank).map(w=>({w})));
    const picked = L.ans || [];
    if(e.type==='listen') body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>`;
    body += `<div class="answer-line">${picked.map((k,pos)=>`<button class="word ${L.wrongIdx.includes(pos)?'bad':''}" data-unpick="${k}">${esc(bank[k].w)}</button>`).join('')}</div>
      <div class="bank">${bank.map((b,k)=>`<button class="word ${picked.includes(k)?'used':''}" data-pick="${k}">${esc(b.w)}</button>`).join('')}</div>`;
  } else if(e.type==='match'){
    const st = e._m || (e._m = {left:shuffle(e.pairs.map(p=>p[0])), right:shuffle(e.pairs.map(p=>p[1])), gone:[], sel:null, wrong:null});
    const cell = (side,w)=>{ const id=side+':'+w; const gone=st.gone.includes(id);
      const altavoz = e.oido && side==='L' && !gone;
      return `<button class="pair ${gone?'gone':''} ${st.sel===id?'sel':''} ${st.wrong&&st.wrong.includes(id)?'wrong':''} ${altavoz?'oir':''}" data-pair="${esc(id)}" ${gone?'disabled':''} ${altavoz?'aria-label="Escuchar palabra"':''}>${altavoz?I.speaker:esc(w)}</button>`; };
    body += `<div class="pairs">${st.left.map((w,i)=>cell('L',w)+cell('R',st.right[i])).join('')}</div>`;
  } else if(e.type==='write'){
    if(e.quien) body += burbuja;
    else if(e.say) body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button><button class="play slow" data-say="${esc(e.say)}" data-slow="1" aria-label="Escuchar despacio">${I.turtle}</button></div>`;
    body += `<textarea class="wr" id="wr" placeholder="Escribe en inglés" aria-label="Tu respuesta en inglés" ${L.phase==='answer'?'':'readonly'}>${esc(L.ans||'')}</textarea><p class="hint">Enter para comprobar.</p>`;
  } else if(e.type==='speak'){
    if(e.prev) body += `<div class="speaker"><button class="play" data-say="${esc(e.prev.en)}" aria-label="Escuchar">${I.speaker}</button><div class="bubble oir"><b>${esc(e.prev.quien)}</b>${L.voz&&L.voz.estado==='oido'?esc(e.prev.en):'Toca para volver a oír'}</div></div><p class="hint">Tu respuesta:</p>`;
    const verTexto = !e.oculto || (L.voz && L.voz.estado==='oido');
    body += `<div class="speaker"><button class="play" data-say="${esc(e.say)}" aria-label="Escuchar">${I.speaker}</button>${verTexto?`<p class="sentence">${esc(e.say)}</p>`:'<p class="hint">Escucha y repítela sin verla.</p>'}</div>
      ${e.es?`<p class="hint">${esc(e.es)}</p>`:''}<button class="mic ${L.voz?.estado==='escuchando'?'on':''}" data-mic="1" aria-label="Hablar">${I.mic}</button>
      ${vozTexto(e)}`;
  }
  let foot;
  if(L.phase==='answer'){
    if(e.type==='learn'||e.type==='note') foot = `<div class="lz-foot"><button class="cta" data-learned="1">Continuar</button></div>`;
    else if(e.type==='speak'){ const v=L.voz, manual = v && ['denegado','sin','error'].includes(v.estado);
      foot = v && v.estado==='oido' && v.ok ? `<div class="lz-foot ok"><div class="fb"><h4>¡Se te entiende!</h4>${infoAudio(e)}</div><button class="cta ok" data-said="1">Continuar</button></div>`
        : v && v.estado==='oido' && v.intentos>=2 ? `<div class="lz-foot retry"><div class="fb"><h4>Sigue practicándola</h4><p>No cuenta como error: la frase volverá en tu repaso.</p></div><button class="cta warm" data-skipspeak="1">Continuar</button></div>`
        : manual ? `<div class="lz-foot"><button class="cta" data-said="1">Lo dije</button><button class="cta ghost" data-skipspeak="1">No puedo hablar ahora</button></div>`
        : `<div class="lz-foot"><button class="cta ghost" data-skipspeak="1">No puedo hablar ahora</button></div>`; }
    else if(e.type==='match') foot = `<div class="lz-foot"><p class="hint center">Une todos los pares para seguir.</p></div>`;
    else if(e.type==='scene' || e.type==='read') foot = `<div class="lz-foot"><button class="cta" data-learned="1">${e.type==='scene'?'Empezar la escena':'Ya lo leí'}</button></div>`;
    else { const ready = (e.type==='write'||e.type==='free') ? !!(L.ans&&L.ans.trim()) : Array.isArray(L.ans) ? L.ans.length>0 : L.ans!==null;
      foot = `<div class="lz-foot"><button class="cta" data-check="1" ${ready?'':'disabled'}>Comprobar</button></div>`; }
  } else if(L.phase==='retry'){
    foot = `<div class="lz-foot retry"><div class="fb"><h4>Casi</h4><p>${esc(e.hint||'Revisa la parte marcada.')}</p></div>
      <button class="cta warm" data-retry="1">Intentar otra vez</button></div>`;
  } else {
    const ok = L.phase==='ok';
    const whyBtn = e.why && !L.test ? (L.showWhy ? `<p class="hint">${esc(e.why)}</p>` : `<button class="why" data-why="1">¿Por qué?</button>`) : '';
    const fbx = L.test ? '' : (L.fbk ? `<p class="hint">${esc(L.fbk)}</p>` : `<div class="fbx"><button data-fbk="easy">Demasiado fácil</button><button data-fbk="hard">Demasiado difícil</button><button data-fbk="report">Reportar</button></div>`);
    foot = `<div class="lz-foot ${ok?'ok':'bad'}"><div class="fb"><h4>${ok?(L.note?L.note[0]:pickPraise()):'Respuesta correcta:'}</h4>
      ${ok?(L.note?`<p>${esc(L.note[1])}</p>`:''):`<p>${esc(solution(e))}</p>`}${e.type==='free'?listaElementos(e):''}${infoAudio(e)}${whyBtn}${!ok&&!L.test?'<p class="hint">Volverá dentro de 3 ejercicios y otra vez al final de la lección.</p>':''}${fbx}</div>
      <button class="cta ${ok?'ok':'bad'}" data-next="1">Continuar</button></div>`;
  }
  return `<div class="lz"><div class="lz-top"><button class="x" data-quit="1" aria-label="Salir">${I.close}</button>
    <div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i class="${L.combo>=8?'hot2':L.combo>=5?'hot':''}" style="width:${pct}%"></i></div>${right}</div>
    <div class="lz-main">${body}</div>${foot}</div>`;
}
const PRAISE=['¡Bien!','¡Correcto!','¡Eso es!'];
function pickPraise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}
function solution(e){
  if(e.type==='pair') return e.opts[e._a];
  if(['choose','dialog','story'].includes(e.type)) return e.opts[e.a];
  if(e.type==='fill') return (e.a==='(nada)' ? `${e.pre} ${e.post}` : `${e.pre} ${e.a} ${e.post}`).trim();
  if(e.type==='tapwords') return e.words.join(', ');
  if(e.type==='write') return e.answers[0];
  if(e.traducir) return e.frase || e.a;
  if(e.type==='free') return 'Revisa lo que faltó';
  if(e.type==='gap') return e.en;
  return e.a;
}
function evaluate(){
  const e=L.queue[0];
  if(e.type==='pair') return record(L.ans===e._a, e);
  if(['choose','dialog','story'].includes(e.type)) return record(L.ans===e.a, e);
  if(e.type==='tapwords'){ const got=new Set(L.ans.map(k=>e.opciones[k])); return record(got.size===e.words.length && e.words.every(w=>got.has(w)), e); }
  if(e.type==='fill'){
    if(L.ans===e.a) return record(true,e);
    if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  if(e.type==='gap'){
    const got = (L.ans||[]).map(k=>e._b[k].w);
    if(got.length===e.huecos.length && got.every((w,i)=>w===e.huecos[i])) return record(true,e);
    if(!L.test && !e._tried){ e._tried=true; e.hint='Revisa el orden y la forma de las palabras.'; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  if(e.type==='free'){
    const txt = ' '+(L.ans||'').toLowerCase().replace(/[\u2018\u2019]/g,"'")+' ';
    const tiene = c => txt.includes(c.toLowerCase()); // como en comprobar-extras: la respuesta contiene la clave (live → lives)
    L.checklist = e.elementos.map(x=>x.claves.some(tiene));
    if(L.checklist.every(Boolean)) return record(true,e);
    if(!L.test && !e._tried){ e._tried=true; e.hint='Te falta: '+e.elementos.filter((x,k)=>!L.checklist[k]).map(x=>x.txt.toLowerCase()).join(', ')+'.'; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  if(e.type==='write'){
    const res = gradeWrite(L.ans||'', e.answers);
    if(res.ok){ if(res.typo) L.note=['Tienes un pequeño error:', res.target]; else if(res.alt) L.note=['Otra solución correcta:', e.answers[0]]; return record(true,e); }
    if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
    return record(false,e);
  }
  // listen / build (en "Escucha y traduce" las fichas son español: se comparan tal cual, con tildes)
  const got = L.ans.map(k=>e._b[k].w), want = e.a.split(' ');
  const nn = e.traducir ? (t=>t.toLowerCase().replace(/\s+/g,' ').trim()) : norm;
  if(nn(got.join(' '))===nn(e.a)) return record(true,e);
  if((e.alts||[]).some(a=>nn(got.join(' '))===nn(a))){ L.note=['Otra solución correcta:', e.a]; return record(true,e); }
  L.wrongIdx = got.map((w,i)=>nn(w)===nn(want[i]||'')?-1:i).filter(i=>i>=0);
  if(!L.test && !e._tried){ e._tried=true; L.phase='retry'; L.firstTry=false; tono('mal'); render(); return; }
  record(false,e);
}
/* ---------- sonidos de respuesta ---------- */
let sonidoMem = true, actx = null;
const sonidoOn = () => { try{ const v = localStorage.getItem('sendero-sonido'); return v===null ? sonidoMem : v!=='0'; }catch(x){ return sonidoMem; } };
const SONIDOS = {
  ok:  [[880,0,.16,'sine',.2],[1760,0,.12,'sine',.05],[1318.5,.08,.4,'sine',.2],[2637,.08,.25,'sine',.04]],
  mal: [[220,0,.18,'triangle',.22],[164.8,.13,.32,'triangle',.2]],
  fin: [[523.3,0,.14,'sine',.18],[659.3,.12,.14,'sine',.18],[784,.24,.14,'sine',.18],[1046.5,.36,.5,'sine',.2]],
};
function tono(nombre){
  if(!sonidoOn()) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t0 = actx.currentTime + 0.01;
    for(const [fr, ini, dur, tipo, vol] of SONIDOS[nombre]){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = tipo; o.frequency.value = fr;
      g.gain.setValueAtTime(0.0001, t0+ini); g.gain.exponentialRampToValueAtTime(vol, t0+ini+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0+ini+dur);
      o.connect(g); g.connect(actx.destination); o.start(t0+ini); o.stop(t0+ini+dur+0.05);
    }
  }catch(x){}
}

/* ---------- voz: reconocimiento del navegador (Chrome, Safari con Siri) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const DEC = {20:'twenty',30:'thirty',40:'forty',50:'fifty',60:'sixty',70:'seventy',80:'eighty',90:'ninety',100:'one hundred'};
function enLetras(n){ n=+n; if(n<20) return NUM[n]; if(DEC[n]) return DEC[n]; if(n<100) return DEC[n-n%10]+' '+NUM[n%10]; return String(n); }
function paraVoz(t){ return t.replace(/(\d+):00/g,"$1 o'clock").replace(/(\d+):30/g,'half past $1').replace(/\$(\d+)/g,'$1 dollars').replace(/\b\d{1,3}\b/g, d=>enLetras(d)).replace(/-/g,' '); }
function puntuarVoz(oido, objetivo){
  const a = canon(paraVoz(objetivo)), b = canon(paraVoz(oido)), usado = new Set();
  const marcas = a.map(w=>{ const k=b.findIndex((x,i)=>!usado.has(i) && (x===w || (w.length>3 && lev(x,w)<=1))); if(k>=0){ usado.add(k); return true; } return false; });
  return { nota: marcas.filter(Boolean).length / Math.max(1,a.length), marcas, palabras: objetivo.replace(/[.?!,]/g,'').split(/\s+/) };
}
let reco = null;
function escuchar(e){
  if(!SR){ L.voz = {estado:'sin'}; render(); return; }
  try{ if(reco) reco.abort(); }catch(x){}
  reco = new SR(); reco.lang = 'en-US'; reco.interimResults = false; reco.maxAlternatives = 5;
  L.voz = {estado:'escuchando', intentos:(L.voz?.intentos||0)}; render();
  reco.onresult = ev => {
    const alts = [...ev.results[0]].map(x=>x.transcript);
    let mejor = null; for(const t of alts){ const p = puntuarVoz(t, e.say); if(!mejor || p.nota > mejor.p.nota) mejor = {t, p}; }
    const intentos = (L.voz?.intentos||0) + 1;
    L.voz = {estado:'oido', texto:mejor.t, p:mejor.p, ok:mejor.p.nota>=0.8, intentos}; tono(mejor.p.nota>=0.8 ? 'ok' : 'mal'); render();
  };
  reco.onerror = ev => { L.voz = {estado: ev.error==='not-allowed'||ev.error==='service-not-allowed' ? 'denegado' : ev.error==='no-speech' ? 'silencio' : 'error', detalle:ev.error, intentos:L.voz?.intentos||0}; render(); };
  reco.onend = () => { if(L && L.voz && L.voz.estado==='escuchando'){ L.voz = {estado:'silencio', intentos:L.voz.intentos||0}; render(); } };
  try{ reco.start(); }catch(x){ L.voz = {estado:'error', detalle:String(x)}; render(); }
}

/* Corrección de respuestas escritas: normalizar, aceptar variantes y erratas pequeñas */
const CONTR = {"i'm":"i am","im":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","don't":"do not","doesn't":"does not","isn't":"is not","aren't":"are not","can't":"cannot"};
function canon(s){ return s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[.,!?¿¡]/g,' ').split(/\s+/).filter(Boolean).map(w=>CONTR[w]||w).join(' ').split(' ').filter(Boolean); }
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); } return d[a.length][b.length]; }
/* palabras reales que no se aceptan como errata de otra (en la app real: el léxico completo) */
const LEXICON = new Set(['than','then','is','its','it','in','on','am','an','a','are','from','form','for','of','off']);
function gradeWrite(input, answers){
  const got = canon(input);
  for(let i=0;i<answers.length;i++){ if(canon(answers[i]).join(' ')===got.join(' ')) return {ok:true, alt:i>0}; }
  for(const ans of answers){ const want=canon(ans); if(want.length!==got.length) continue;
    let typo=false, okAll=true;
    for(let k=0;k<want.length;k++){ if(want[k]===got[k]) continue;
      const tol = want[k].length<=3?0:want[k].length<=7?1:2;
      if(LEXICON.has(got[k]) || lev(want[k],got[k])>tol){ okAll=false; break; } typo=true; }
    if(okAll) return {ok:true, typo, target:ans}; }
  return {ok:false};
}
function record(ok, e){
  L.tries++;
  (e.items||[]).forEach(id=>memoria(id, ok)); guardarMem();
  const dz = destrezaDe(e); S.destrezas[dz] = (S.destrezas[dz]||0) + 1;
  if(!ok && !L.errEx.some(x=>x.q===e.q && x.type===e.type)) L.errEx.push(limpio(e));
  L.log.push({q:e.q, ok, a:solution(e)});
  if(ok){ L.hits++; L.combo++; L.phase='ok'; tono('ok'); }
  else {
    L.combo=0; L.phase='bad'; L.firstTry=false; L.errors++; tono('mal');
    L.weak[e.tag]=(L.weak[e.tag]||0)+1;
    if(!L.mistakes.some(m=>m.q===e.q)) L.mistakes.push({q:e.q, correct:solution(e)});
  }
  render();
}
function next(){
  const e=L.queue.shift();
  const wasOk = L.phase==='ok';
  if(wasOk || L.test) L.done++;
  if(!wasOk && !L.test){ const c={...e}; delete c._b; delete c._o; delete c._m; delete c._tried; delete c._a;
    const first = !e._again; c._again=true; L.queue.splice(Math.min(3,L.queue.length),0,c); if(first) L.queue.push({...c}); }
  L.ans=null; L.checklist=null; L.gl=null; L.phase='answer'; L.micTried=false; L.showWhy=false; L.showText=false; L.wrongIdx=[]; L.note=null; L.fbk=null; L.qgloss=null;
  if(L.kind==='jump' && L.errors>L.allowed){ finish(false); return; }
  if(!L.queue.length){ finish(true); return; }
  render();
}
function advance(){
  const t = NODE_TYPES[S.node];
  S.session++;
  if(S.session>=SESSIONS[t]){ S.node++; S.session=0; if(S.node>=NODE_TYPES.length){ S.unit=Math.min(9,S.unit+1); S.node=0; } }
}
function finish(passed){
  const secs = Math.round((Date.now()-L.t0)/1000);
  actividad(Math.max(1, Math.round(secs/60)));
  if(L.kind==='biblioteca' && L.bibId && !S.leidos.includes(L.bibId)) S.leidos.push(L.bibId);
  if(L.errEx.length) guardarErrores(L.errEx);
  const time = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  const acc = Math.round(L.hits/Math.max(1,L.tries)*100);
  if(L.kind==='placement'){
    let to = CURSO ? 9 : Math.max(1, Math.min(9, 1 + Math.round(acc/100*4)));
    if(CURSO) for(let n=1;n<=9;n++) if(L.weak['Bloque '+n]){ to=n; break; }
    for(let n=1;n<to;n++) if(!S.skipped.includes(n)) S.skipped.push(n);
    S.unit=Math.max(S.unit,to); S.node=0; S.session=0;
    S.lastResult={kind:'placement',to:S.unit};
  } else if(L.kind==='jump'){
    if(!passed || acc<80){
      const weak = Object.entries(L.weak).sort((a,b)=>b[1]-a[1])[0];
      const clave = (L.blockTest?'b':'s')+S.jumpTo; S.fallosSalto[clave] = (S.fallosSalto[clave]||0) + 1;
      S.lastResult={kind:'jumpfail',weak:(weak?weak[0]:'Bloque '+S.unit).replace('Bloque','bloque'), fallos:S.fallosSalto[clave], to:S.jumpTo, blockTest:L.blockTest};
    } else {
      const to = Math.min(S.jumpTo,9);
      if(L.blockTest && S.jumpTo>9){ S.node=NODE_TYPES.length; S.session=0; S.xp+=15; S.today+=15; S.lastResult={kind:'section',xp:15,acc,time,to:10}; }
      else if(L.blockTest){ S.unit=to; S.node=0; S.session=0; S.xp+=15; S.today+=15; S.lastResult={kind:'block',xp:15,acc,time,to}; }
      else { for(let n=S.unit;n<to;n++) if(!S.skipped.includes(n)) S.skipped.push(n);
        S.unit=to; S.node=0; S.session=0; S.xp+=20; S.today+=20; S.lastResult={kind:'jump',xp:20,acc,time,to}; }
    }
  } else {
    const perfect = L.firstTry && L.kind==='lesson' && !L.replay;
    const xp = L.replay ? 5 : L.kind==='review' ? 8 : 10 + (perfect?5:0);
    S.xp+=xp; S.today+=xp;
    if(!L.replay && !['review','srs','errores','sounds','biblioteca'].includes(L.kind)) advance();
    if(L.kind==='review' && !L.replay && NODE_TYPES[S.node]==='review' && L.fromNode) advance();
    S.lastResult={kind:L.replay?'replay':L.kind,xp,acc,time,perfect,newItems:L.replay?0:L.newItems,mistakes:L.mistakes,log:L.log,errEx:L.errEx}; S.showLog=false;
  }
  tono(S.lastResult && S.lastResult.kind==='jumpfail' ? 'mal' : 'fin');
  S.screen='result'; L=null; render();
}

  if(d.plan){ S.plan=d.plan; if(S.screen==='welcome') S.welcome=2; render(); return; }
  if(d.transfer){ S.transfer = S.transfer===d.transfer ? null : d.transfer; render(); if(d.transfer==='export'){ try{ navigator.clipboard.writeText(exportar()); }catch(x){} } return; }
  if(d.doimport){ const t = document.getElementById('tx'); if(t && importar(t.value)){ S.transfer=null; render(); } else alert('No pude leer ese progreso. Cópialo entero e inténtalo otra vez.'); return; }
  if(d.errores){ const lista = S.screen==='result' && S.lastResult && S.lastResult.errEx ? S.lastResult.errEx : leerErrores(); if(lista.length) startLesson('errores',{lista}); return; }
  if(d.retryjump){ const r0 = S.lastResult||{}; S.jumpTo = r0.to||S.jumpTo; startLesson('jump',{blockTest:!!r0.blockTest}); return; }
  if(d.sonido){ sonidoMem = !sonidoOn(); try{ localStorage.setItem('sendero-sonido', sonidoMem?'1':'0'); }catch(x){} if(sonidoMem) tono('ok'); render(); return; }
  if(d.reset){ if(!confirm('¿Borrar todo tu progreso y tu memoria de palabras?')) return; Object.assign(S,{unit:1,node:0,session:0,skipped:[],xp:0,today:0,streak:0,min:0,minDia:null,ultimoDia:null,fallosSalto:{},destrezas:{},screen:'path'}); MEM={}; guardarMem(); try{ localStorage.removeItem('sendero-errores'); }catch(x){} render(); return; }
  if(d.placement){ S.jumpMode='placement'; S.screen='jump'; render(); return; }
  if(d.jump){ S.jumpTo=+d.jump; S.jumpMode='skip'; S.screen='jump'; render(); return; }
  if(d.start){ startLesson(d.start); return; }
  if(d.bib){ startLesson('biblioteca',{texto:d.bib}); if(L) L.bibId=d.bib; return; }
  if(d.read){ S.reading=true; S.gloss=null; render(); return; }
  if(d.closeread){ S.reading=false; render(); return; }
  if(d.gloss){ S.gloss=d.gloss.split('|'); speak(S.gloss[0]); render(); return; }
  if(d.guide){
    const u = UNITS[+d.guide-1], head = b.closest('.unit-head');
    if(head.nextElementSibling && head.nextElementSibling.classList.contains('guide')){ head.nextElementSibling.remove(); return; }
    const g = document.createElement('div'); g.className='guide';
    g.innerHTML = `<b>${esc(u.goal)}.</b> ${u.guide}`; head.after(g); return;
  }
  if(d.node){
    const [un,ni] = d.node.split(':').map(Number);
    const st = unitState(un);
    const done = st==='done'||st==='skipped'||(st==='current'&&ni<S.node);
    const cur = st==='current'&&ni===S.node;
    if(!done && !cur){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    const t = NODE_TYPES[ni];
    if(t==='test' && cur){ S.jumpTo=Math.min(un+1,10); startLesson('jump',{blockTest:true}); return; }
    if(t==='test') { startLesson('review',{replay:true, unit:un}); return; }
    startLesson(t, {replay:done, unit:un, node:ni});
    if(t==='review' && cur) L.fromNode = true;
    return;
  }
  if(d.showlog){ S.showLog=true; render(); return; }
  if(!L) return;
  const e = L.queue[0];
  if(d.qgloss){ L.qgloss=d.qgloss; render(); return; }
  if(d.gl){ L.gl=d.gl; speak(d.gl); render(); return; }
  if(d.fbk){ L.fbk = d.fbk==='report' ? 'Gracias. Revisaremos este ejercicio; si tu respuesta debería valer, la añadiremos.' : 'Gracias. Lo usamos para ajustar la dificultad de tus próximas lecciones.'; render(); return; }
  if(d.quit){ try{ reco && reco.abort(); }catch(x){} L=null; S.screen='path'; render(); return; }
  if(d.say) return;
  if(d.transcript){ L.showText=!L.showText; render(); return; }
  if(d.why){ L.showWhy=true; render(); return; }
  if(d.next){ next(); return; }
  if(d.retry){ L.phase='answer'; render(); return; }
  if(L.phase!=='answer') return;
  if(d.learned){ if(e.type==='learn') (e.items||[]).forEach(id=>memoria(id,true)); guardarMem(); L.queue.shift(); L.done++; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.opt!==undefined){ L.ans=+d.opt; render(); return; }
  if(d.fill){ L.ans=d.fill; render(); return; }
  if(d.tw!==undefined){ const k=+d.tw, sel=L.ans||[]; L.ans = sel.includes(k) ? sel.filter(x=>x!==k) : sel.concat(k); speak(e.opciones[k]); render(); return; }
  if(d.pick!==undefined){ L.ans=(L.ans||[]).concat(+d.pick); L.wrongIdx=[]; speak(e._b[+d.pick].w); render(); return; }
  if(d.unpick!==undefined){ L.ans=L.ans.filter(k=>k!==+d.unpick); L.wrongIdx=[]; render(); return; }
  if(d.check){ evaluate(); return; }
  if(d.gpick!==undefined){ const k=+d.gpick; if((L.ans||[]).includes(k) || (L.ans||[]).length>=e.huecos.length) return; L.ans=(L.ans||[]).concat(k); speak(e._b[k].w); render(); return; }
  if(d.gunpick){ L.ans=(L.ans||[]).slice(0,-1); render(); return; }
  if(d.mic){ L.micTried=true; escuchar(e); return; }
  if(d.said){ (e.items||[]).forEach(id=>memoria(id,true)); guardarMem(); S.destrezas.Hablar=(S.destrezas.Hablar||0)+1; L.queue.shift(); L.done++; L.tries++; L.hits++; L.voz=null; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.skipspeak){ try{ reco && reco.abort(); }catch(x){} L.queue.shift(); L.voz=null; if(!L.queue.length){finish(true);return;} render(); return; }
  if(d.pair){
    const st=e._m, id=d.pair;
    if(!st.sel || st.sel[0]===id[0]){ st.sel=id; st.wrong=null; if(id[0]==='L') speak(id.slice(2)); render(); return; }
    const Lk = st.sel[0]==='L'?st.sel:id, Rk = st.sel[0]==='R'?st.sel:id;
    if(e.pairs.some(p=>'L:'+p[0]===Lk && 'R:'+p[1]===Rk)){ st.gone.push(Lk,Rk); st.sel=null; st.wrong=null; }
    else { st.wrong=[Lk,Rk]; st.sel=null; L.combo=0; L.firstTry=false; }
    if(st.gone.length===e.pairs.length*2){ L.tries++; L.hits++; L.combo++; L.phase='ok'; tono('ok'); (e.items||[]).forEach(id=>memoria(id,true)); guardarMem(); const dz=e.oido?'Escuchar':'Leer'; S.destrezas[dz]=(S.destrezas[dz]||0)+1; }
    render(); return;
  }
});

document.addEventListener('input', ev=>{
  if(ev.target.id==='wr' && L){ L.ans=ev.target.value; const b=document.querySelector('[data-check]'); if(b) b.disabled=!L.ans.trim(); }
});
/* Atajos: 1–9 eligen opción, Enter comprueba o continúa */
document.addEventListener('keydown', ev=>{
  if(!L || document.getElementById('panel-mock').hidden) return;
  const inText = ev.target.id==='wr' || ev.target.id==='tx';
  if(inText && L && L.queue[0] && L.queue[0].type==='free' && ev.key==='Enter' && !ev.ctrlKey) return; // en textos largos, Enter es salto de línea
  if(ev.key==='Enter' && !ev.shiftKey){
    const b = document.querySelector('[data-check]:not([disabled]), [data-next], [data-retry], [data-learned]');
    if(b){ ev.preventDefault(); b.click(); const w=document.getElementById('wr'); if(w && !w.readOnly) w.focus(); }
    return;
  }
  if(!inText && /^[1-9]$/.test(ev.key)){ const o=document.querySelector('[data-opt="'+(+ev.key-1)+'"]'); if(o){ ev.preventDefault(); o.click(); } }
});
try{ const t=localStorage.getItem('sendero-tab'); if(t){ const btn=document.querySelector(`.tabs [data-tab="${t}"]`); if(btn) btn.click(); } }catch(e){}
render();
})();
</script>

.screens,.notes,.ph-status{display:none!important}
:root{padding:0!important}
.phone{max-width:520px;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:560px){.phone{border-inline:1px solid var(--line)}}
</style>
