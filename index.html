<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sendero: aprende inglés desde el español. Versión de prueba con la Sección 1, 108 lecciones.">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sendero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: documento de producto con cinco pestañas; la maqueta es un teléfono interactivo con índice de pantallas a la izquierda y notas de diseño a la derecha */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#14213D; --muted:#56627C; --line:#D9DEEA;
  --brand:#2747D8; --brand-ink:#FFFFFF; --brand-soft:#E3E8FC;
  --accent:#F2A516; --accent-ink:#14213D; --accent-soft:#FDF0D5;
  --ok:#17875B; --ok-soft:#DCF3E8; --bad:#C8392F; --bad-soft:#FBE2DF;
  --locked:#C6CCDA; --frame:#14213D; --flame:#E8641B;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1324; --surface:#161F37; --sunk:#1D2843; --ink:#E7EBF6; --muted:#9BA6C2; --line:#2A3556;
  --brand:#7089FF; --brand-ink:#0D1324; --brand-soft:#22305E;
  --accent:#F5B941; --accent-ink:#14213D; --accent-soft:#3A3018;
  --ok:#3FCB8E; --ok-soft:#123A2A; --bad:#FF7066; --bad-soft:#3E1C1B;
  --locked:#38425F; --frame:#05080F; --flame:#FF8A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1324; --surface:#161F37; --sunk:#1D2843; --ink:#E7EBF6; --muted:#9BA6C2; --line:#2A3556;
  --brand:#7089FF; --brand-ink:#0D1324; --brand-soft:#22305E;
  --accent:#F5B941; --accent-ink:#14213D; --accent-soft:#3A3018;
  --ok:#3FCB8E; --ok-soft:#123A2A; --bad:#FF7066; --bad-soft:#3E1C1B;
  --locked:#38425F; --frame:#05080F; --flame:#FF8A47; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--brand)}

.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:22px}
.mark{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.mark h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.mark small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note-strip{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:22px;font-size:14px}

/* maqueta */
.mock{display:grid;grid-template-columns:200px minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
.screens{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}
.screens h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 8px;font-family:var(--font-body)}
.screens button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer}
.screens button span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;width:18px;flex:none}
.screens button[aria-current="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.notes{display:flex;flex-direction:column;gap:18px;min-width:0}
.notes h2{font-size:24px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.notes dl{margin:0;display:grid;gap:14px}
.notes dt{font-weight:700;font-size:13px;color:var(--muted)}
.notes dd{margin:2px 0 0}
.open{border-left:3px solid var(--accent);padding-left:12px}

.phone{width:100%;max-width:380px;height:760px;border:10px solid var(--frame);border-radius:46px;background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;margin-inline:auto;box-shadow:0 18px 40px rgba(20,33,61,.18)}
.ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;flex:none}
.ph-body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.ph-nav{display:flex;border-top:1px solid var(--line);flex:none}
.ph-nav button{flex:1;border:0;background:transparent;padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.ph-nav button svg{width:22px;height:22px}
.ph-nav button[aria-current="true"]{color:var(--brand)}

.ico{width:18px;height:18px;flex:none}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.hud .chip{display:flex;gap:5px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.lvl{background:var(--brand-soft);color:var(--brand);padding:3px 9px;border-radius:999px;font-size:13px}
.c-flame{color:var(--flame)}.c-bolt{color:var(--accent)}

/* ruta */
.sec{margin:14px 14px 4px;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.sec .eyebrow{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.04em}
.sec h3{font-size:20px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.unit{margin:18px 14px 0}
.unit-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.unit-head.current{background:var(--accent-soft)}
.unit-head h4{font-size:15px}
.unit-head p{font-size:12px;color:var(--muted)}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mini.jump{border-color:var(--brand);color:var(--brand)}
.guide{margin-top:8px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0 6px}
.node{width:64px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;position:relative;background:var(--locked);color:var(--surface);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.node svg{width:26px;height:26px;position:relative}
.node.done{background:var(--brand);color:var(--brand-ink)}
.node.cur{background:var(--accent);color:var(--accent-ink)}
.node.skip{background:var(--brand-soft);color:var(--brand)}
.ring{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--accent) var(--p), var(--line) 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px))}
.tip{position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:4px 10px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
.tip.l{left:auto;right:calc(100% + 16px)}
.next-lvl{margin:22px 14px 22px;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.next-lvl h3{font-size:18px}
.next-lvl p{font-size:13px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* lección */
.lz{display:flex;flex-direction:column;flex:1;min-height:100%}
.lz-top{display:flex;gap:12px;align-items:center;padding:12px 16px}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;display:grid}
.prog{flex:1;height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s,background .3s}
.prog i.hot{background:var(--accent)}
.prog i.hot2{background:var(--flame)}
.qgl{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:2px dotted var(--muted)}
.glossline{font-size:14px;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;align-self:flex-start}
.wr{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical}
.fbx{display:flex;flex-wrap:wrap;gap:4px 14px}
.fbx button{border:0;background:transparent;padding:0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.again{color:var(--flame)}
.log{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;text-align:left}
.log div{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
.log div b{display:block;font-size:11px}
.log .y b{color:var(--ok)} .log .n b{color:var(--bad)}
.lz-main{flex:1;padding:6px 18px 18px;display:flex;flex-direction:column;gap:16px}
.lz-main h3{font-size:20px}
.tag{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
.combo{font-size:12px;font-weight:700;color:var(--accent);min-width:42px;text-align:right}
.budget{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.budget.warn{color:var(--bad)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.speaker{display:flex;gap:12px;align-items:center}
.play{width:56px;height:56px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.play svg{width:26px;height:26px}
.play.slow{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.answer-line{min-height:52px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:15px}
.word.used{visibility:hidden}
.word.bad{border-color:var(--bad);background:var(--bad-soft)}
.word.on{border-color:var(--brand);background:var(--brand-soft)}
.notecard{border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:16px;font-size:16px;line-height:1.55}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;font-size:15px}
.pair.sel{border-color:var(--brand);background:var(--brand-soft)}
.pair.gone{opacity:.25;cursor:default}
.pair.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pair.oir{color:var(--brand);display:flex;justify-content:center;align-items:center}
.pair.oir svg{width:24px;height:24px}
.sentence{font-size:20px;font-family:var(--font-display);font-weight:700}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.bubble{background:var(--sunk);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:85%}
.bubble b{display:block;font-size:12px;color:var(--muted)}
.learncard{border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;justify-items:start}
.learncard .big{font-family:var(--font-display);font-size:26px;font-weight:700}
.learncard .es{font-size:17px;color:var(--muted)}
.learncard .tipnote{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;justify-self:stretch}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:8px auto;cursor:pointer}
.mic svg{width:40px;height:40px}
.mic.on{background:var(--bad);animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.oido{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.oido b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.oido .w-ok{color:var(--ok);font-weight:700}.oido .w-no{color:var(--bad);text-decoration:underline}
.hint{font-size:13px;color:var(--muted)}
.transcript{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.lz-foot{padding:14px 16px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.lz-foot.ok{background:var(--ok-soft);border-top-color:transparent}
.lz-foot.bad{background:var(--bad-soft);border-top-color:transparent}
.lz-foot.retry{background:var(--accent-soft);border-top-color:transparent}
.fb{display:grid;gap:4px}
.fb h4{font-size:18px}
.lz-foot.ok .fb h4{color:var(--ok)}
.lz-foot.bad .fb h4{color:var(--bad)}
.fb p{font-size:14px}
.why{justify-self:start;border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.cta{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 rgba(0,0,0,.2);width:100%}
.cta:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.cta.ok{background:var(--ok);color:var(--surface)}
.cta.bad{background:var(--bad);color:var(--surface)}
.cta.warm{background:var(--accent);color:var(--accent-ink)}
.cta.ghost{background:transparent;color:var(--brand);box-shadow:none;border:2px solid var(--line)}

/* pantallas simples */
.pad{padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.hero-ph{display:grid;gap:10px;padding-top:18px}
.hero-ph h2{font-size:26px}
.choice{text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;display:grid;gap:2px}
.choice b{font-size:16px}
.choice span{font-size:13px;color:var(--muted)}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{background:var(--brand-soft);border-radius:16px;padding:14px;display:grid;gap:8px}
.scene .en{font-family:var(--font-display);font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big-ok{width:96px;height:96px;border-radius:28px;background:var(--accent);display:grid;place-items:center;margin:14px auto 0;color:var(--accent-ink)}
.big-ok svg{width:52px;height:52px}
.center{text-align:center}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rules li svg{margin-top:2px;color:var(--brand)}
.mistakes{display:grid;gap:6px;text-align:left}
.mistakes div{border-left:3px solid var(--bad);padding:4px 10px;font-size:14px;background:var(--surface)}
.mistakes div span{display:block;font-size:12px;color:var(--muted)}
.card{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.card .ic svg{width:22px;height:22px}
.card b{display:block}
.card span{font-size:13px;color:var(--muted)}
.card .count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.card.locked{opacity:.55;cursor:default}
.strength{display:grid;gap:8px}
.strength div{display:grid;grid-template-columns:minmax(0,1fr) 70px 72px;gap:8px;align-items:center;font-size:14px}
.strength em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:8px;border-radius:3px;background:var(--sunk)}
.meter i.on{background:var(--ok)}
.meter.weak i.on{background:var(--bad)}
.forecast{background:var(--ok-soft);border-radius:14px;padding:10px 12px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--sunk)}
.week i.on{background:var(--flame)}
.week i.free{background:transparent;border:2px dashed var(--flame)}
.skills{display:grid;gap:8px}
.skills div{display:grid;grid-template-columns:80px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.skills .track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.skills .track i{display:block;height:100%;background:var(--brand);border-radius:99px}
.skills em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cando{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.cando li{display:flex;gap:8px;font-size:14px}
.cando li svg{color:var(--ok);margin-top:2px}
.ring-row{display:flex;gap:14px;align-items:center}
.sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.later{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--muted)}
.reader{font-size:17px;line-height:1.8}
.gl{border:0;background:transparent;padding:0;font:inherit;cursor:pointer;border-bottom:2px dotted var(--brand);color:inherit}
.glossbar{position:sticky;bottom:0;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;font-size:14px}
.glossbar b{font-family:var(--font-display)}

/* documento */
.doc{max-width:980px;display:grid;gap:38px}
.doc section{display:grid;gap:14px}
.doc h2{font-size:26px}
.doc h3{font-size:18px}
.doc .lead{color:var(--muted);max-width:70ch}
.doc p,.doc li{max-width:74ch}
.doc ul,.doc ol{margin:0;padding-left:20px;display:grid;gap:6px}
.callout{background:var(--bad-soft);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.callout.warm{background:var(--accent-soft)}
.callout.cool{background:var(--brand-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td b{font-family:var(--font-display)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.conf{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;vertical-align:1px}
.conf.c{background:var(--ok-soft);color:var(--ok)}
.conf.p{background:var(--brand-soft);color:var(--brand)}
.conf.s{background:var(--accent-soft);color:var(--ink)}
.tree{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tree div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start}
.tree b{font-family:var(--font-display);font-size:17px}
.tree span{font-size:13px;color:var(--muted)}
.tree em{font-style:normal;font-weight:700;color:var(--brand);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.panel ul{font-size:14px}
.principles{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:pr}
.principles li{counter-increment:pr;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:none}
.principles li::before{content:counter(pr);font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--brand);line-height:1.1}
.principles b{display:block}
.principles small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.anatomy{display:flex;border-radius:12px;overflow:hidden;font-size:12px;font-weight:700;min-width:600px}
.anatomy div{padding:10px 8px;display:grid;gap:2px}
.anatomy div span{font-weight:400;opacity:.85}
.a1{background:var(--accent);color:var(--accent-ink)}
.a2{background:var(--brand);color:var(--brand-ink)}
.a3{background:var(--ok);color:var(--surface)}
.a4{background:var(--ink);color:var(--surface)}
.scroll{overflow-x:auto}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start;font-size:14px}
.steps b{font-family:var(--font-display);font-size:16px}
.src{font-size:13px;display:grid;gap:5px;padding-left:18px;margin:0}
.src li{max-width:none}

/* formatos nuevos: escena, lectura, respuesta libre */
.scenecard{background:var(--sunk);border-radius:16px;padding:16px;display:grid;gap:8px}
.scenecard b{font-size:18px}
.bubble.oir{color:var(--muted);font-style:italic}
.readtext{background:var(--sunk);border-radius:14px;padding:14px;line-height:1.6;font-size:16px;white-space:pre-line}
.readtext .gl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--brand);text-underline-offset:3px;cursor:pointer}
.checklist{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px;font-size:14px}
.checklist .si{color:var(--ok)} .checklist .no{color:var(--bad)}
.modelo{font-style:italic}
.gapline{font-size:18px;line-height:2}
.gapline .blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--brand);text-align:center;margin:0 2px}
.plans{display:grid;gap:8px}
.warnbox{background:var(--warn-soft,#fff4d6);border-radius:12px;padding:10px 12px;text-align:left}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.transfer{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
@media (max-width:1020px){
  .mock{grid-template-columns:minmax(0,1fr)}
  .screens{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .screens h3{display:none}
  .screens button{white-space:nowrap}
  .tree{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .grid2,.steps{grid-template-columns:1fr}
  .tree{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phone{height:720px;border-width:6px;border-radius:34px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

 is Martín. I'm from Lima, in Peru, and I live in Chicago. Nice to meet you!"},"biblioteca":[{"id":"bib-s1b01-1","titulo":"Dos Martín en la clase","tipo":"texto","texto":"It is the first class of the English course. \"Good evening, class! I'm Linda, your teacher,\" says a woman. \"Martín?\" Two men say, \"Yes!\" One Martín is from Peru. The other Martín is from Spain. \"Nice to meet you, Martín,\" says Martín from Spain. \"Nice to meet you too, Martín!\" Linda says, \"OK. Sorry, what are your last names?\" \"My last name is López,\" says Martín from Peru. \"My last name is López, too!\" says Martín from Spain. Everyone says, \"Oh!\" Linda thinks for a minute. \"OK,\" she says. \"You are Martín One, and you are Martín Two.\"","es":"Es la primera clase del curso de inglés. «¡Buenas noches, clase! Soy Linda, su profesora», dice una mujer. «¿Martín?». Dos hombres dicen: «¡Sí!». Un Martín es de Perú. El otro Martín es de España. «Mucho gusto, Martín», dice el Martín de España. «¡Igualmente, Martín!». Linda dice: «Bueno. Perdón, ¿cuáles son sus apellidos?». «Mi apellido es López», dice el Martín de Perú. «¡Mi apellido también es López!», dice el Martín de España. Toda la clase dice: «¡Oh!». Linda piensa un minuto. «Bueno», dice. «Tú eres Martín Uno y tú eres Martín Dos».","glosas":{"thinks":"piensa","minute":"minuto"},"preguntas":[{"q":"¿Qué tienen en común los dos Martín?","opts":["El nombre y el apellido","El país","La profesión"],"a":0},{"q":"¿De dónde es el otro Martín?","opts":["De España","De México","De Chile"],"a":0},{"q":"¿Cómo resuelve Linda el problema?","opts":["Los llama Martín Uno y Martín Dos","Les pide su número de teléfono","Los cambia de clase"],"a":0}]},{"id":"bib-s1b01-2","titulo":"Un mensaje equivocado","tipo":"texto","texto":"Martín has a message on his phone. The number is not in his phone. \"Hi, Ana! The English class is in classroom eight. See you at seven!\" Martín answers: \"Sorry, I'm not Ana. My name is Martín.\" \"Oh, sorry! Wrong number!\" Martín looks at the message again. English class, classroom eight, at seven. That is his class, too! At seven, Martín is in classroom eight. A woman says, \"Hi! Are you Martín? I'm Sofía. Sorry about the message!\" Martín says, \"No problem. Nice to meet you, Sofía!\"","es":"Martín tiene un mensaje en su teléfono. El número no está en su teléfono. «¡Hola, Ana! La clase de inglés es en el aula ocho. ¡Nos vemos a las siete!». Martín contesta: «Perdón, no soy Ana. Me llamo Martín». «¡Ay, perdón! ¡Número equivocado!». Martín vuelve a mirar el mensaje. Clase de inglés, aula ocho, a las siete. ¡Es su clase también! A las siete, Martín está en el aula ocho. Una mujer dice: «¡Hola! ¿Eres Martín? Soy Sofía. ¡Perdón por el mensaje!». Martín dice: «No hay problema. ¡Mucho gusto, Sofía!».","glosas":{"wrong":"equivocado","looks at":"mira","problem":"problema"},"preguntas":[{"q":"¿Para quién es el mensaje?","opts":["Para Ana","Para Martín","Para Sofía"],"a":0},{"q":"¿Qué descubre Martín?","opts":["Que es su misma clase","Que Ana es su vecina","Que la clase es a las ocho"],"a":0},{"q":"¿Quién escribió el mensaje?","opts":["Sofía, una compañera de clase","Linda, la profesora","Ana, una amiga"],"a":0}]},{"id":"bib-s1b01-3","titulo":"Un taxista de Colombia","tipo":"texto","texto":"It is ten at night. Martín is in a taxi in Chicago. \"Good evening! Where are you from?\" says the man in the taxi. \"I'm from Peru,\" says Martín. \"Oh, nice! I'm from Colombia. Do you speak Spanish?\" \"Yes!\" So the two men speak Spanish about Peru, Colombia, friends and family. At the address, Martín says, \"Thank you! Good night!\" The man says, \"You're welcome. And Martín, you are an English student, yes? Please speak English with your teacher, not with me!\"","es":"Son las diez de la noche. Martín está en un taxi en Chicago. «¡Buenas noches! ¿De dónde eres?», dice el hombre del taxi. «Soy de Perú», dice Martín. «¡Ah, qué bien! Yo soy de Colombia. ¿Hablas español?». «¡Sí!». Así que los dos hombres hablan en español de Perú, de Colombia, de los amigos y de la familia. En la dirección, Martín dice: «¡Gracias! ¡Buenas noches!». El hombre dice: «De nada. Y Martín, tú eres estudiante de inglés, ¿no? ¡Por favor, habla inglés con tu profesora, no conmigo!».","glosas":{"taxi":"taxi","family":"familia"},"preguntas":[{"q":"¿De dónde es el taxista?","opts":["De Colombia","De Perú","De Estados Unidos"],"a":0},{"q":"¿En qué idioma hablan en el taxi?","opts":["En español","En inglés","En los dos"],"a":0},{"q":"¿Qué le aconseja el taxista al final?","opts":["Que hable inglés con su profesora","Que estudie más","Que llame a su familia"],"a":0}]},{"id":"bib-s1b01-4","titulo":"Good night, Linda","tipo":"audio","texto":"It is seven in the evening. Martín is at the English class. \"Good night, Linda!\" he says. Linda says, \"Good evening, Martín! In English, good night is for goodbye. At seven, you say good evening.\" \"Oh, sorry!\" says Martín. \"Good evening, Linda!\" At nine, the class is over. Martín is happy. He says, \"Good evening, Linda!\" Linda says, \"No, Martín! Now it's goodbye. Now you say good night!\" Everyone says, \"Good night, Martín!\"","es":"Son las siete de la tarde. Martín está en la clase de inglés. «¡Buenas noches, Linda!», dice. Linda dice: «¡Buenas noches, Martín! En inglés, good night es para despedirse. A las siete se dice good evening». «¡Ay, perdón!», dice Martín. «¡Good evening, Linda!». A las nueve termina la clase. Martín está contento. Dice: «¡Good evening, Linda!». Linda dice: «¡No, Martín! Ahora es una despedida. ¡Ahora se dice good night!». Toda la clase dice: «¡Buenas noches, Martín!».","glosas":{"is over":"termina","happy":"contento","now":"ahora"},"preguntas":[{"q":"¿Qué error comete Martín al llegar?","opts":["Dice good night en lugar de good evening","Llega tarde","Olvida el nombre de Linda"],"a":0},{"q":"¿Y qué pasa al terminar la clase?","opts":["Se equivoca al revés: dice good evening","Dice good night bien","No se despide"],"a":0}]},{"id":"bib-s1b01-5","titulo":"La compañera que no era compañera","tipo":"texto","texto":"Martín is in the classroom. It's the English class, but where is Linda? A woman says, \"Hi! Are you a student?\" \"Yes, I'm Martín. I'm from Peru. And you?\" \"I'm Emily. I'm from the United States.\" Martín doesn't understand. \"Sorry, can you speak more slowly, please?\" \"Of course,\" she says slowly. \"I live in Chicago.\" \"Oh, nice! Your English is very good!\" says Martín. Emily smiles. \"Thank you!\" At seven, Emily says, \"Good evening, class! Linda isn't in class this evening. I'm Emily, your teacher.\" Martín looks at her. \"Oh! Sorry!\" Emily laughs. \"That's OK, Martín. Your English is good too!\"","es":"Martín está en el salón. Es la clase de inglés, pero ¿dónde está Linda? Una mujer dice: «¡Hola! ¿Eres estudiante?». «Sí, soy Martín. Soy de Perú. ¿Y tú?». «Soy Emily. Soy de Estados Unidos». Martín no entiende. «Perdón, ¿puedes hablar más despacio, por favor?». «Claro», dice ella despacio. «Vivo en Chicago». «¡Ah, qué bien! ¡Tu inglés es muy bueno!», dice Martín. Emily sonríe. «¡Gracias!». A las siete, Emily dice: «¡Buenas noches, clase! Linda no está en clase esta noche. Soy Emily, su profesora». Martín la mira. «¡Ay! ¡Perdón!». Emily se ríe. «No pasa nada, Martín. ¡Tu inglés también es bueno!».","glosas":{"of course":"claro","very":"muy","smiles":"sonríe","looks at":"mira a","laughs":"se ríe"},"preguntas":[{"q":"¿De dónde es Emily?","opts":["De Perú","De Estados Unidos","De Chile"],"a":1},{"q":"¿Qué le pide Martín a Emily?","opts":["Que hable más despacio","Que repita su nombre","Que le dé su número"],"a":0},{"q":"¿Por qué Martín dice «¡Perdón!» al final?","opts":["Porque llega tarde","Porque no entiende la clase","Porque Emily es la profesora, no una alumna"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"Hello","opts":["Chao","Hola","Adiós"],"a":"Hola","items":["hello"]},{"tipo":"significado","nuevo":true,"en":"Hi","opts":["Hola","Chao","Adiós"]," sister","en":"I have a brother and a sister.","es":"Tengo un hermano y una hermana.","l":12},{"id":"one-hundred","en":"one hundred","es":"cien","l":12}],"receptivo":[{"en":"aunt","es":"tía"},{"en":"uncle","es":"tío"},{"en":"cousin","es":"primo"},{"en":"grandmother","es":"abuela"},{"en":"grandfather","es":"abuelo"},{"en":"grandparents","es":"abuelos"},{"en":"nephew","es":"sobrino"},{"en":"niece","es":"sobrina"},{"en":"relatives","es":"parientes"},{"en":"mom","es":"mamá"},{"en":"dad","es":"papá"},{"en":"child","es":"hijo"},{"en":"kid","es":"chico"},{"en":"boy","es":"niño"},{"en":"girl","es":"niña"},{"en":"twins","es":"gemelos"},{"en":"person","es":"persona"},{"en":"partner","es":"pareja"},{"en":"boyfriend","es":"novio"},{"en":"girlfriend","es":"novia"},{"en":"pet","es":"mascota"},{"en":"dog","es":"perro"},{"en":"cat","es":"gato"},{"en":"age","es":"edad"},{"en":"tall","es":"alto"},{"en":"short","es":"bajo"},{"en":"handsome","es":"guapo"},{"en":"hair","es":"pelo"},{"en":"eyes","es":"ojos"},{"en":"happy","es":"feliz"},{"en":"grandchildren","es":"nietos"},{"en":"divorced","es":"divorciado"},{"en":"glasses","es":"lentes"},{"en":"friendly","es":"amable"},{"en":"smile","es":"sonrisa"},{"en":"look","es":"mira","para":"esc-s1b02"},{"en":"later","es":"luego","para":"esc-s1b02"}],"dialogos":[{"id":"fotos","titulo":"Mirando fotos con una amiga","turnos":[{"quien":"Sara","en":"Who is that?","opts":["He's my brother.","Is my brother.","His my brother."],"a":0,"por_que":"He's es «él es». His es «su», y sin sujeto («Is my brother») la frase queda incompleta."},{"quien":"Sara","en":"How old is he?","opts":["He's twenty.","He has twenty years.","He has twenty."],"a":0,"por_que":"La edad va con be: He's twenty."},{"quien":"Sara","en":"Is he married?","opts":["No, he isn't. He's single.","No, he doesn't. He's single.","No, he's no married."],"a":0,"por_que":"Con be, la respuesta corta repite be: No, he isn't."}]},{"id":"padres","titulo":"Presentas a tus padres","turnos":[{"quien":"Tom","en":"Hi! Are they your parents?","opts":["Yes, they are. This is my mother, Rosa.","Yes, they're. This is my mother, Rosa.","Yes, are my parents."],"a":0,"por_que":"En la respuesta corta afirmativa no se contrae: Yes, they are."},{"quien":"Tom","en":"Nice to meet you, Rosa! And who is that man?","opts":["That's my father. His name is Pedro.","That's my father. Her name is Pedro.","That's my father. He's name is Pedro."],"a":0,"por_que":"El nombre es de él: his name. He's es «él es»."},{"quien":"Tom","en":"How old are your parents?","opts":["My mother is forty and my father is fifty.","My mother has forty years and my father has fifty.","My mother is forty and my father are fifty."],"a":0,"por_que":"La edad va con be, y con un solo padre el verbo es is."}]}],"escucha":[{"id":"familia-lucia","texto":"This is my family. My father is Pedro and my mother is Rosa. My father is fifty and my mother is forty. I have a brother and a sister. My sister is married, and her husband is a teacher.","preguntas":[{"q":"¿Cuántos años tiene la madre?","opts":["40","14","50"],"a":0},{"q":"¿Quién es profesor?","opts":["El esposo de la hermana","El hermano","El padre"],"a":0}]}],"escenas":[{"id":"esc-s1b02","ambito":"tronco","titulo":"Conocer gente en una reunión","contexto":"Martín y Mónica acaban de mudarse a Chicago. Jake, un compañero de trabajo de Mónica, los invitó a una reunión en su casa. Martín no conoce a nadie; una mujer se le acerca junto a la mesa de las bebidas y, al rato, llega Mónica. Tú eres Martín.","turnos":[{"quien":"Ashley","en":"Hi! I'm Ashley, Jake's sister. What's your name?","es":"¡Hola! Soy Ashley, la hermana de Jake. ¿Cómo te llamas?","comprension":{"q":"¿Quién es Ashley?","opts":["La hermana de Jake","La esposa de Jake","Una vecina de Jake"],"a":0},"respuesta":{"modo":"elegir","opts":["Hi, I'm Martín. Nice to meet you.","Hi, I'm Martín. Enchanted.","Hi, is Martín. Nice to meet you."],"a":0,"por_que":"«Encantado» no se dice Enchanted: se dice Nice to meet you. Y la frase necesita sujeto: I'm Martín."}},{"quien":"Ashley","en":"Nice to meet you too, Martín. Where are you from?","es":"Igualmente, Martín. ¿De dónde eres?","respuesta":{"modo":"completar","en":"I'm from Lima, in Peru. We're new here.","huecos":["from","We're"],"distractores":["of","Our"]}},{"quien":"Ashley","en":"Welcome to Chicago! Oh, and who is this?","es":"¡Bienvenido a Chicago! Ah, ¿y quién es ella?","respuesta":{"modo":"elegir","opts":["This is my wife, Mónica.","This is my woman, Mónica.","Is my wife, Mónica."],"a":0,"por_que":"Para presentar a alguien se usa This is…. «Mi mujer» es my wife: my woman suena raro y poco respetuoso."}},{"quien":"Ashley","en":"Hi, Mónica! So, how do you know Jake?","es":"¡Hola, Mónica! Y, ¿de dónde conocen a Jake?","comprension":{"q":"¿Qué les pregunta Ashley?","opts":["De dónde conocen a Jake","Dónde vive Jake","Si Jake es su vecino"],"a":0},"respuesta":{"modo":"elegir","opts":["My wife and Jake are coworkers.","My wife and Jake are companions of work.","My wife and Jake is coworkers."],"a":0,"por_que":"«Compañero de trabajo» es coworker; companion no se usa así. Y con dos personas el verbo es are."}},{"quien":"Ashley","en":"Oh, nice! Look, that man is my husband, Kevin. And those are our children.","es":"¡Ah, qué bien! Mira, ese señor es mi esposo, Kevin. Y esos son nuestros hijos.","comprension":{"q":"¿A quiénes te muestra Ashley?","opts":["A su esposo y a sus hijos","A su hermano y a sus padres","A unos amigos de Jake"],"a":0},"respuesta":{"modo":"elegir","opts":["How old are they?","How many years do they have?","How old they are?"],"a":0,"por_que":"La edad se pregunta con be: How old are they? Y en la pregunta, are va antes que they."}},{"quien":"Ashley","en":"They're eight and five. And you? Do you have children?","es":"Tienen ocho y cinco. ¿Y ustedes? ¿Tienen hijos?","respuesta":{"modo":"elegir","opts":["No, we don't.","No, we aren't.","No, we no have."],"a":0,"por_que":"A una pregunta con do se responde con do: No, we don't. We no have es un calco del español."}},{"quien":"Ashley","en":"Oh, Jake needs me. See you later, Martín!","es":"Ay, Jake me necesita. ¡Nos vemos luego, Martín!","comprension":{"q":"¿Por qué se va Ashley?","opts":["Porque Jake la necesita","Porque sus hijos la llaman","Porque ya es tarde"],"a":0},"respuesta":{"modo":"hablar","en":"OK, see you! Nice to meet you, Ashley.","es":"¡Bueno, nos vemos! Mucho gusto, Ashley."}}],"notas_uso":["This is my wife es la forma de presentar a alguien. She is my wife es correcto, pero suena a aclaración, no a presentación.","Nice to meet you solo la primera vez. Si vuelves a ver a Ashley otro día, dirás Nice to see you.","How old are they? está bien para preguntar por niños. A un adulto que acabas de conocer no se le pregunta la edad.","En una reunión en EE. UU. se saluda con la mano o solo con una sonrisa; los besos en la mejilla sorprenden."]}],"lecturas":[{"id":"lec-s1b02-1","tipo":"oido","titulo":"Ashley habla de su familia","texto":"This is my family. My husband is Kevin. He's forty, and he's a teacher. Our children are Lily and Max. Lily is eight and Max is five. My parents live with us. My mother is seventy, but she isn't old! And Jake is my brother. He's single.","es":"Esta es mi familia. Mi esposo es Kevin. Tiene cuarenta años y es profesor. Nuestros hijos son Lily y Max. Lily tiene ocho y Max, cinco. Mis padres viven con nosotros. Mi madre tiene setenta, ¡pero no es mayor! Y Jake es mi hermano. Es soltero.","preguntas":[{"q":"¿Cuántos años tiene Kevin?","opts":["40","14","50"],"a":0},{"q":"¿Quién vive con Ashley y su familia?","opts":["Sus padres","Su hermano Jake","Nadie más"],"a":0},{"q":"¿Jake está casado?","opts":["No, es soltero","Sí, y tiene dos hijos","Sí, con una profesora"],"a":0}]},{"id":"lec-s1b02-2","tipo":"mensaje","titulo":"Un mensaje de Ashley","texto":"Hi Martín! It's Ashley, Jake's sister. It was nice to meet you and Mónica! Lily and Max say hi. Do you have a photo of your family? Are your parents in Lima? And do you have brothers or sisters? See you soon!","es":"¡Hola, Martín! Soy Ashley, la hermana de Jake. ¡Fue un gusto conocerlos a ti y a Mónica! Lily y Max te mandan saludos. ¿Tienes una foto de tu familia? ¿Tus padres están en Lima? ¿Y tienes hermanos? ¡Nos vemos pronto!","glosas":{"photo":"foto","soon":"pronto"},"preguntas":[{"q":"¿Qué quiere ver Ashley?","opts":["Una foto de tu familia","Una foto de Lima","Una foto de Mónica"],"a":0},{"q":"¿Qué te pregunta sobre tu familia?","opts":["Si tus padres están en Lima y si tienes hermanos","Cuántos años tienen tus padres","Si estás casado"],"a":0}],"responder":{"consigna":"Contesta a Ashley: di dónde están tus padres y si tienes hermanos.","elementos":[{"txt":"Dices dónde están o viven tus padres","claves":["parents","mother","father"]},{"txt":"Dices si tienes hermanos","claves":["brother","sister"]}],"modelo":"Hi Ashley! Yes, my parents are in Lima. My mother is sixty and my father is sixty-five. I have a brother and a sister."}}],"escritura":{"consigna":"Escribe un mensaje corto a un amigo nuevo sobre tu familia: quién es alguien de tu familia, cuántos años tiene y dónde vive.","elementos":[{"txt":"Presentas a alguien de tu familia","claves":["mother","father","parents","brother","sister","husband","wife","son","daughter","children","family"]},{"txt":"Dices una edad","claves":["years old","ten","eleven","twelve","teen","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"]},{"txt":"Dices dónde vive o de dónde es","claves":["live","from"]}],"modelo":"Hi! This is my family. My mother is Rosa. She's fifty-five, and she lives in Lima. My brother Pedro is twenty-eight. He's married."},"biblioteca":[{"id":"bib-s1b02-1","titulo":"Ben y Sam","tipo":"texto","texto":"At Jake's party, Martín meets a man. \"Hi! I'm Ben. I'm Jake's coworker.\" Ben is tall and friendly. He's thirty, and he's married. His wife is a doctor. Later, Martín sees Ben again, near the door. \"Hi, Ben! How is your wife?\" The man looks at Martín. \"My wife? I'm not married. I'm single. And I'm not Ben.\" Martín doesn't understand. Then Ben comes to the door, too. The two men have the same eyes, the same hair, the same smile. \"This is my brother, Sam,\" says Ben. \"We're twins!\"","es":"En la fiesta de Jake, Martín conoce a un hombre. «¡Hola! Soy Ben. Soy compañero de trabajo de Jake». Ben es alto y amable. Tiene treinta años y está casado. Su esposa es médica. Más tarde, Martín vuelve a ver a Ben, cerca de la puerta. «¡Hola, Ben! ¿Cómo está tu esposa?». El hombre mira a Martín. «¿Mi esposa? No estoy casado. Soy soltero. Y no soy Ben». Martín no entiende. Entonces Ben también llega a la puerta. Los dos hombres tienen los mismos ojos, el mismo pelo, la misma sonrisa. «Este es mi hermano, Sam», dice Ben. «¡Somos gemelos!».","glosas":{"party":"fiesta","door":"puerta","then":"entonces","comes":"llega"},"preguntas":[{"q":"¿Por qué Martín no entiende?","opts":["Cree que habla con Ben, pero es Sam","Sam habla muy rápido","No conoce a Jake"],"a":0},{"q":"¿Quién está casado?","opts":["Ben","Sam","Los dos"],"a":0},{"q":"¿Qué son Ben y Sam?","opts":["Gemelos","Primos","Compañeros de trabajo"],"a":0}]},{"id":"bib-s1b02-2","titulo":"La foto de Mrs. Kowalski","tipo":"texto","texto":"Martín has coffee with his neighbor, Mrs. Kowalski. She has a photo of a young woman with a baby. \"Who is that?\" says Martín. \"Is she your daughter?\" \"No,\" she says, with a big smile. \"That's me! I'm twenty in this photo. And the baby is my son, Peter. Now Peter is fifty-five, and he has three children.\" \"So you have three grandchildren!\" \"No, I have nine grandchildren. I have four children: two sons and two daughters. My family is big!\"","es":"Martín toma un café con su vecina, la señora Kowalski. Ella tiene una foto de una mujer joven con un bebé. «¿Quién es?», dice Martín. «¿Es su hija?». «No», dice ella, con una gran sonrisa. «¡Soy yo! Tengo veinte años en esta foto. Y el bebé es mi hijo, Peter. Ahora Peter tiene cincuenta y cinco años y tiene tres hijos». «¡Entonces tiene tres nietos!». «No, tengo nueve nietos. Tengo cuatro hijos: dos hijos y dos hijas. ¡Mi familia es grande!».","glosas":{"coffee":"café","neighbor":"vecina","photo":"foto","big":"grande","now":"ahora"},"preguntas":[{"q":"¿Quién es la mujer joven de la foto?","opts":["La señora Kowalski","Su hija","Su nieta"],"a":0},{"q":"¿Cuántos nietos tiene la señora Kowalski?","opts":["Nueve","Tres","Cuatro"],"a":0}]},{"id":"bib-s1b02-3","titulo":"¿Cuántos años tiene Max?","tipo":"texto","texto":"Max is Ashley's son. He's five, but he doesn't say five. \"How old are you, Max?\" says Martín. \"I'm twenty!\" says Max. \"Twenty? You're very young for twenty!\" Max's sister, Lily, is eight. \"He isn't twenty. He's five,\" she says. Max looks at his dog, Rocky. \"OK, I'm five. But Rocky is fourteen. He's old! In dog years, he's ninety-eight!\" Martín looks at Lily. \"Is that right?\" \"Yes,\" says Lily. \"Max is five, but he's very good with numbers.\"","es":"Max es el hijo de Ashley. Tiene cinco años, pero no dice cinco. «¿Cuántos años tienes, Max?», dice Martín. «¡Tengo veinte!», dice Max. «¿Veinte? ¡Eres muy joven para tener veinte!». La hermana de Max, Lily, tiene ocho. «No tiene veinte. Tiene cinco», dice ella. Max mira a su perro, Rocky. «Bueno, tengo cinco. Pero Rocky tiene catorce. ¡Es viejo! ¡En años de perro tiene noventa y ocho!». Martín mira a Lily. «¿Es verdad?». «Sí», dice Lily. «Max tiene cinco años, pero es muy bueno con los números».","glosas":{"very":"muy","right":"cierto"},"preguntas":[{"q":"¿Qué edad dice Max que tiene?","opts":["Veinte años","Cinco años","Catorce años"],"a":0},{"q":"¿Quién es Rocky?","opts":["El perro de Max","El hermano de Max","El papá de Max"],"a":0},{"q":"¿En qué es bueno Max, según Lily?","opts":["En los números","En el inglés","En los perros"],"a":0}]},{"id":"bib-s1b02-4","titulo":"Un mensaje de voz de mamá","tipo":"audio","texto":"Hi, Martín! It's Mom. I'm in Chicago! Yes, in Chicago, with your father. We're at the airport. Your brother, Pedro, is here, too, with his wife and his two children. It's a surprise! Pedro says hi. Your father is very happy. He's fifty-eight, but he says he's young. Please call me. My phone number is the same. See you later! Bye!","es":"¡Hola, Martín! Habla mamá. ¡Estoy en Chicago! Sí, en Chicago, con tu padre. Estamos en el aeropuerto. Tu hermano Pedro también está aquí, con su esposa y sus dos hijos. ¡Es una sorpresa! Pedro te manda saludos. Tu padre está muy feliz. Tiene cincuenta y ocho años, pero dice que es joven. Por favor, llámame. Mi número de teléfono es el mismo. ¡Nos vemos luego! ¡Chao!","glosas":{"airport":"aeropuerto","surprise":"sorpresa","call":"llama","very":"muy"},"preguntas":[{"q":"¿Dónde está la mamá de Martín?","opts":["En el aeropuerto de Chicago","En su casa de Lima","En la casa de Martín"],"a":0},{"q":"¿Quién viaja con sus padres?","opts":["Su hermano Pedro, con su esposa y sus hijos","Su hermana","Nadie"],"a":0},{"q":"¿Qué le pide su mamá?","opts":["Que la llame","Que vaya a Lima","Que compre algo"],"a":0}]},{"id":"bib-s1b02-5","titulo":"La alumna sorpresa","tipo":"texto","texto":"In the English class, Linda says, \"Today we talk about family. Do you have a photo?\" Kaori has a photo on her phone. \"This is my family. This is my father. He's an engineer. This is my brother, Ken. He's nineteen, and he's a student. And this is my mother. She's a teacher, and she's fifty.\" \"Fifty? She's very young!\" says Martín. \"Where is your mother now?\" Kaori smiles. \"No. She's here, in this class!\" A woman says, \"Hello, everyone! I'm Kaori's mother. My name is Emiko. Nice to meet you!\" Martín says, \"Nice to meet you too! Are you a student or a teacher?\" Emiko laughs. \"Here, I'm a student!\"","es":"En la clase de inglés, Linda dice: «Hoy hablamos de la familia. ¿Tienen una foto?». Kaori tiene una foto en su teléfono. «Esta es mi familia. Este es mi padre. Es ingeniero. Este es mi hermano, Ken. Tiene diecinueve años y es estudiante. Y esta es mi madre. Es profesora y tiene cincuenta». «¿Cincuenta? ¡Es muy joven!», dice Martín. «¿Dónde está tu madre ahora?». Kaori sonríe. «No. ¡Está aquí, en esta clase!». Una mujer dice: «¡Hola a todos! Soy la madre de Kaori. Me llamo Emiko. ¡Mucho gusto!». Martín dice: «¡Mucho gusto también! ¿Usted es estudiante o profesora?». Emiko se ríe. «¡Aquí soy estudiante!».","glosas":{"today":"hoy","talk":"hablamos","photo":"foto","very":"muy","now":"ahora","laughs":"se ríe"},"preguntas":[{"q":"¿Qué hace el padre de Kaori?","opts":["Es profesor","Es ingeniero","Es médico"],"a":1},{"q":"¿Cuántos años tiene Ken?","opts":["Diecinueve","Quince","Cincuenta"],"a":0},{"q":"¿Dónde está la madre de Kaori?","opts":["En su casa","En el trabajo","En la clase de inglés"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"family","opts":["familia","mujer","Colombia"],"a":"familia","items":["family"]},{"tipo":"significado","nuevo":true,"en":"mother","opts":["México","madre","Chao"],"a":"madre","items":["mother"]},{"tipo":"significado","nuevo":true,"en":"father","opts":["estudiante","padre","España"],"a":"padre","items":["father"]},{"tipo":"tarjeta","en":"This is my mother.","es":"Esta es mi madre.","nota":"This is… sirve para presentar a alguien.","items":["this-is-my-mother"]},{"tipo":"tarjeta","en":"Who is that?","es":"¿Quién es ese?","nota":"That es para lo que está lejos; this, para lo que está cerca.","items":["who-is-that"]},{"tipo":"emparejar","pares":[["family","familia"],["mother","madre"],["father","padre"]],"items":["family","mother","father"]},{"tipo":"situacion","q":"Le presentas tu madre a una amiga. Dices…","audio":null,"opts":["This is my mother.","Is my mother.","She my mother."],"a":0,"por_que":"Para presentar a alguien se usa This is…; en inglés la frase necesita sujeto y verbo.","items":[]},{"tipo":"emparejar","pares":[["This is my mother.","Esta es mi madre."],["Who is that?","¿Quién es ese?"],["one","uno"]],"item  I go to work at nine. Do you work in the morning?","opts":["Yes, I do.","Yes, I am.","Yes, I does."],"a":0,"por_que":"La respuesta corta repite do: Yes, I do."},{"quien":"Ana","en":"What time does your brother get up?","opts":["He usually gets up at six.","He usually get up at six.","He gets up usually at six."],"a":0,"por_que":"Con he, el verbo lleva -s, y usually va antes del verbo."}]}],"escucha":[{"id":"dia-luis","texto":"My name is Luis. I get up at six o'clock every day. I have breakfast at half past six and I go to work at seven. I don't work on the weekend. On Sunday, I usually watch TV in the evening.","preguntas":[{"q":"¿A qué hora desayuna Luis?","opts":["A las seis y media","A las seis","A las siete"],"a":0},{"q":"¿Qué hace el domingo por la noche?","opts":["Normalmente ve la tele","Trabaja","Se levanta a las seis"],"a":0}]}],"escenas":[{"id":"esc-s1b03","ambito":"tronco","titulo":"Con la vecina por la mañana","contexto":"Martín sale de su departamento en Chicago y se encuentra en el pasillo con la vecina, Mrs. Kowalski, una señora de 75 años muy conversadora. Tú eres Martín.","turnos":[{"quien":"Mrs. Kowalski","en":"Good morning, Martín! What time is it, please?","es":"¡Buenos días, Martín! ¿Qué hora es, por favor?","comprension":{"q":"¿Qué te pregunta Mrs. Kowalski?","opts":["La hora","Adónde vas","Si trabajas hoy"],"a":0},"respuesta":{"modo":"elegir","opts":["It's quarter past eight.","It's eight and quarter.","Is quarter past eight."],"a":0,"por_que":"«Y cuarto» es quarter past, y va antes de la hora. Y la frase necesita it: It's…"}},{"quien":"Mrs. Kowalski","en":"Thank you. Do you go to work every day?","es":"Gracias. ¿Vas al trabajo todos los días?","respuesta":{"modo":"completar","en":"Yes, I do. I go to work at nine.","huecos":["do","at"],"distractores":["am","in"]}},{"quien":"Mrs. Kowalski","en":"And Mónica? Does she work, too?","es":"¿Y Mónica? ¿Ella también trabaja?","comprension":{"q":"¿Qué quiere saber la vecina?","opts":["Si Mónica también trabaja","A qué hora trabaja Mónica","Si Mónica está en casa"],"a":0},"respuesta":{"modo":"elegir","opts":["Yes, she does. She works every day.","Yes, she do. She work every day.","Yes, she is. She works every day."],"a":0,"por_que":"Si la pregunta va con does, la respuesta corta también: Yes, she does. Y con she el verbo lleva -s: she works."}},{"quien":"Mrs. Kowalski","en":"Oh, I don't work. I'm seventy-five! I usually get up at six and have breakfast with my sister.","es":"Ay, yo no trabajo. ¡Tengo setenta y cinco! Normalmente me levanto a las seis y desayuno con mi hermana.","respuesta":{"modo":"elegir","opts":["What do you do in the afternoon?","What you do in the afternoon?","What does you do in the afternoon?"],"a":0,"por_que":"En la pregunta, do va antes del sujeto: What do you do…? Sin do la pregunta queda incompleta, y does es solo para he y she."}},{"quien":"Mrs. Kowalski","en":"In the afternoon? I watch TV. And in the evening, I have dinner with my son.","es":"¿En la tarde? Veo la tele. Y en la noche ceno con mi hijo.","comprension":{"q":"¿Qué hace la vecina en la noche?","opts":["Cena con su hijo","Ve la tele con su hermana","Desayuna con su hijo"],"a":0},"respuesta":{"modo":"elegir","opts":["Where does he live?","Where he lives?","Where does he lives?"],"a":0,"por_que":"Palabra de pregunta + does + sujeto + verbo sin -s: Where does he live? En español basta «¿Dónde vive?»; en inglés hace falta does."}},{"quien":"Mrs. Kowalski","en":"Near here, on Clark Street. Oh, Martín, what's your phone number?","es":"Cerca de aquí, en la calle Clark. Ah, Martín, ¿cuál es tu número de teléfono?","comprension":{"q":"¿Qué te pide la vecina?","opts":["Tu número de teléfono","Tu dirección","La hora otra vez"],"a":0},"respuesta":{"modo":"completar","en":"My number is 312-555-0142.","huecos":["My","is"],"distractores":["Me","are"]}},{"quien":"Mrs. Kowalski","en":"Thank you! Have a good day, Martín.","es":"¡Gracias! Que tengas un buen día, Martín.","respuesta":{"modo":"hablar","en":"Thanks! You too.","es":"¡Gracias! Igualmente."}}],"notas_uso":["Para preguntar la hora a un desconocido se empieza con Excuse me. What hour is it? no se dice.","Have a good day! se oye al despedirse en tiendas, oficinas y entre vecinos. Se responde Thanks, you too!","What do you do? a secas pregunta por el trabajo; What do you do in the afternoon? pregunta por la rutina.","En EE. UU. es normal que un vecino te pida el teléfono para avisarte de paquetes o de problemas del edificio."]}],"lecturas":[{"id":"lec-s1b03-1","tipo":"oido","titulo":"El horario de un café","texto":"Hi! This is Rosa's Café, on Clark Street. We're open every day. From Monday to Friday, we open at seven in the morning and we close at eight in the evening. On the weekend, we open at nine. Thank you, and see you soon!","es":"¡Hola! Llamaste a Rosa's Café, en la calle Clark. Abrimos todos los días. De lunes a viernes abrimos a las siete de la mañana y cerramos a las ocho de la noche. El fin de semana abrimos a las nueve. ¡Gracias, y hasta pronto!","glosas":{"soon":"pronto"},"preguntas":[{"q":"¿A qué hora abre el café de lunes a viernes?","opts":["A las 7","A las 8","A las 9"],"a":0},{"q":"¿A qué hora cierra?","opts":["A las 8 de la noche","A las 7 de la tarde","A las 9 de la noche"],"a":0},{"q":"¿Qué días abre?","opts":["Todos los días","De lunes a viernes","Solo el fin de semana"],"a":0}]},{"id":"lec-s1b03-2","tipo":"mensaje","titulo":"Un mensaje de Mónica","texto":"Hi Martín! I work late today. I finish at eight, so I get home at half past eight. Can we have dinner at nine? Oh, and on Saturday I don't work! What time do you get up on Saturday? Love, Mónica","es":"¡Hola, Martín! Hoy trabajo hasta tarde. Termino a las ocho, así que llego a casa a las ocho y media. ¿Cenamos a las nueve? Ah, ¡y el sábado no trabajo! ¿A qué hora te levantas el sábado? Un beso, Mónica","glosas":{"today":"hoy","love":"un beso"},"preguntas":[{"q":"¿A qué hora llega Mónica a casa?","opts":["A las 8:30","A las 8","A las 9"],"a":0},{"q":"¿Qué día no trabaja Mónica?","opts":["El sábado","El viernes","El domingo"],"a":0}],"responder":{"consigna":"Contesta a Mónica: di si está bien cenar a las nueve y a qué hora te levantas el sábado.","elementos":[{"txt":"Respondes sobre la cena","claves":["yes","ok","sure","dinner","great","no"]},{"txt":"Dices a qué hora te levantas","claves":["get up","o'clock","half past","quarter past"]}],"modelo":"Yes, dinner at nine is great! On Saturday I get up at ten o'clock."}}],"escritura":{"consigna":"Escribe 2 o 3 frases sobre tu día: a qué hora te levantas, qué haces durante el día y qué haces el fin de semana.","elementos":[{"txt":"Dices a qué hora te levantas","claves":["get up"]},{"txt":"Dices qué haces durante el día","claves":["work","study","have breakfast","have lunch","have dinner","go to","watch"]},{"txt":"Hablas del fin de semana","claves":["weekend","saturday","sunday"]}],"modelo":"I get up at seven every day. I have breakfast and I go to work at eight. On the weekend, I usually watch TV."},"biblioteca":[{"id":"bib-s1b03-1","titulo":"El sábado de Martín","tipo":"texto","texto":"It's Saturday, but Martín doesn't know. At six o'clock, his phone says, \"Get up!\" Martín gets up. He has breakfast at half past six and he goes to work. At quarter past seven, he is at the office. The door is closed. There is nobody. Martín calls Jake. \"Hi, Jake! Where are you? Where is everybody?\" Jake says, \"Martín, it's Saturday! We don't work on the weekend!\" Martín goes home and goes to bed again. He sleeps until twelve.","es":"Es sábado, pero Martín no lo sabe. A las seis, su teléfono dice: «¡Levántate!». Martín se levanta. Desayuna a las seis y media y va al trabajo. A las siete y cuarto está en la oficina. La puerta está cerrada. No hay nadie. Martín llama a Jake. «¡Hola, Jake! ¿Dónde estás? ¿Dónde están todos?». Jake dice: «¡Martín, es sábado! ¡No trabajamos el fin de semana!». Martín vuelve a casa y se acuesta otra vez. Duerme hasta las doce.","glosas":{"door":"puerta","there is":"hay","nobody":"nadie","calls":"llama"},"preguntas":[{"q":"¿Qué error comete Martín?","opts":["Va al trabajo un sábado","Se levanta tarde","Olvida su teléfono"],"a":0},{"q":"¿A qué hora llega a la oficina?","opts":["A las siete y cuarto","A las seis y media","A las ocho"],"a":0},{"q":"¿Qué hace al volver a casa?","opts":["Se acuesta otra vez","Ve la tele","Desayuna"],"a":0}]},{"id":"bib-s1b03-2","titulo":"Una jubilada muy ocupada","tipo":"texto","texto":"Mrs. Kowalski is seventy-five and she's retired, but she is very busy. She gets up at six every day. On Mondays and Wednesdays, she has breakfast with her sister. On Tuesdays, she studies Spanish. On Thursdays, she swims. On Fridays, she has lunch with her friends, and on Saturdays her son and his children come for dinner. On Sunday she sleeps, right? No! On Sunday, she cooks for all the family. \"And you, Martín?\" she says. \"What do you do on Sunday?\" \"I sleep,\" says Martín.","es":"La señora Kowalski tiene setenta y cinco años y está jubilada, pero está muy ocupada. Se levanta a las seis todos los días. Los lunes y miércoles desayuna con su hermana. Los martes estudia español. Los jueves nada. Los viernes almuerza con sus amigas, y los sábados su hijo y sus nietos vienen a cenar. El domingo duerme, ¿no? ¡No! El domingo cocina para toda la familia. «¿Y tú, Martín?», dice. «¿Qué haces el domingo?». «Duermo», dice Martín.","glosas":{"very":"muy","swims":"nada","come":"vienen","right":"¿no?","cooks":"cocina"},"preguntas":[{"q":"¿Qué hace la señora Kowalski los martes?","opts":["Estudia español","Nada","Almuerza con sus amigas"],"a":0},{"q":"¿Qué hace el domingo?","opts":["Cocina para toda la familia","Duerme","Ve la tele"],"a":0},{"q":"¿Quién descansa más el domingo?","opts":["Martín","La señora Kowalski","El hijo de la señora Kowalski"],"a":0}]},{"id":"bib-s1b03-3","titulo":"El día al revés de Linda","tipo":"texto","texto":"Linda is an English teacher. Her classes are in the evening, from six to ten. She has dinner at eleven and goes to bed at two in the morning. She gets up at ten. At noon, Martín has lunch at work. At noon, Linda has breakfast! One day, Martín sees Linda in a café at one o'clock. \"Good afternoon, Linda!\" he says. Linda smiles. \"Good morning, Martín! For me, it's the morning.\"","es":"Linda es profesora de inglés. Sus clases son por la noche, de seis a diez. Cena a las once y se acuesta a las dos de la mañana. Se levanta a las diez. Al mediodía, Martín almuerza en el trabajo. ¡Al mediodía, Linda desayuna! Un día, Martín ve a Linda en un café a la una. «¡Buenas tardes, Linda!», dice. Linda sonríe. «¡Buenos días, Martín! Para mí, es la mañana».","glosas":{"café":"café"},"preguntas":[{"q":"¿Cuándo son las clases de Linda?","opts":["Por la noche, de seis a diez","En la mañana","Al mediodía"],"a":0},{"q":"¿Qué hace Linda al mediodía?","opts":["Desayuna","Almuerza","Duerme"],"a":0},{"q":"¿Por qué Linda dice good morning a la una?","opts":["Porque para ella es la mañana","Porque se equivoca de hora","Porque no entiende a Martín"],"a":0}]},{"id":"bib-s1b03-4","titulo":"La semana de Kaori","tipo":"audio","texto":"Hi, I'm Kaori. My week is very busy. From Monday to Friday, I work in an office. I get up at six and I go to work at seven. On Tuesday and Thursday, I have English class at night. I usually go to bed at midnight. On Saturday, I study, and in the evening I have dinner with friends. And on Sunday? On Sunday I never get up before noon. My phone is off, and I'm happy!","es":"Hola, soy Kaori. Mi semana es muy ocupada. De lunes a viernes trabajo en una oficina. Me levanto a las seis y voy al trabajo a las siete. Los martes y jueves tengo clase de inglés por la noche. Normalmente me acuesto a medianoche. El sábado estudio, y por la noche ceno con amigos. ¿Y el domingo? El domingo nunca me levanto antes del mediodía. ¡Mi teléfono está apagado y estoy feliz!","glosas":{"week":"semana","very":"muy","off":"apagado"},"preguntas":[{"q":"¿Qué días tiene Kaori clase de inglés?","opts":["Martes y jueves","Lunes y miércoles","Sábado y domingo"],"a":0},{"q":"¿Qué hace Kaori el domingo?","opts":["Se levanta después del mediodía","Trabaja en la oficina","Cena con amigos"],"a":0}]},{"id":"bib-s1b03-5","titulo":"El despertador de cuatro patas","tipo":"texto","texto":"Ashley's family is very busy. From Monday to Friday, Ashley and her husband, Kevin, get up at six. Kevin is a teacher, and he goes to work at seven. Ashley works in an office from eight to five. Her parents live with them, and her mother has breakfast with the children at half past seven. But who gets up first in this family? Not Ashley, and not Kevin. It's Rocky, the old dog! Every day at quarter past five, Rocky goes to the children's room. On Sunday, the family sleeps late. But at quarter past five, Rocky is at the door again. \"Rocky, it's Sunday!\" says Max. Rocky doesn't understand. He's fourteen, and he always gets up first.","es":"La familia de Ashley es muy ocupada. De lunes a viernes, Ashley y su esposo, Kevin, se levantan a las seis. Kevin es profesor y se va al trabajo a las siete. Ashley trabaja en una oficina de ocho a cinco. Sus padres viven con ellos, y su madre desayuna con los niños a las siete y media. Pero ¿quién se levanta primero en esta familia? Ni Ashley ni Kevin. ¡Es Rocky, el perro viejo! Todos los días, a las cinco y cuarto, Rocky va al cuarto de los niños. El domingo, la familia duerme hasta tarde. Pero a las cinco y cuarto, Rocky está otra vez en la puerta. «¡Rocky, es domingo!», dice Max. Rocky no entiende. Tiene catorce años y siempre se levanta primero.","glosas":{"very":"muy","first":"primero","room":"cuarto","door":"puerta"},"preguntas":[{"q":"¿A qué hora se va Kevin al trabajo?","opts":["A las seis","A las siete","A las ocho"],"a":1},{"q":"¿Quién se levanta primero en la familia?","opts":["Rocky, el perro","Ashley","La abuela"],"a":0},{"q":"¿Qué pasa el domingo?","opts":["Rocky duerme hasta tarde","La f rything? No es una pregunta real: basta It's delicious, thanks o Good, thanks.","En Estados Unidos la propina (tip) casi nunca está incluida: se deja un 18–20 %. Para llamar al mesero se dice Excuse me!, nunca Waiter!"]}],"lecturas":[{"id":"lec-s1b04-1","tipo":"oido","titulo":"Un mensaje de voz de Mónica","texto":"Hi Martín, it's Mónica. I'm at the supermarket. Sorry, they don't have any eggs today. But they have chicken, fish and some nice tomatoes. Would you like chicken or fish for dinner? We have rice at home. Oh, and the coffee is on sale: two bags for ten dollars! See you at seven.","es":"Hola, Martín, soy Mónica. Estoy en el supermercado. Perdón, hoy no tienen huevos. Pero tienen pollo, pescado y unos tomates muy buenos. ¿Quieres pollo o pescado para la cena? Tenemos arroz en casa. Ah, y el café está en oferta: ¡dos bolsas por diez dólares! Nos vemos a las siete.","glosas":{"supermarket":"supermercado","today":"hoy"},"preguntas":[{"q":"¿Qué no tienen hoy en el supermercado?","opts":["Huevos","Pollo","Tomates"],"a":0},{"q":"¿Qué te pregunta Mónica?","opts":["Si quieres pollo o pescado para la cena","Si hay arroz en casa","A qué hora vuelves"],"a":0},{"q":"¿Qué está en oferta?","opts":["El café","El arroz","El pescado"],"a":0}]},{"id":"lec-s1b04-2","tipo":"cartel","titulo":"El menú de Joe's Café","texto":"Welcome to Joe's Café! Here is our menu. Coffee: $2. Tea: $2. Orange juice: $3. Eggs and bread: $5. Cheese sandwich: $6. Chicken salad: $8. Soup of the day: $4. Today only: chocolate cake, $3. Water is free. You can pay in cash or by card.","es":"¡Bienvenidos a Joe's Café! Este es nuestro menú. Café: 2 $. Té: 2 $. Jugo de naranja: 3 $. Huevos con pan: 5 $. Sándwich de queso: 6 $. Ensalada de pollo: 8 $. Sopa del día: 4 $. Solo hoy: pastel de chocolate, 3 $. El agua es gratis. Puedes pagar en efectivo o con tarjeta.","glosas":{"today":"hoy","only":"solo","free":"gratis"},"preguntas":[{"q":"¿Cuánto cuesta el sándwich de queso?","opts":["6 dólares","8 dólares","3 dólares"],"a":0},{"q":"¿Qué es gratis?","opts":["El agua","El café","El pastel"],"a":0},{"q":"¿Qué hay solo hoy?","opts":["Pastel de chocolate","Sopa del día","Ensalada de pollo"],"a":0}],"responder":{"consigna":"Estás en Joe's Café con Mónica. Pídele al mesero dos cosas del menú, con educación, y pregunta cuánto es.","elementos":[{"txt":"Pides con educación","claves":["i'd like","i would like","can i have","can we have"]},{"txt":"Pides algo del menú","claves":["coffee","tea","juice","egg","sandwich","salad","soup","cake","water"]},{"txt":"Preguntas el precio","claves":["how much"]}],"modelo":"Hi! Can we have a coffee and a tea, please? And a cheese sandwich. How much is it?"}}],"escritura":{"consigna":"Mónica está en el supermercado y te pregunta qué hace falta en casa. Escríbele un mensaje: qué necesitan, cuánto y qué ya tienen.","elementos":[{"txt":"Dices qué necesitan","claves":["need","can you","please"]},{"txt":"Dices una cantidad","claves":["two","three","four","six","a bottle","bottles","a dozen","some"]},{"txt":"Dices qué ya tienen o qué no hace falta","claves":["we have","don't need","do not need"]},{"txt":"Te despides","claves":["thanks","thank you","see you","bye"]}],"modelo":"Hi Mónica! We need some milk, six eggs and two bottles of water, please. We have bread and rice. Thanks! See you at home."},"biblioteca":[{"id":"bib-s1b04-1","titulo":"Té con azúcar","tipo":"texto","texto":"Every morning, Martín has breakfast at Joe's Café. He always says: \"A coffee with milk, please. No sugar, thanks.\" On Monday there is a new waiter. Martín gets a cup of tea with sugar. Oh no! But Martín is thirsty, so he drinks it. It's delicious! On Tuesday, the new waiter smiles. \"Tea with sugar for you?\" Martín smiles too. \"Yes, please,\" he says. Now Martín has tea every morning. And the waiter? He has coffee with milk. No sugar.","es":"Todas las mañanas, Martín desayuna en Joe's Café. Siempre dice: «Un café con leche, por favor. Sin azúcar, gracias». El lunes hay un mesero nuevo. A Martín le llega una taza de té con azúcar. ¡Ay, no! Pero Martín tiene sed, así que se lo toma. ¡Está delicioso! El martes, el mesero nuevo sonríe. «¿Té con azúcar para ti?». Martín también sonríe. «Sí, por favor», dice. Ahora Martín toma té todas las mañanas. ¿Y el mesero? Él toma café con leche. Sin azúcar.","glosas":{"says":"dice","now":"ahora"},"preguntas":[{"q":"¿Qué pide siempre Martín?","opts":["Café con leche, sin azúcar","Té con azúcar","Jugo de naranja"],"a":0},{"q":"¿Qué le sirve el mesero nuevo el lunes?","opts":["Té con azúcar","Café con leche","Agua"],"a":0},{"q":"¿Qué toma ahora el mesero?","opts":["Café con leche, sin azúcar","Té con azúcar","Nada"],"a":0}]},{"id":"bib-s1b04-2","titulo":"La lista de Mónica","tipo":"texto","texto":"Mónica writes a list for Martín: milk, six eggs, bread, rice and two bottles of water. Martín goes to the store, but the list is at home! He thinks: \"Milk, eggs… and what?\" He buys milk, twelve eggs, some cheese, five bananas and a chocolate cake. At home, Mónica looks at the bags. \"Where is the bread? Where is the rice? And twelve eggs?\" Martín smiles. \"Sorry. But we have a cake!\" Mónica laughs. That night, they have cake for dinner.","es":"Mónica le escribe una lista a Martín: leche, seis huevos, pan, arroz y dos botellas de agua. Martín va a la tienda, ¡pero la lista está en casa! Piensa: «Leche, huevos… ¿y qué más?». Compra leche, doce huevos, queso, cinco plátanos y un pastel de chocolate. En casa, Mónica mira las bolsas. «¿Dónde está el pan? ¿Dónde está el arroz? ¿Y doce huevos?». Martín sonríe. «Perdón. ¡Pero tenemos un pastel!». Mónica se ríe. Esa noche cenan pastel.","glosas":{"writes":"escribe","list":"lista","store":"tienda","buys":"compra","laughs":"se ríe"},"preguntas":[{"q":"¿Qué problema tiene Martín en la tienda?","opts":["La lista está en casa","No tiene dinero","La tienda está cerrada"],"a":0},{"q":"¿Qué no compra Martín?","opts":["Pan y arroz","Huevos","Queso"],"a":0},{"q":"¿Qué cenan esa noche?","opts":["Pastel","Arroz con huevo","Pan con queso"],"a":0}]},{"id":"bib-s1b04-3","titulo":"Solo efectivo","tipo":"audio","texto":"It's Friday night. Martín and Mónica are at a small restaurant. The waiter says, \"Welcome! A table for two?\" They order soup, fish and a chicken salad. Mónica has a glass of orange juice, and Martín has a bottle of water. The fish is delicious. Then the waiter brings the check: forty dollars. \"Can I pay by card?\" Martín asks. \"Sorry, cash only,\" says the waiter. Martín doesn't have any cash! Mónica smiles and opens her bag. \"Here you are,\" she says. \"I have cash.\"","es":"Es viernes por la noche. Martín y Mónica están en un restaurante pequeño. El mesero dice: «¡Bienvenidos! ¿Mesa para dos?». Piden sopa, pescado y una ensalada de pollo. Mónica toma un vaso de jugo de naranja y Martín, una botella de agua. El pescado está delicioso. Luego el mesero trae la cuenta: cuarenta dólares. «¿Puedo pagar con tarjeta?», pregunta Martín. «Lo siento, solo efectivo», dice el mesero. ¡Martín no tiene efectivo! Mónica sonríe y abre su bolso. «Aquí tiene», dice. «Yo tengo efectivo».","glosas":{"small":"pequeño","restaurant":"restaurante","says":"dice","then":"luego","brings":"trae","asks":"pregunta","only":"solo"},"preguntas":[{"q":"¿Cuánto cuesta la cena?","opts":["Cuarenta dólares","Catorce dólares","Cuatro dólares"],"a":0},{"q":"¿Por qué Martín no puede pagar?","opts":["Solo aceptan efectivo y él no tiene","No tiene su tarjeta","El mesero no trae la cuenta"],"a":0},{"q":"¿Quién paga al final?","opts":["Mónica","Martín","El mesero"],"a":0}]},{"id":"bib-s1b04-4","titulo":"La sopa de la vecina","tipo":"texto","texto":"Mrs. Kowalski lives near Martín and Mónica. On Sunday, she comes with a big pot of chicken soup. \"From Poland!\" she says. Martín and Mónica are hungry, and the soup is delicious. \"How much is it?\" Martín asks. Mrs. Kowalski laughs. \"Nothing! But on Saturday, you have dinner with me.\" On Saturday there is soup again, and fish, and meat, and rice, and cake. Martín and Mónica eat and eat. At ten o'clock, Mrs. Kowalski says, \"Anything else?\" Martín smiles. \"No, thanks. That's all!\"","es":"Mrs. Kowalski vive cerca de Martín y Mónica. El domingo llega con una olla grande de sopa de pollo. «¡De Polonia!», dice. Martín y Mónica tienen hambre y la sopa está deliciosa. «¿Cuánto es?», pregunta Martín. Mrs. Kowalski se ríe. «¡Nada! Pero el sábado ustedes cenan conmigo». El sábado hay sopa otra vez, y pescado, y carne, y arroz, y pastel. Martín y Mónica comen y comen. A las diez, Mrs. Kowalski dice: «¿Algo más?». Martín sonríe. «No, gracias. ¡Es todo!».","glosas":{"comes":"llega","big":"grande","pot":"olla","says":"dice","asks":"pregunta","laughs":"se ríe","eat":"comer"},"preguntas":[{"q":"¿Qué lleva Mrs. Kowalski el domingo?","opts":["Sopa de pollo","Pastel","Pescado"],"a":0},{"q":"¿Cuánto les cobra por la sopa?","opts":["Nada","Diez dólares","Cinco dólares"],"a":0},{"q":"¿Qué pasa el sábado?","opts":["Cenan con ella y comen mucho","Ella cena en su casa","Cocinan sopa para ella"],"a":0}]},{"id":"bib-s1b04-5","titulo":"El mesero se llama Martín","tipo":"texto","texto":"It's Saturday evening. Martín and his wife have dinner with his mother and father at a restaurant. \"Good evening! Would you like a drink?\" says the waiter. Martín says, \"This is my family. This is my mother. She's a teacher. And this is my father. He's a doctor. My parents are from Lima.\" \"Nice to meet you,\" says his mother. \"Nice to meet you too! I'm from Spain. My name is Martín López.\" Martín's father laughs. \"Martín López? That's my son's name too!\" \"Dad, he's my friend from English class. He's Martín Two!\" They have fish, chicken and rice, and the food is delicious. After dinner, the waiter comes with a cake. \"For my friend Martín One and his family!\"","es":"Es sábado por la noche. Martín y su esposa cenan con la madre y el padre de él en un restaurante. «¡Buenas noches! ¿Quieren algo de tomar?», dice el mesero. Martín dice: «Esta es mi familia. Esta es mi madre. Es profesora. Y este es mi padre. Es médico. Mis padres son de Lima». «Mucho gusto», dice su madre. «¡Mucho gusto también! Soy de España. Me llamo Martín López». El padre de Martín se ríe. «¿Martín López? ¡Mi hijo también se llama así!». «Papá, es mi amigo de la clase de inglés. ¡Es Martín Dos!». Comen pescado, pollo y arroz, y la comida está deliciosa. Después de la cena, el mesero llega con un pastel. «¡Para mi amigo Martín Uno y su familia!».","glosas":{"restaurant":"restaurante","laughs":"se ríe","comes":"llega"},"preguntas":[{"q":"¿Con quién cenan Martín y su esposa?","opts":["Con Jake y Mrs. Kowalski","Con los padres de Martín","Con Linda"],"a":1},{"q":"¿Por qué se ríe el padre de Martín?","opts":["Porque el mesero se llama igual que su hijo","Porque la comida es mala","Porque el mesero no habla español"],"a":0},{"q":"¿Qué trae el mesero después de la cena?","opts":["La cuenta","Un café con leche","Un pastel"],"a":2}]}],"lecciones":[[{"tipo":"significado","nuevo":true,"en":"coffee","opts":["mujer","joven","café"],"a":"café","items":["coffee"]},{"tipo":"significado","nuevo":true,"en":"tea","opts":["té","personas","madre"],"a":"té","items":["tea"]},{"tipo":"significado","nuevo":true,"en":"water","opts":["agua","sábado","estudiante"],"a":"agua","items":["water"]},{"tipo":"tarjeta","en":"I'd like a coffee, please.","es":"Quisiera un café, por favor.","nota":"I'd like (I would like) es «quisiera»: la forma educada de pedir.","items":["id-like-a-coffee"]},{"tipo":"tarjeta","en":"A tea, please.","es":"Un té, por favor.","nota":null,"items":["a-tea-please"]},{"tipo":"emparejar","pares":[["coffee","café"],["tea","té"],["water","agua"]],"items":["coffee","tea","water"]},{"tipo":"nota","nota":"Para pedir se usa I'd like, «quisiera». I want a coffee suena brusco, aunque «quiero un café» sea normal en español. Ojo: I like es «me gusta», no «quisiera».","items":[]},{"tipo":"emparejar","pares":[["I'd like a coff
